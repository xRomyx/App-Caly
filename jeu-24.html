<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Assemble le mot 💎</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvRCxPT2W7djJcHSR9kweBnaNXYQtdZqo",
      authDomain: "app-caly.firebaseapp.com",
      databaseURL: "https://app-caly-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "app-caly",
      storageBucket: "app-caly.firebasestorage.app",
      messagingSenderId: "870451326147",
      appId: "1:870451326147:web:465cff6467b66efeda4676"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const DB_PATH = new URLSearchParams(window.location.search).has('test') ? 'calyApp-test' : 'calyApp';
    const isTest = DB_PATH === 'calyApp-test';
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #001220 0%, #002540 50%, #001220 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 16px 40px; color: #fff; overflow-x: hidden;
    }

    .test-banner {
      background: #ff9800; color: #fff; padding: 6px 14px;
      border-radius: 10px; text-align: center; font-weight: bold;
      margin-bottom: 10px; font-size: 13px; width: 100%; max-width: 480px;
    }

    .game-header { text-align: center; margin-bottom: 18px; width: 100%; max-width: 480px; }
    .game-title {
      font-size: 26px; font-weight: 900;
      background: linear-gradient(135deg, #67e8f9, #22d3ee, #a5f3fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 10px;
    }
    .progress-bar-wrap {
      background: rgba(255,255,255,0.1);
      border-radius: 50px; height: 10px; width: 100%; margin-bottom: 6px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #22d3ee, #67e8f9);
      height: 100%; border-radius: 50px; transition: width 0.4s ease;
    }
    .progress-text { font-size: 13px; color: rgba(255,255,255,0.6); }

    /* Étoiles fond */
    .star-bg { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: -1; }
    .star { position: absolute; border-radius: 50%; background: #fff; }
    @keyframes twinkle {
      0%,100% { opacity: 0.15; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.4); }
    }

    /* Carte du jeu */
    .game-card {
      background: rgba(255,255,255,0.04);
      border: 1.5px solid rgba(103,232,249,0.2);
      border-radius: 20px;
      padding: 24px 20px;
      width: 100%; max-width: 420px;
      display: flex; flex-direction: column; align-items: center; gap: 16px;
    }

    /* Emoji */
    .emoji-big { font-size: 72px; line-height: 1; animation: bumpIn 0.4s ease; }
    @keyframes bumpIn {
      0% { transform: scale(0.5); opacity: 0; }
      70% { transform: scale(1.15); }
      100% { transform: scale(1); opacity: 1; }
    }

    /* Texte indice */
    .hint-text { font-size: 14px; color: rgba(255,255,255,0.55); text-align: center; font-style: italic; }

    /* Zone d'assemblage */
    .assembly-zone {
      display: flex; gap: 8px; justify-content: center; flex-wrap: wrap;
      min-height: 60px; align-items: center; width: 100%;
    }
    .slot {
      min-width: 64px; height: 54px;
      border: 2px dashed rgba(103,232,249,0.35);
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; font-weight: 900; color: #fff;
      background: rgba(103,232,249,0.04);
      padding: 0 12px;
      letter-spacing: 1px;
      transition: border-color 0.2s;
    }
    .slot.filled {
      border: 2px solid #22d3ee;
      background: linear-gradient(135deg, rgba(34,211,238,0.18), rgba(103,232,249,0.1));
      animation: slotFill 0.3s ease;
    }
    @keyframes slotFill {
      0% { transform: scale(0.75); }
      70% { transform: scale(1.1); }
      100% { transform: scale(1); }
    }

    /* Boutons syllabes */
    .syllables-grid {
      display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; width: 100%;
    }
    .syl-btn {
      padding: 15px 24px;
      border: 2px solid rgba(103,232,249,0.3);
      border-radius: 16px;
      font-size: 20px; font-weight: 900;
      cursor: pointer;
      background: linear-gradient(135deg, rgba(34,211,238,0.1), rgba(103,232,249,0.06));
      color: #fff;
      transition: all 0.2s ease;
      min-width: 72px; text-align: center;
      letter-spacing: 1px;
    }
    .syl-btn:hover:not(.used) {
      background: linear-gradient(135deg, rgba(34,211,238,0.28), rgba(103,232,249,0.18));
      border-color: #22d3ee;
      transform: translateY(-3px);
    }
    .syl-btn:active:not(.used) { transform: scale(0.94); }
    .syl-btn.used { opacity: 0.2; cursor: default; pointer-events: none; }
    .syl-btn.shake { animation: shake 0.4s ease; }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20% { transform: translateX(-9px); }
      40% { transform: translateX(9px); }
      60% { transform: translateX(-6px); }
      80% { transform: translateX(5px); }
    }

    /* Feedback */
    .feedback { font-size: 20px; font-weight: 700; text-align: center; min-height: 30px; }

    /* Bouton suivant */
    .btn-next {
      padding: 15px 36px; border: none; border-radius: 50px;
      font-size: 18px; font-weight: 800; cursor: pointer;
      background: linear-gradient(135deg, #22d3ee, #67e8f9);
      color: #001220;
      display: none;
      animation: bumpIn 0.3s ease;
      box-shadow: 0 4px 20px rgba(34,211,238,0.4);
    }

    /* Confetti */
    .confetti-container { position: fixed; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:100; overflow:hidden; }
    .confetti-piece { position:absolute; width:9px; height:9px; border-radius:2px; animation: confFall var(--dur,1.4s) ease-in forwards; }
    @keyframes confFall {
      0% { transform: translateY(-10px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* Écran résultat */
    .result-screen {
      display: none; flex-direction: column; align-items: center;
      gap: 20px; padding: 20px; text-align: center; width: 100%; max-width: 420px;
    }
    .result-title { font-size: 30px; font-weight: 900; }
    .result-stars { display: flex; gap: 10px; justify-content: center; }
    .result-star { font-size: 40px; animation: starPop 0.4s ease backwards; }
    @keyframes starPop {
      0% { transform: scale(0) rotate(-20deg); opacity: 0; }
      70% { transform: scale(1.3) rotate(5deg); }
      100% { transform: scale(1) rotate(0); opacity: 1; }
    }
    .result-score { font-size: 16px; color: rgba(255,255,255,0.7); }
    .btn-submit {
      padding: 16px 36px; border: none; border-radius: 50px;
      font-size: 18px; font-weight: 800; cursor: pointer;
      background: linear-gradient(135deg, #22d3ee, #67e8f9);
      color: #001220;
      box-shadow: 0 4px 20px rgba(34,211,238,0.4);
    }
    .btn-home {
      padding: 12px 28px;
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 50px; font-size: 15px; font-weight: 700;
      cursor: pointer; background: transparent; color: #fff;
    }
  </style>
</head>
<body>

  <div class="confetti-container" id="confettiContainer"></div>
  <div class="star-bg" id="starBg"></div>

  <div id="testBanner" class="test-banner" style="display:none">🧪 MODE TEST — données non réelles</div>

  <div class="game-header">
    <div class="game-title">💎 Assemble le mot</div>
    <div class="progress-bar-wrap">
      <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
    </div>
    <div class="progress-text" id="progressText">Mot 1 / 10</div>
  </div>

  <div class="game-card" id="gameCard">
    <div class="emoji-big" id="emojiDisplay"></div>
    <div class="hint-text" id="hintText">Dans quel ordre vont ces syllabes ?</div>
    <div class="assembly-zone" id="assemblyZone"></div>
    <div class="syllables-grid" id="syllablesGrid"></div>
    <div class="feedback" id="feedback"></div>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Suivant →</button>
  </div>

  <div class="result-screen" id="resultScreen">
    <div class="result-title" id="resultTitle"></div>
    <div class="result-stars" id="resultStars"></div>
    <div class="result-score" id="resultScore"></div>
    <button class="btn-submit" onclick="submitStars()">Envoyer mes étoiles !</button>
    <button class="btn-home" onclick="goHome()">← Retour aux jeux</button>
  </div>

  <script>
    if (isTest) document.getElementById('testBanner').style.display = 'block';

    // Fond étoilé
    (function() {
      const bg = document.getElementById('starBg');
      for (let i = 0; i < 60; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        const size = Math.random() * 2.5 + 0.5;
        s.style.cssText = 'width:' + size + 'px;height:' + size + 'px;top:' + (Math.random()*100) + '%;left:' + (Math.random()*100) + '%;animation:twinkle ' + (2 + Math.random()*3) + 's ' + (Math.random()*3) + 's ease-in-out infinite;';
        bg.appendChild(s);
      }
    })();

    // Pool de mots avec syllabes
    const ALL_WORDS = [
      { emoji: '🐱', word: 'CHATON',    syllables: ['CHA', 'TON'] },
      { emoji: '🐰', word: 'LAPIN',     syllables: ['LA', 'PIN'] },
      { emoji: '🦋', word: 'PAPILLON',  syllables: ['PA', 'PIL', 'LON'] },
      { emoji: '🏠', word: 'MAISON',    syllables: ['MAI', 'SON'] },
      { emoji: '🌙', word: 'LUNE',      syllables: ['LU', 'NE'] },
      { emoji: '🎂', word: 'GÂTEAU',    syllables: ['GÂ', 'TEAU'] },
      { emoji: '🐉', word: 'DRAGON',    syllables: ['DRA', 'GON'] },
      { emoji: '🦄', word: 'LICORNE',   syllables: ['LI', 'COR', 'NE'] },
      { emoji: '⭐', word: 'ÉTOILE',    syllables: ['É', 'TOI', 'LE'] },
      { emoji: '🚗', word: 'VOITURE',   syllables: ['VOI', 'TU', 'RE'] },
      { emoji: '🐘', word: 'ÉLÉPHANT',  syllables: ['É', 'LÉ', 'PHANT'] },
      { emoji: '☀️', word: 'SOLEIL',    syllables: ['SO', 'LEIL'] },
      { emoji: '🎈', word: 'BALLON',    syllables: ['BAL', 'LON'] },
      { emoji: '🐴', word: 'CHEVAL',    syllables: ['CHE', 'VAL'] },
      { emoji: '🐷', word: 'COCHON',    syllables: ['CO', 'CHON'] },
      { emoji: '🦊', word: 'RENARD',    syllables: ['RE', 'NARD'] },
      { emoji: '🐦', word: 'OISEAU',    syllables: ['OI', 'SEAU'] },
      { emoji: '🌻', word: 'JARDIN',    syllables: ['JAR', 'DIN'] },
      { emoji: '🏰', word: 'CHÂTEAU',   syllables: ['CHÂ', 'TEAU'] },
      { emoji: '🎩', word: 'CHAPEAU',   syllables: ['CHA', 'PEAU'] },
      { emoji: '🤖', word: 'ROBOT',     syllables: ['RO', 'BOT'] },
      { emoji: '☁️', word: 'NUAGE',     syllables: ['NU', 'AGE'] },
    ];

    const TOTAL_Q = 10;
    let questions = [];
    let currentQ = 0;
    let score = 0;             // mots assemblés correctement du premier coup
    let currentSlot = 0;       // prochain emplacement à remplir
    let assembledSyllables = []; // syllabes dans l'ordre tapé par Caly

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function startGame() {
      questions = shuffle([...ALL_WORDS]).slice(0, TOTAL_Q);
      currentQ = 0;
      score = 0;
      loadQuestion();
    }

    function loadQuestion() {
      const q = questions[currentQ];
      currentSlot = 0;
      assembledSyllables = [];

      // Barre de progression
      document.getElementById('progressBar').style.width = ((currentQ / TOTAL_Q) * 100) + '%';
      document.getElementById('progressText').textContent = 'Mot ' + (currentQ + 1) + ' / ' + TOTAL_Q;

      // Emoji (re-animation)
      const emojiEl = document.getElementById('emojiDisplay');
      emojiEl.style.animation = 'none';
      void emojiEl.offsetWidth;
      emojiEl.style.animation = '';
      emojiEl.textContent = q.emoji;

      // Texte indice
      document.getElementById('hintText').textContent = 'Dans quel ordre vont ces syllabes ?';

      // Cases vides
      const zone = document.getElementById('assemblyZone');
      zone.innerHTML = '';
      for (let i = 0; i < q.syllables.length; i++) {
        const slot = document.createElement('div');
        slot.className = 'slot';
        slot.id = 'slot-' + i;
        zone.appendChild(slot);
      }

      // Boutons syllabes (mélangés)
      const grid = document.getElementById('syllablesGrid');
      grid.innerHTML = '';
      const shuffledSyls = shuffle([...q.syllables]);
      shuffledSyls.forEach(function(text) {
        const btn = document.createElement('button');
        btn.className = 'syl-btn';
        btn.textContent = text;
        btn.addEventListener('click', function() { tapSyllable(btn, text); });
        grid.appendChild(btn);
      });

      // Feedback + bouton suivant
      document.getElementById('feedback').textContent = '';
      document.getElementById('feedback').style.color = '';
      document.getElementById('btnNext').style.display = 'none';

      // Lecture du mot
      speakText(q.word);
    }

    function tapSyllable(btn, text) {
      if (btn.classList.contains('used')) return;
      const q = questions[currentQ];
      if (currentSlot >= q.syllables.length) return;

      // Placer la syllabe sans valider l'ordre
      btn.classList.add('used');
      assembledSyllables.push(text);
      const slot = document.getElementById('slot-' + currentSlot);
      slot.textContent = text;
      slot.classList.add('filled');
      playSound(true);
      currentSlot++;

      // Toutes les cases remplies → vérifier à la fin
      if (currentSlot === q.syllables.length) {
        checkWord();
      }
    }

    function checkWord() {
      const q = questions[currentQ];
      const correct = assembledSyllables.every(function(s, i) { return s === q.syllables[i]; });

      if (correct) {
        score++;
        wordComplete(q.word);
      } else {
        // Colorier les cases : vert si bonne place, rouge si mauvaise
        assembledSyllables.forEach(function(s, i) {
          const slot = document.getElementById('slot-' + i);
          if (s === q.syllables[i]) {
            slot.style.borderColor = '#4ade80';
            slot.style.background = 'rgba(74,222,128,0.15)';
          } else {
            slot.style.borderColor = '#f87171';
            slot.style.background = 'rgba(248,113,113,0.15)';
          }
        });
        const fb = document.getElementById('feedback');
        fb.textContent = '❌ C\'était : ' + q.word;
        fb.style.color = '#f87171';
        playSound(false);
        document.getElementById('btnNext').style.display = 'inline-block';
        setTimeout(function() { speakText(q.word); }, 400);
      }
    }

    function wordComplete(word) {
      document.getElementById('hintText').textContent = '✨ ' + word + ' ✨';
      const fb = document.getElementById('feedback');
      fb.textContent = '⭐ Parfait !';
      fb.style.color = '#4ade80';
      document.getElementById('btnNext').style.display = 'inline-block';
      spawnConfetti();
      setTimeout(function() { speakText(word); }, 400);
    }

    function nextQuestion() {
      currentQ++;
      if (currentQ >= TOTAL_Q) {
        showResult();
      } else {
        loadQuestion();
      }
    }

    function getStars(s) {
      if (s >= 8) return 2;
      if (s >= 5) return 1;
      return 0;
    }

    function showResult() {
      document.getElementById('gameCard').style.display = 'none';
      const rs = document.getElementById('resultScreen');
      rs.style.display = 'flex';

      document.getElementById('progressBar').style.width = '100%';
      document.getElementById('progressText').textContent = 'Terminé ! 🎉';

      const stars = getStars(score);
      const titles = ['Continue d\'essayer ! 💪', 'Bien essayé ! 🌟', 'Super ! ✨', 'Excellent ! 🎊', 'PARFAIT ! 💎'];
      document.getElementById('resultTitle').textContent = titles[stars];

      const starsEl = document.getElementById('resultStars');
      starsEl.innerHTML = '';
      for (let i = 0; i < 2; i++) {
        const s = document.createElement('span');
        s.className = 'result-star';
        s.textContent = i < stars ? '⭐' : '☆';
        s.style.animationDelay = (i * 0.15) + 's';
        s.style.opacity = i < stars ? '1' : '0.3';
        starsEl.appendChild(s);
      }

      document.getElementById('resultScore').textContent =
        score + ' mot' + (score > 1 ? 's' : '') + ' parfait' + (score > 1 ? 's' : '') + ' sur ' + TOTAL_Q;

      spawnConfetti();
      setTimeout(function() {
        speakText('Bravo ! Tu as gagné ' + stars + ' étoile' + (stars > 1 ? 's' : '') + ' !');
      }, 600);
    }

    function submitStars() {
      const stars = getStars(score);
      if (stars === 0) { goHome(); return; }
      const ref = db.ref(DB_PATH + '/pendingGameStars');
      ref.once('value').then(function(snap) {
        let list = snap.val();
        if (!list) list = [];
        else if (!Array.isArray(list)) list = Object.values(list);
        list.push({
          id: Date.now(),
          game: 'Assemble le mot 💎',
          stars: stars,
          date: new Date().toLocaleDateString('fr-FR')
        });
        return ref.set(list);
      }).then(function() { goHome(); }).catch(function() { goHome(); });
    }

    function goHome() {
      window.location.href = isTest ? 'jeux.html?test' : 'jeux.html';
    }

    // Audio
    var audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      return audioCtx;
    }
    function playSound(ok) {
      try {
        var ctx = getAudioCtx();
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (ok) {
          osc.frequency.setValueAtTime(523, ctx.currentTime);
          osc.frequency.setValueAtTime(659, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.28);
          osc.start(); osc.stop(ctx.currentTime + 0.28);
        } else {
          osc.frequency.setValueAtTime(200, ctx.currentTime);
          gain.gain.setValueAtTime(0.15, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.22);
          osc.start(); osc.stop(ctx.currentTime + 0.22);
        }
      } catch(e) {}
    }

    // Synthèse vocale
    function speakText(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      var utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'fr-FR';
      utt.rate = 0.88;
      utt.pitch = 1.1;
      window.speechSynthesis.speak(utt);
    }

    // Confetti
    function spawnConfetti() {
      var container = document.getElementById('confettiContainer');
      var colors = ['#22d3ee', '#67e8f9', '#a5f3fc', '#fbbf24', '#f472b6', '#4ade80', '#a78bfa', '#fff'];
      for (var i = 0; i < 45; i++) {
        var c = document.createElement('div');
        c.className = 'confetti-piece';
        c.style.left = (Math.random() * 100) + '%';
        c.style.background = colors[Math.floor(Math.random() * colors.length)];
        c.style.setProperty('--dur', (1.1 + Math.random() * 0.9) + 's');
        c.style.animationDelay = (Math.random() * 0.5) + 's';
        container.appendChild(c);
        setTimeout(function(el) { el.remove(); }, 2600, c);
      }
    }

    // Démarrage
    startGame();
  </script>
</body>
</html>
