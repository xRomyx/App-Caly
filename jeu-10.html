<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Le cirque des contraires 🤡</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvRCxPT2W7djJcHSR9kweBnaNXYQtdZqo",
      authDomain: "app-caly.firebaseapp.com",
      databaseURL: "https://app-caly-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "app-caly",
      storageBucket: "app-caly.firebasestorage.app",
      messagingSenderId: "870451326147",
      appId: "1:870451326147:web:465cff6467b66efeda4676"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const DB_PATH = new URLSearchParams(window.location.search).has('test') ? 'calyApp-test' : 'calyApp';
    const isTest = DB_PATH === 'calyApp-test';
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #2d0a00 0%, #5c1500 50%, #2d0a00 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 16px 40px; color: #fff; overflow-x: hidden;
    }
    .test-banner {
      background: #ff9800; color: #fff; padding: 6px 14px;
      border-radius: 10px; text-align: center; font-weight: bold;
      margin-bottom: 10px; font-size: 13px; width: 100%; max-width: 480px;
    }
    .game-header { text-align: center; margin-bottom: 18px; width: 100%; max-width: 480px; }
    .game-title {
      font-size: 28px; font-weight: 900;
      background: linear-gradient(135deg, #fde68a, #f472b6, #a78bfa, #fde68a);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 10px;
    }
    .progress-bar-wrap {
      background: rgba(255,255,255,0.1);
      border-radius: 50px; height: 10px; width: 100%; margin-bottom: 6px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #f97316, #fde68a, #f472b6);
      height: 100%; border-radius: 50px; transition: width 0.4s ease;
    }
    .progress-text { font-size: 13px; color: rgba(255,255,255,0.6); }

    /* Carte question */
    .circus-card {
      background: rgba(249,115,22,0.08);
      border: 2px solid rgba(253,230,138,0.3);
      border-radius: 28px; padding: 26px 18px 22px;
      width: 100%; max-width: 480px;
      text-align: center; position: relative; margin-bottom: 24px;
    }
    .circus-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 5px;
      background: repeating-linear-gradient(
        90deg, #ef4444 0px, #ef4444 20px, #fde68a 20px, #fde68a 40px,
        #60a5fa 40px, #60a5fa 60px, #f472b6 60px, #f472b6 80px
      );
      border-radius: 28px 28px 0 0;
    }

    .card-label {
      font-size: 13px; color: rgba(255,255,255,0.55);
      text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px;
    }

    /* Affichage du mot à l'envers */
    .show-emoji {
      font-size: 72px; display: block; margin-bottom: 8px;
      animation: popIn 0.4s ease both;
      filter: drop-shadow(0 0 16px rgba(253,230,138,0.5));
    }
    .show-word {
      font-size: 38px; font-weight: 900; color: #fde68a;
      letter-spacing: 4px; margin-bottom: 6px;
      animation: popIn 0.4s ease both;
      text-shadow: 0 2px 12px rgba(253,230,138,0.4);
    }
    @keyframes popIn {
      0%   { transform: scale(0.5) rotate(-5deg); opacity: 0; }
      70%  { transform: scale(1.08) rotate(2deg); }
      100% { transform: scale(1) rotate(0deg);    opacity: 1; }
    }

    .question-line {
      font-size: 16px; color: rgba(255,255,255,0.65); margin-bottom: 10px;
    }

    .speak-btn {
      background: rgba(253,230,138,0.15);
      border: 2px solid rgba(253,230,138,0.35);
      border-radius: 50px; color: #fde68a; font-size: 14px;
      padding: 7px 18px; cursor: pointer; transition: background 0.2s;
    }
    .speak-btn:active { background: rgba(253,230,138,0.35); }

    /* Boutons réponses — 3 colonnes */
    .answers-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 12px; width: 100%; max-width: 480px; margin-bottom: 20px;
    }
    .answer-btn {
      border-radius: 18px;
      border: 3px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff;
      cursor: pointer; transition: transform 0.1s;
      box-shadow: 0 3px 14px rgba(0,0,0,0.3);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 14px 8px; gap: 6px;
    }
    .answer-btn .btn-emoji { font-size: 40px; }
    .answer-btn .btn-word  { font-size: 13px; font-weight: 900; letter-spacing: 1px; }
    .answer-btn:active:not(:disabled) { transform: scale(0.93); }
    .answer-btn:disabled { cursor: default; }
    .answer-btn.correct {
      background: linear-gradient(135deg, #16a34a, #15803d) !important;
      border-color: #86efac !important; transform: scale(1.06) !important;
      box-shadow: 0 0 28px rgba(34,197,94,0.85) !important;
      animation: bumpIn 0.35s ease;
    }
    .answer-btn.wrong {
      background: linear-gradient(135deg, #dc2626, #b91c1c) !important;
      border-color: #fca5a5 !important;
      box-shadow: 0 0 22px rgba(239,68,68,0.8) !important;
      animation: shake 0.45s ease;
    }

    .feedback-zone {
      min-height: 54px; text-align: center;
      width: 100%; max-width: 480px; margin-bottom: 10px;
    }
    .feedback-msg {
      font-size: 17px; font-weight: bold;
      padding: 12px 18px; border-radius: 16px;
      animation: bumpIn 0.3s ease; line-height: 1.4;
    }
    .feedback-msg.correct { background: rgba(34,197,94,0.2);  color: #86efac; }
    .feedback-msg.wrong   { background: rgba(239,68,68,0.2);  color: #fca5a5; }

    .btn-next {
      display: none; width: 100%; max-width: 480px;
      padding: 18px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, #f97316, #ef4444);
      color: #fff; font-size: 22px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 20px rgba(249,115,22,0.45);
      margin-bottom: 20px;
    }

    .result-screen { display: none; text-align: center; width: 100%; max-width: 480px; }
    .result-title {
      font-size: 36px; font-weight: 900;
      background: linear-gradient(135deg, #fde68a, #f472b6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 14px;
    }
    .stars-earned { font-size: 56px; margin: 14px 0; animation: bumpUp 0.6s ease; min-height: 70px; }
    .score-detail { font-size: 18px; color: rgba(255,255,255,0.65); margin-bottom: 22px; }
    .submit-msg   { font-size: 14px; color: rgba(255,255,255,0.5);  margin-bottom: 18px; min-height: 22px; }
    .btn-retour {
      width: 100%; padding: 18px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, #fde68a, #f59e0b);
      color: #2d0a00; font-size: 20px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 20px rgba(253,230,138,0.4);
    }

    .confetti-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 100; overflow: hidden; }
    .confetti-piece { position: absolute; border-radius: 2px; animation: confettiFall linear forwards; }
    @keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    .star-bg { position: fixed; pointer-events: none; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; z-index: 0; }
    .star-bg span { position: absolute; animation: twinkle linear infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 0.7; transform: scale(1.3); } }
    .content { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; align-items: center; }
    @keyframes bumpIn { 0% { transform: scale(0.85); opacity: 0; } 70% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes bumpUp { 0% { transform: translateY(30px) scale(0.5); opacity: 0; } 60% { transform: translateY(-10px) scale(1.1); } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  </style>
</head>
<body>
  <div class="star-bg" id="starBg"></div>
  <div class="confetti-container" id="confettiContainer"></div>

  <div class="content">
    <div id="testBanner"></div>

    <div class="game-header">
      <div class="game-title">🤡 Le cirque des contraires</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
      </div>
      <div class="progress-text" id="progressText">Question 1 / 10</div>
    </div>

    <div class="circus-card" id="circusCard">
      <div class="card-label">🤡 Quel est le contraire ?</div>
      <span class="show-emoji" id="showEmoji"></span>
      <div class="show-word"   id="showWord"></div>
      <div class="question-line">↕️ Son contraire, c'est...</div>
      <button class="speak-btn" onclick="speakQ()">🔊 Réécouter</button>
    </div>

    <div class="answers-grid" id="answersGrid"></div>
    <div class="feedback-zone" id="feedbackZone"></div>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Suivant →</button>

    <div class="result-screen" id="resultScreen">
      <div class="result-title" id="resultTitle"></div>
      <div class="stars-earned" id="starsEarned"></div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="submit-msg" id="submitMsg"></div>
      <button class="btn-retour" onclick="goBack()">🎮 Retour aux jeux</button>
    </div>
  </div>

  <script>
    const bg = document.getElementById('starBg');
    const bgChars = ['🎪','✨','⭐','🎈','🎀','✦','·','⋆'];
    for (let i = 0; i < 30; i++) {
      const s = document.createElement('span');
      s.textContent = bgChars[Math.floor(Math.random()*bgChars.length)];
      s.style.left     = Math.random()*100 + '%';
      s.style.top      = Math.random()*100 + '%';
      s.style.fontSize = (10 + Math.random()*12) + 'px';
      s.style.animationDuration = (3 + Math.random()*5) + 's';
      s.style.animationDelay    = (Math.random()*5) + 's';
      bg.appendChild(s);
    }
    if (isTest) document.getElementById('testBanner').innerHTML = '<div class="test-banner">🧪 VERSION TEST</div>';

    // Paires de contraires : [mot, emoji, contraire, emojiContraire]
    const PAIRS = [
      ['GRAND',    '🏔️', 'PETIT',    '🐭'],
      ['CHAUD',    '🔥', 'FROID',    '🧊'],
      ['RAPIDE',   '🐆', 'LENT',     '🐢'],
      ['JOUR',     '☀️', 'NUIT',     '🌙'],
      ['HEUREUX',  '😄', 'TRISTE',   '😢'],
      ['PROPRE',   '🛁', 'SALE',     '🦨'],
      ['PLEIN',    '🪣', 'VIDE',     '🫙'],
      ['OUVERT',   '🚪', 'FERMÉ',    '🔒'],
      ['LÉGER',    '🪶', 'LOURD',    '🪨'],
      ['DOUX',     '☁️', 'DUR',      '💎'],
      ['ALLUMÉ',   '💡', 'ÉTEINT',   '🌑'],
      ['VIEUX',    '👴', 'JEUNE',    '👶'],
      ['FORT',     '💪', 'FAIBLE',   '😴'],
      ['HAUT',     '🏔️', 'BAS',      '🏕️'],
      ['LONG',     '🐍', 'COURT',    '🐛'],
      ['AVANT',    '⬅️', 'APRÈS',    '➡️'],
      ['PREMIER',  '🥇', 'DERNIER',  '🏁'],
      ['CALME',    '🧘', 'AGITÉ',    '🤪'],
      ['COURAGEUX','🦁', 'PEUREUX',  '😱'],
      ['RICHE',    '💰', 'PAUVRE',   '🪙'],
    ];

    const TOTAL_Q  = 10;
    let selectedQ  = [];
    let currentQ   = 0;
    let score      = 0;
    let correctIdx = -1;
    let answered   = false;
    let currentQ_data = null;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'fr-FR'; utt.rate = 0.88; utt.pitch = 1.1;
      window.speechSynthesis.speak(utt);
    }

    function speakQ() {
      if (currentQ_data) speak(currentQ_data.speechText);
    }

    function playSound(correct) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (correct) {
          [523,659,784,1047].forEach((freq, i) => {
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = freq; osc.type = 'sine';
            gain.gain.setValueAtTime(0.25, ctx.currentTime + i*0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.1 + 0.25);
            osc.start(ctx.currentTime + i*0.1); osc.stop(ctx.currentTime + i*0.1 + 0.25);
          });
        } else {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = 200; osc.type = 'sawtooth';
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
          osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.45);
        }
      } catch(e) {}
    }

    function launchConfetti() {
      const container = document.getElementById('confettiContainer');
      const colors = ['#fde68a','#f472b6','#60a5fa','#a78bfa','#34d399','#ef4444','#fff'];
      for (let i = 0; i < 50; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random()*100 + '%';
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDuration = (1.5 + Math.random()*2) + 's';
        piece.style.animationDelay    = (Math.random()*0.5) + 's';
        const size = 8 + Math.random()*10;
        piece.style.width = size+'px'; piece.style.height = size+'px';
        container.appendChild(piece);
        setTimeout(() => piece.remove(), 3800);
      }
    }

    function buildQuestion(pairIdx, showFirst) {
      const pair = PAIRS[pairIdx];
      const [wordA, emojiA, wordB, emojiB] = pair;
      // showFirst=true → affiche A, cherche B
      const showWord  = showFirst ? wordA  : wordB;
      const showEmoji = showFirst ? emojiA : emojiB;
      const ansWord   = showFirst ? wordB  : wordA;
      const ansEmoji  = showFirst ? emojiB : emojiA;
      const speechText = 'Quel est le contraire de ' + showWord + ' ?';
      return { showWord, showEmoji, ansWord, ansEmoji, speechText, pairIdx };
    }

    function startGame() {
      // Choisir 10 paires distinctes, alterner les sens
      const pairIdxs = shuffle(PAIRS.map((_, i) => i)).slice(0, TOTAL_Q);
      selectedQ = pairIdxs.map((idx, i) => buildQuestion(idx, i % 2 === 0));
      currentQ = 0; score = 0;
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      document.getElementById('btnNext').style.display      = 'none';
      document.getElementById('feedbackZone').innerHTML     = '';
      document.getElementById('resultScreen').style.display = 'none';
      document.getElementById('circusCard').style.display   = '';
      document.getElementById('answersGrid').style.display  = '';

      const q = selectedQ[currentQ];
      currentQ_data = q;

      document.getElementById('showEmoji').textContent = q.showEmoji;
      document.getElementById('showWord').textContent  = q.showWord;

      // Progression
      document.getElementById('progressBar').style.width  = (currentQ / TOTAL_Q * 100) + '%';
      document.getElementById('progressText').textContent = 'Question ' + (currentQ + 1) + ' / ' + TOTAL_Q;

      // 2 mauvaises réponses : issues d'autres paires (côté réponse varié)
      const wrongPool = shuffle(
        PAIRS
          .map((p, i) => ({ i, pair: p }))
          .filter(({ i }) => i !== q.pairIdx)
      ).slice(0, 2).map(({ pair }, k) => ({
        word:  k % 2 === 0 ? pair[2] : pair[0],
        emoji: k % 2 === 0 ? pair[3] : pair[1],
      }));

      const options = shuffle([
        { word: q.ansWord, emoji: q.ansEmoji, isCorrect: true  },
        { word: wrongPool[0].word, emoji: wrongPool[0].emoji, isCorrect: false },
        { word: wrongPool[1].word, emoji: wrongPool[1].emoji, isCorrect: false },
      ]);
      correctIdx = options.findIndex(o => o.isCorrect);

      const grid = document.getElementById('answersGrid');
      grid.innerHTML = '';
      options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerHTML =
          '<span class="btn-emoji">' + opt.emoji + '</span>' +
          '<span class="btn-word">'  + opt.word  + '</span>';
        btn.onclick = () => checkAnswer(idx, opt.word, q.ansWord);
        grid.appendChild(btn);
      });

      setTimeout(() => speak(q.speechText), 500);
    }

    function checkAnswer(idx, chosen, correct) {
      if (answered) return;
      answered = true;

      const btns = document.querySelectorAll('.answer-btn');
      btns.forEach(b => { b.disabled = true; b.onclick = null; });

      const isCorrect = (idx === correctIdx);
      if (isCorrect) {
        btns[idx].classList.add('correct');
        score++;
        playSound(true);
        launchConfetti();
        document.getElementById('feedbackZone').innerHTML =
          '<div class="feedback-msg correct">🎪 Bravo ! Le contraire de ' +
          currentQ_data.showWord + ' est bien ' + correct + ' !</div>';
        speak('Bravo ! Le contraire de ' + currentQ_data.showWord + ' est ' + correct + ' !');
      } else {
        btns[idx].classList.add('wrong');
        btns[correctIdx].classList.add('correct');
        playSound(false);
        document.getElementById('feedbackZone').innerHTML =
          '<div class="feedback-msg wrong">💪 Le contraire de ' +
          currentQ_data.showWord + ' est ' + correct + ' !</div>';
        speak('Le contraire de ' + currentQ_data.showWord + ' est ' + correct + ' !');
      }

      const btnNext = document.getElementById('btnNext');
      btnNext.style.display   = 'block';
      btnNext.style.animation = 'none';
      void btnNext.offsetWidth;
      btnNext.style.animation = '';
    }

    function nextQuestion() {
      document.getElementById('btnNext').style.display = 'none';
      currentQ++;
      if (currentQ < TOTAL_Q) showQuestion();
      else showResult();
    }

    function getStars(s) {
      if (s >= 5) return 1;
      return 0;
    }

    function showResult() {
      document.getElementById('circusCard').style.display   = 'none';
      document.getElementById('answersGrid').style.display  = 'none';
      document.getElementById('feedbackZone').innerHTML     = '';
      document.getElementById('btnNext').style.display      = 'none';
      document.getElementById('progressBar').style.width    = '100%';

      const earned = getStars(score);
      document.getElementById('resultScreen').style.display = 'block';

      const titles = ['Continue !', 'Pas mal !', 'Bien joué !', 'Parfait ! 🎉'];
      document.getElementById('resultTitle').textContent = '🤡 ' + titles[earned];
      document.getElementById('starsEarned').textContent = earned > 0 ? '⭐'.repeat(earned) : '😊';
      document.getElementById('scoreDetail').textContent = score + ' / ' + TOTAL_Q + ' bonnes réponses';

      if (earned > 0) {
        launchConfetti();
        speak(titles[earned] + ' Tu as gagné ' + earned + (earned > 1 ? ' étoiles !' : ' étoile !'));
      } else {
        speak('Continue à t\'entraîner, tu vas y arriver !');
      }
      submitStars(earned);
    }

    async function submitStars(earned) {
      if (earned === 0) {
        document.getElementById('submitMsg').textContent = 'Rejoue pour gagner des étoiles !';
        return;
      }
      try {
        document.getElementById('submitMsg').textContent = '⏳ Envoi en cours...';
        const snap = await db.ref(DB_PATH + '/pendingGameStars').get();
        const val  = snap.val();
        const arr  = val ? (Array.isArray(val) ? val : Object.values(val)).filter(Boolean) : [];
        arr.push({
          id: Date.now().toString(),
          game: 'Le Cirque des Contraires',
          stars: earned,
          playedAt: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
        });
        await db.ref(DB_PATH + '/pendingGameStars').set(arr);
        document.getElementById('submitMsg').textContent =
          '✅ ' + earned + (earned > 1 ? ' étoiles' : ' étoile') + ' en attente de validation !';
      } catch(e) {
        document.getElementById('submitMsg').textContent = '❌ Erreur d\'envoi. Dis-le à Papa !';
      }
    }

    function goBack() {
      window.location.href = 'jeux.html?played=jeu-10' + (isTest ? '&test' : '');
    }

    startGame();
  </script>
</body>
</html>
