<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Mémo des fées 🧚</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvRCxPT2W7djJcHSR9kweBnaNXYQtdZqo",
      authDomain: "app-caly.firebaseapp.com",
      databaseURL: "https://app-caly-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "app-caly",
      storageBucket: "app-caly.firebasestorage.app",
      messagingSenderId: "870451326147",
      appId: "1:870451326147:web:465cff6467b66efeda4676"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const DB_PATH = new URLSearchParams(window.location.search).has('test') ? 'calyApp-test' : 'calyApp';
    const isTest = DB_PATH === 'calyApp-test';
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1a0533 0%, #3b1278 50%, #1a0533 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 12px 16px 20px; color: #fff; overflow-x: hidden;
    }
    .test-banner {
      background: #ff9800; color: #fff; padding: 6px 14px;
      border-radius: 10px; text-align: center; font-weight: bold;
      margin-bottom: 10px; font-size: 13px; width: 100%; max-width: 480px;
    }
    .game-header { text-align: center; margin-bottom: 16px; width: 100%; max-width: 480px; }
    .game-title {
      font-size: 26px; font-weight: 900;
      background: linear-gradient(135deg, #f9a8d4, #c4b5fd, #fde68a);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 10px;
    }
    .progress-bar-wrap {
      background: rgba(255,255,255,0.1);
      border-radius: 50px; height: 10px; width: 100%; margin-bottom: 6px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #f472b6, #c4b5fd, #fde68a);
      height: 100%; border-radius: 50px; transition: width 0.5s ease;
    }
    .progress-text { font-size: 13px; color: rgba(255,255,255,0.6); }

    /* Stats row */
    .stats-row {
      display: flex; justify-content: center; gap: 20px;
      margin-bottom: 14px; font-size: 15px; font-weight: bold;
    }
    .stat-chip {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 50px; padding: 5px 14px;
      display: flex; align-items: center; gap: 6px;
    }

    /* Grille de cartes */
    .cards-wrap {
      width: 100%; max-width: 380px;
      margin: 0 auto 16px;
    }
    .cards-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
    }

    /* Carte avec effet flip 3D */
    .card {
      aspect-ratio: 1;
      perspective: 800px;
      cursor: pointer;
    }
    .card-inner {
      width: 100%; height: 100%;
      position: relative;
      transform-style: preserve-3d;
      transition: transform 0.45s ease;
    }
    .card.flipped .card-inner,
    .card.matched .card-inner {
      transform: rotateY(180deg);
    }
    .card-face {
      position: absolute; inset: 0;
      border-radius: 14px;
      display: flex; align-items: center; justify-content: center;
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .card-back {
      background: linear-gradient(135deg, #6d28d9, #7c3aed);
      border: 2px solid rgba(196,181,253,0.4);
      font-size: 28px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.3);
    }
    .card-back::after {
      content: '✨';
    }
    .card-front {
      transform: rotateY(180deg);
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.25);
      font-size: 38px;
      box-shadow: 0 3px 10px rgba(0,0,0,0.2);
    }
    .card.matched .card-front {
      background: rgba(34,197,94,0.2);
      border-color: #86efac;
      box-shadow: 0 0 16px rgba(34,197,94,0.5);
    }
    .card.error .card-front {
      background: rgba(239,68,68,0.2);
      border-color: #fca5a5;
      animation: shake 0.4s ease;
    }
    .card:not(.flipped):not(.matched):hover .card-back {
      background: linear-gradient(135deg, #7c3aed, #a855f7);
    }

    /* Feedback inline */
    .feedback-zone {
      min-height: 44px; text-align: center;
      width: 100%; max-width: 480px; margin-bottom: 10px;
    }
    .feedback-msg {
      font-size: 16px; font-weight: bold;
      padding: 10px 16px; border-radius: 14px;
      animation: bumpIn 0.3s ease;
    }
    .feedback-msg.good { background: rgba(34,197,94,0.2);  color: #86efac; }
    .feedback-msg.bad  { background: rgba(239,68,68,0.18); color: #fca5a5; }

    .result-screen { display: none; text-align: center; width: 100%; max-width: 480px; }
    .result-title {
      font-size: 34px; font-weight: 900;
      background: linear-gradient(135deg, #fde68a, #f9a8d4);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 14px;
    }
    .stars-earned { font-size: 56px; margin: 14px 0; animation: bumpUp 0.6s ease; min-height: 70px; }
    .score-detail { font-size: 17px; color: rgba(255,255,255,0.65); margin-bottom: 14px; }
    .submit-msg   { font-size: 14px; color: rgba(255,255,255,0.5);  margin-bottom: 18px; min-height: 22px; }
    .btn-retour {
      width: 100%; padding: 13px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, #fde68a, #f59e0b);
      color: #1a0533; font-size: 20px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 20px rgba(253,230,138,0.4);
    }

    .confetti-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 100; overflow: hidden; }
    .confetti-piece { position: absolute; border-radius: 2px; animation: confettiFall linear forwards; }
    @keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    .star-bg { position: fixed; pointer-events: none; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; z-index: 0; }
    .star-bg span { position: absolute; font-size: 12px; animation: twinkle linear infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 0.7; transform: scale(1.3); } }
    .content { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; align-items: center; }
    @keyframes bumpIn { 0% { transform: scale(0.85); opacity: 0; } 70% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes bumpUp { 0% { transform: translateY(30px) scale(0.5); opacity: 0; } 60% { transform: translateY(-10px) scale(1.1); } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes shake { 0%, 100% { transform: rotateY(180deg) translateX(0); } 25% { transform: rotateY(180deg) translateX(-6px); } 75% { transform: rotateY(180deg) translateX(6px); } }
  </style>
</head>
<body>
  <div class="star-bg" id="starBg"></div>
  <div class="confetti-container" id="confettiContainer"></div>

  <div class="content">
    <div id="testBanner"></div>

    <div class="game-header">
      <div class="game-title">🧚 Mémo des fées</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
      </div>
      <div class="progress-text" id="progressText">0 / 8 paires trouvées</div>
    </div>

    <div class="stats-row">
      <div class="stat-chip">🧚 <span id="pairesCount">0</span> / 8 paires</div>
    </div>

    <div class="cards-wrap">
      <div class="cards-grid" id="cardsGrid"></div>
    </div>

    <div class="feedback-zone" id="feedbackZone"></div>

    <div class="result-screen" id="resultScreen">
      <div class="result-title" id="resultTitle"></div>
      <div class="stars-earned" id="starsEarned"></div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="submit-msg" id="submitMsg"></div>
      <button class="btn-retour" onclick="goBack()">🎮 Retour aux jeux</button>
    </div>
  </div>

  <script>
    const bg = document.getElementById('starBg');
    for (let i = 0; i < 28; i++) {
      const s = document.createElement('span');
      s.textContent = ['✦','✧','🧚','·','🌸','⭐'][Math.floor(Math.random()*6)];
      s.style.left = Math.random()*100 + '%';
      s.style.top  = Math.random()*100 + '%';
      s.style.animationDuration = (3 + Math.random()*5) + 's';
      s.style.animationDelay    = (Math.random()*5) + 's';
      bg.appendChild(s);
    }
    if (isTest) document.getElementById('testBanner').innerHTML = '<div class="test-banner">🧪 VERSION TEST</div>';

    const EMOJIS = ['🧚','🦋','🌸','🌟','🪄','🌈','🦄','🍄'];

    let cards      = [];
    let flipped    = [];   // indices des 2 cartes retournées
    let matchCount = 0;
    let mistakes   = 0;
    let canFlip    = true;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'fr-FR'; utt.rate = 0.88; utt.pitch = 1.1;
      window.speechSynthesis.speak(utt);
    }

    function playSound(correct) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (correct) {
          [523,659,784].forEach((freq, i) => {
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = freq; osc.type = 'sine';
            gain.gain.setValueAtTime(0.2, ctx.currentTime + i*0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.1 + 0.3);
            osc.start(ctx.currentTime + i*0.1); osc.stop(ctx.currentTime + i*0.1 + 0.3);
          });
        } else {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = 220; osc.type = 'sawtooth';
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
          osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.4);
        }
      } catch(e) {}
    }

    function launchConfetti() {
      const container = document.getElementById('confettiContainer');
      const colors = ['#f9a8d4','#c4b5fd','#fde68a','#86efac','#38bdf8','#fff'];
      for (let i = 0; i < 50; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random()*100 + '%';
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDuration = (1.5 + Math.random()*2) + 's';
        piece.style.animationDelay    = (Math.random()*0.6) + 's';
        const size = 8 + Math.random()*10;
        piece.style.width = size+'px'; piece.style.height = size+'px';
        container.appendChild(piece);
        setTimeout(() => piece.remove(), 3800);
      }
    }

    function startGame() {
      const pairs = shuffle([...EMOJIS, ...EMOJIS]);
      cards = pairs.map((emoji, i) => ({ id: i, emoji, flipped: false, matched: false }));
      flipped = []; matchCount = 0; mistakes = 0; canFlip = true;
      document.getElementById('resultScreen').style.display = 'none';
      document.getElementById('feedbackZone').innerHTML = '';
      updateStats();
      renderGrid();
      setTimeout(() => speak('Mémo des fées ! Retrouve toutes les paires magiques !'), 400);
    }

    function updateStats() {
      document.getElementById('pairesCount').textContent = matchCount;
      document.getElementById('progressBar').style.width = (matchCount / 8 * 100) + '%';
      document.getElementById('progressText').textContent = matchCount + ' / 8 paires trouvées';
    }

    function renderGrid() {
      const grid = document.getElementById('cardsGrid');
      grid.innerHTML = '';
      cards.forEach((card, i) => {
        const el = document.createElement('div');
        let cls = 'card';
        if (card.flipped || card.matched) cls += ' flipped';
        if (card.matched) cls += ' matched';
        el.className = cls;
        el.innerHTML =
          '<div class="card-inner">' +
            '<div class="card-face card-back"></div>' +
            '<div class="card-face card-front">' + card.emoji + '</div>' +
          '</div>';
        if (!card.matched && !card.flipped) {
          el.onclick = () => flipCard(i);
        }
        grid.appendChild(el);
      });
    }

    function flipCard(idx) {
      if (!canFlip) return;
      if (cards[idx].flipped || cards[idx].matched) return;
      if (flipped.length >= 2) return;

      cards[idx].flipped = true;
      flipped.push(idx);
      renderGrid();

      if (flipped.length === 2) {
        canFlip = false;
        setTimeout(checkMatch, 700);
      }
    }

    function checkMatch() {
      const [i1, i2] = flipped;
      if (cards[i1].emoji === cards[i2].emoji) {
        cards[i1].matched = true;
        cards[i2].matched = true;
        matchCount++;
        flipped = [];
        canFlip = true;
        playSound(true);
        updateStats();
        renderGrid();
        document.getElementById('feedbackZone').innerHTML =
          '<div class="feedback-msg good">✨ Paire trouvée ! ' + cards[i1].emoji + ' ' + cards[i2].emoji + '</div>';
        if (matchCount === 8) {
          setTimeout(showResult, 800);
        }
      } else {
        playSound(false);
        setTimeout(() => {
          cards[i1].flipped = false;
          cards[i2].flipped = false;
          flipped = [];
          canFlip = true;
          document.getElementById('feedbackZone').innerHTML = '';
          renderGrid();
        }, 900);
      }
    }

    function showResult() {
      document.getElementById('cardsGrid').style.pointerEvents = 'none';
      document.getElementById('feedbackZone').innerHTML = '';

      const earned = 1;
      document.getElementById('resultScreen').style.display = 'block';

      document.getElementById('resultTitle').textContent = '🧚 Bravo !';
      document.getElementById('starsEarned').textContent = '⭐';
      document.getElementById('scoreDetail').textContent = 'Tu as trouvé toutes les paires !';

      if (earned > 0) {
        launchConfetti();
        speak(titles[earned] + ' Tu as gagné ' + earned + (earned > 1 ? ' étoiles !' : ' étoile !'));
      } else {
        speak('Continue à t\'entraîner, tu vas y arriver !');
      }
      submitStars(earned);
    }

    async function submitStars(earned) {
      if (earned === 0) {
        document.getElementById('submitMsg').textContent = 'Rejoue pour gagner des étoiles !';
        return;
      }
      try {
        document.getElementById('submitMsg').textContent = '⏳ Envoi en cours...';
        const snap = await db.ref(DB_PATH + '/pendingGameStars').get();
        const val  = snap.val();
        const arr  = val ? (Array.isArray(val) ? val : Object.values(val)).filter(Boolean) : [];
        arr.push({
          id: Date.now().toString(),
          game: 'Mémo des Fées',
          stars: earned,
          playedAt: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
        });
        await db.ref(DB_PATH + '/pendingGameStars').set(arr);
        document.getElementById('submitMsg').textContent =
          '✅ ' + earned + (earned > 1 ? ' étoiles' : ' étoile') + ' en attente de validation !';
      } catch(e) {
        document.getElementById('submitMsg').textContent = '❌ Erreur d\'envoi. Dis-le à Papa !';
      }
    }

    function goBack() {
      window.location.href = 'jeux.html?played=jeu-11' + (isTest ? '&test' : '');
    }

    startGame();
  </script>
</body>
</html>
