<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Copie du parchemin 📜</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvRCxPT2W7djJcHSR9kweBnaNXYQtdZqo",
      authDomain: "app-caly.firebaseapp.com",
      databaseURL: "https://app-caly-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "app-caly",
      storageBucket: "app-caly.firebasestorage.app",
      messagingSenderId: "870451326147",
      appId: "1:870451326147:web:465cff6467b66efeda4676"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const DB_PATH = new URLSearchParams(window.location.search).has('test') ? 'calyApp-test' : 'calyApp';
    const isTest = DB_PATH === 'calyApp-test';
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1a1000 0%, #3d2a00 50%, #1a1000 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 16px 40px; color: #fff; overflow-x: hidden;
    }
    .test-banner {
      background: #ff9800; color: #fff; padding: 6px 14px;
      border-radius: 10px; text-align: center; font-weight: bold;
      margin-bottom: 10px; font-size: 13px; width: 100%; max-width: 480px;
    }
    .game-header { text-align: center; margin-bottom: 18px; width: 100%; max-width: 480px; }
    .game-title {
      font-size: 26px; font-weight: 900;
      background: linear-gradient(135deg, #fde68a, #f59e0b, #fbbf24);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 10px;
    }
    .progress-bar-wrap {
      background: rgba(255,255,255,0.1);
      border-radius: 50px; height: 10px; width: 100%; margin-bottom: 6px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #f59e0b, #fde68a);
      height: 100%; border-radius: 50px; transition: width 0.4s ease;
    }
    .progress-text { font-size: 13px; color: rgba(255,255,255,0.6); }

    /* Parchemin */
    .scroll-card {
      background: linear-gradient(180deg, #fef3c7 0%, #fde68a 40%, #fef3c7 100%);
      border: 3px solid #d97706;
      border-radius: 12px; padding: 24px 20px;
      width: 100%; max-width: 380px;
      text-align: center; position: relative; margin-bottom: 20px;
      box-shadow: 0 6px 24px rgba(0,0,0,0.5), inset 0 0 20px rgba(217,119,6,0.1);
    }
    .scroll-card::before,
    .scroll-card::after {
      content: '';
      position: absolute; left: -6px; right: -6px; height: 20px;
      background: linear-gradient(180deg, #d97706, #b45309);
      border-radius: 50%;
    }
    .scroll-card::before { top: -10px; }
    .scroll-card::after  { bottom: -10px; }

    .scroll-emoji {
      font-size: 28px; display: block; margin-bottom: 12px;
    }
    .scroll-word {
      font-size: 42px; font-weight: 900; color: #1a0500;
      letter-spacing: 4px; font-family: 'Georgia', serif;
      text-shadow: 1px 1px 0 rgba(0,0,0,0.15);
      animation: wordAppear 0.4s ease both;
    }
    @keyframes wordAppear {
      0%   { transform: scale(0.8); opacity: 0; }
      70%  { transform: scale(1.05); }
      100% { transform: scale(1); opacity: 1; }
    }
    .scroll-hint { font-size: 13px; color: #92400e; margin-top: 10px; }

    /* Countdown bar */
    .countdown-wrap {
      background: rgba(255,255,255,0.1);
      border-radius: 50px; height: 8px; width: 100%; max-width: 380px;
      margin-bottom: 20px;
    }
    .countdown-bar {
      height: 100%; border-radius: 50px;
      background: linear-gradient(90deg, #f59e0b, #fde68a);
      transition: width linear;
    }

    /* Parchemin masqué (phase question) */
    .question-card {
      display: none;
      background: rgba(253,230,138,0.08);
      border: 2px solid rgba(253,230,138,0.25);
      border-radius: 20px; padding: 16px 18px;
      width: 100%; max-width: 480px;
      text-align: center; margin-bottom: 18px;
    }
    .question-label {
      font-size: 15px; color: #fde68a; font-weight: bold;
    }

    /* Boutons mots */
    .words-grid {
      display: flex; flex-direction: column;
      gap: 12px; width: 100%; max-width: 480px; margin-bottom: 20px;
    }
    .word-btn {
      padding: 18px 16px;
      border-radius: 16px;
      border: 3px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
      color: #fff; font-size: 28px; font-weight: 900;
      letter-spacing: 3px; font-family: 'Georgia', serif;
      cursor: pointer; transition: transform 0.1s;
      text-align: center;
    }
    .word-btn:active:not(:disabled) { transform: scale(0.97); }
    .word-btn:disabled { cursor: default; }
    .word-btn.correct {
      background: linear-gradient(135deg, #16a34a, #15803d) !important;
      border-color: #86efac !important;
      box-shadow: 0 0 24px rgba(34,197,94,0.7) !important;
      animation: bumpIn 0.35s ease;
    }
    .word-btn.wrong {
      background: linear-gradient(135deg, #dc2626, #b91c1c) !important;
      border-color: #fca5a5 !important;
      animation: shake 0.45s ease;
    }

    .feedback-zone {
      min-height: 54px; text-align: center;
      width: 100%; max-width: 480px; margin-bottom: 10px;
    }
    .feedback-msg {
      font-size: 17px; font-weight: bold;
      padding: 12px 18px; border-radius: 16px;
      animation: bumpIn 0.3s ease; line-height: 1.4;
    }
    .feedback-msg.correct { background: rgba(34,197,94,0.2);  color: #86efac; }
    .feedback-msg.wrong   { background: rgba(239,68,68,0.2);  color: #fca5a5; }

    .btn-next {
      display: none; width: 100%; max-width: 480px;
      padding: 18px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: #1a0500; font-size: 22px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 20px rgba(245,158,11,0.4);
      margin-bottom: 20px;
    }

    .result-screen { display: none; text-align: center; width: 100%; max-width: 480px; }
    .result-title {
      font-size: 34px; font-weight: 900;
      background: linear-gradient(135deg, #fde68a, #f59e0b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 14px;
    }
    .stars-earned { font-size: 56px; margin: 14px 0; animation: bumpUp 0.6s ease; min-height: 70px; }
    .score-detail { font-size: 18px; color: rgba(255,255,255,0.65); margin-bottom: 22px; }
    .submit-msg   { font-size: 14px; color: rgba(255,255,255,0.5);  margin-bottom: 18px; min-height: 22px; }
    .btn-retour {
      width: 100%; padding: 18px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, #fde68a, #f59e0b);
      color: #1a0500; font-size: 20px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 20px rgba(253,230,138,0.4);
    }

    .confetti-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 100; overflow: hidden; }
    .confetti-piece { position: absolute; border-radius: 2px; animation: confettiFall linear forwards; }
    @keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    .star-bg { position: fixed; pointer-events: none; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; z-index: 0; }
    .star-bg span { position: absolute; font-size: 12px; animation: twinkle linear infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 0.6; transform: scale(1.2); } }
    .content { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; align-items: center; }
    @keyframes bumpIn { 0% { transform: scale(0.85); opacity: 0; } 70% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes bumpUp { 0% { transform: translateY(30px) scale(0.5); opacity: 0; } 60% { transform: translateY(-10px) scale(1.1); } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  </style>
</head>
<body>
  <div class="star-bg" id="starBg"></div>
  <div class="confetti-container" id="confettiContainer"></div>

  <div class="content">
    <div id="testBanner"></div>

    <div class="game-header">
      <div class="game-title">📜 Copie du parchemin</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
      </div>
      <div class="progress-text" id="progressText">Question 1 / 10</div>
    </div>

    <!-- Phase mémo : parchemin visible -->
    <div class="scroll-card" id="scrollCard">
      <span class="scroll-emoji" id="scrollEmoji"></span>
      <div class="scroll-word" id="scrollWord"></div>
      <div class="scroll-hint">Mémorise l'orthographe !</div>
    </div>
    <div class="countdown-wrap" id="countdownWrap">
      <div class="countdown-bar" id="countdownBar" style="width:100%"></div>
    </div>

    <!-- Phase question -->
    <div class="question-card" id="questionCard">
      <div class="question-label">📜 Retrouve le bon mot !</div>
    </div>
    <div class="words-grid" id="wordsGrid" style="display:none"></div>

    <div class="feedback-zone" id="feedbackZone"></div>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Suivant →</button>

    <div class="result-screen" id="resultScreen">
      <div class="result-title" id="resultTitle"></div>
      <div class="stars-earned" id="starsEarned"></div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="submit-msg" id="submitMsg"></div>
      <button class="btn-retour" onclick="goBack()">🎮 Retour aux jeux</button>
    </div>
  </div>

  <script>
    const bg = document.getElementById('starBg');
    for (let i = 0; i < 25; i++) {
      const s = document.createElement('span');
      s.textContent = ['✦','✧','·','📜','⭐','✨'][Math.floor(Math.random()*6)];
      s.style.left = Math.random()*100 + '%';
      s.style.top  = Math.random()*100 + '%';
      s.style.animationDuration = (3 + Math.random()*5) + 's';
      s.style.animationDelay    = (Math.random()*5) + 's';
      bg.appendChild(s);
    }
    if (isTest) document.getElementById('testBanner').innerHTML = '<div class="test-banner">🧪 VERSION TEST</div>';

    const POOL = [
      { emoji:'🐱', word:'CHAT',      wrong:['CAHT',    'CHTA']      },
      { emoji:'🏠', word:'MAISON',    wrong:['MAISONE', 'MAIOSN']    },
      { emoji:'🐰', word:'LAPIN',     wrong:['LAIPIN',  'LAPNI']     },
      { emoji:'☀️', word:'SOLEIL',    wrong:['SOLIEL',  'SLOEIL']    },
      { emoji:'🌳', word:'ARBRE',     wrong:['ARBER',   'ABRE']      },
      { emoji:'🦋', word:'PAPILLON',  wrong:['PAPLION', 'PAPILONE']  },
      { emoji:'🐘', word:'ÉLÉPHANT',  wrong:['ELEPHANT','ÉLÉFANT']   },
      { emoji:'🦄', word:'LICORNE',   wrong:['LICONER', 'LICRON']    },
      { emoji:'🚗', word:'VOITURE',   wrong:['VIOTURE', 'VOITEUR']   },
      { emoji:'🌺', word:'FLEUR',     wrong:['FLUER',   'FLEUER']    },
      { emoji:'🐉', word:'DRAGON',    wrong:['DARGON',  'DRAGEON']   },
      { emoji:'🌟', word:'ÉTOILE',    wrong:['ETOILE',  'ÉTOILLE']   },
      { emoji:'🌻', word:'JARDIN',    wrong:['JARDINE', 'JARDNI']    },
      { emoji:'🐦', word:'OISEAU',    wrong:['OISEEAU', 'OIASEU']    },
      { emoji:'☁️', word:'NUAGE',     wrong:['NUVAGE',  'NUAGAE']    },
      { emoji:'🐱', word:'CHATON',    wrong:['CHAOTN',  'CHATEN']    },
      { emoji:'🎂', word:'GÂTEAU',    wrong:['GATEAU',  'GÂTEAUX']   },
      { emoji:'🌙', word:'LUNE',      wrong:['LUEN',    'LUNNE']     },
      { emoji:'🎈', word:'BALLON',    wrong:['BALION',  'BALONE']    },
      { emoji:'🏰', word:'CHÂTEAU',   wrong:['CHATAUX', 'CHATEAUX']  },
    ];

    const MEMO_DURATION = 4000;
    const TOTAL_Q = 10;
    let selectedQ  = [];
    let currentQ   = 0;
    let score      = 0;
    let correctIdx = -1;
    let answered   = false;
    let memoTimer  = null;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'fr-FR'; utt.rate = 0.88; utt.pitch = 1.1;
      window.speechSynthesis.speak(utt);
    }

    function playSound(correct) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (correct) {
          [523,659,784,1047].forEach((freq, i) => {
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = freq; osc.type = 'sine';
            gain.gain.setValueAtTime(0.22, ctx.currentTime + i*0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.1 + 0.25);
            osc.start(ctx.currentTime + i*0.1); osc.stop(ctx.currentTime + i*0.1 + 0.25);
          });
        } else {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = 200; osc.type = 'sawtooth';
          gain.gain.setValueAtTime(0.22, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
          osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.45);
        }
      } catch(e) {}
    }

    function launchConfetti() {
      const container = document.getElementById('confettiContainer');
      const colors = ['#fde68a','#f59e0b','#fbbf24','#86efac','#38bdf8','#fff'];
      for (let i = 0; i < 45; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random()*100 + '%';
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDuration = (1.5 + Math.random()*2) + 's';
        piece.style.animationDelay    = (Math.random()*0.5) + 's';
        const size = 8 + Math.random()*10;
        piece.style.width = size+'px'; piece.style.height = size+'px';
        container.appendChild(piece);
        setTimeout(() => piece.remove(), 3800);
      }
    }

    function startGame() {
      selectedQ = shuffle(POOL).slice(0, TOTAL_Q);
      currentQ = 0; score = 0;
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      if (memoTimer) clearTimeout(memoTimer);

      document.getElementById('btnNext').style.display       = 'none';
      document.getElementById('feedbackZone').innerHTML      = '';
      document.getElementById('resultScreen').style.display  = 'none';
      document.getElementById('scrollCard').style.display    = '';
      document.getElementById('countdownWrap').style.display = '';
      document.getElementById('questionCard').style.display  = 'none';
      document.getElementById('wordsGrid').style.display     = 'none';

      const q = selectedQ[currentQ];
      document.getElementById('scrollEmoji').textContent = q.emoji;
      document.getElementById('scrollWord').textContent  = q.word;

      document.getElementById('progressBar').style.width  = (currentQ / TOTAL_Q * 100) + '%';
      document.getElementById('progressText').textContent = 'Question ' + (currentQ + 1) + ' / ' + TOTAL_Q;

      // Countdown
      const bar = document.getElementById('countdownBar');
      bar.style.transition = 'none';
      bar.style.width = '100%';
      setTimeout(() => {
        bar.style.transition = 'width ' + (MEMO_DURATION / 1000) + 's linear';
        bar.style.width = '0%';
      }, 50);

      speak('Mémorise ce mot : ' + q.word);

      memoTimer = setTimeout(() => startAnswerPhase(q), MEMO_DURATION);
    }

    function startAnswerPhase(q) {
      document.getElementById('scrollCard').style.display    = 'none';
      document.getElementById('countdownWrap').style.display = 'none';
      document.getElementById('questionCard').style.display  = '';
      document.getElementById('wordsGrid').style.display     = '';

      const options = shuffle([q.word, ...q.wrong]);
      correctIdx = options.indexOf(q.word);

      const grid = document.getElementById('wordsGrid');
      grid.innerHTML = '';
      options.forEach((word, idx) => {
        const btn = document.createElement('button');
        btn.className   = 'word-btn';
        btn.textContent = word;
        btn.onclick     = () => checkAnswer(idx, word, q.word);
        grid.appendChild(btn);
      });

      speak('Retrouve le bon mot !');
    }

    function checkAnswer(idx, chosen, correct) {
      if (answered) return;
      answered = true;

      const btns = document.querySelectorAll('.word-btn');
      btns.forEach(b => { b.disabled = true; b.onclick = null; });

      const isCorrect = (idx === correctIdx);
      if (isCorrect) {
        btns[idx].classList.add('correct');
        score++;
        playSound(true);
        launchConfetti();
        document.getElementById('feedbackZone').innerHTML =
          '<div class="feedback-msg correct">✨ Bravo ! C\'est bien ' + correct + ' !</div>';
        speak('Bravo ! C\'est bien ' + correct + ' !');
      } else {
        btns[idx].classList.add('wrong');
        btns[correctIdx].classList.add('correct');
        playSound(false);
        document.getElementById('feedbackZone').innerHTML =
          '<div class="feedback-msg wrong">💪 Le bon mot était ' + correct + ' !</div>';
        speak('Le bon mot était ' + correct + ' !');
      }

      const btnNext = document.getElementById('btnNext');
      btnNext.style.display   = 'block';
      btnNext.style.animation = 'none';
      void btnNext.offsetWidth;
      btnNext.style.animation = '';
    }

    function nextQuestion() {
      document.getElementById('btnNext').style.display = 'none';
      currentQ++;
      if (currentQ < TOTAL_Q) showQuestion();
      else showResult();
    }

    function getStars(s) {
      if (s >= 9) return 3;
      if (s >= 7) return 2;
      if (s >= 5) return 1;
      return 0;
    }

    function showResult() {
      if (memoTimer) clearTimeout(memoTimer);
      document.getElementById('scrollCard').style.display    = 'none';
      document.getElementById('countdownWrap').style.display = 'none';
      document.getElementById('questionCard').style.display  = 'none';
      document.getElementById('wordsGrid').style.display     = 'none';
      document.getElementById('feedbackZone').innerHTML      = '';
      document.getElementById('btnNext').style.display       = 'none';
      document.getElementById('progressBar').style.width     = '100%';

      const earned = getStars(score);
      document.getElementById('resultScreen').style.display = 'block';

      const titles = ['Continue !', 'Pas mal !', 'Bien joué !', 'Parfait ! 🎉'];
      document.getElementById('resultTitle').textContent = '📜 ' + titles[earned];
      document.getElementById('starsEarned').textContent = earned > 0 ? '⭐'.repeat(earned) : '😊';
      document.getElementById('scoreDetail').textContent = score + ' / ' + TOTAL_Q + ' bonnes réponses';

      if (earned > 0) {
        launchConfetti();
        speak(titles[earned] + ' Tu as gagné ' + earned + (earned > 1 ? ' étoiles !' : ' étoile !'));
      } else {
        speak('Continue à t\'entraîner, tu vas y arriver !');
      }
      submitStars(earned);
    }

    async function submitStars(earned) {
      if (earned === 0) {
        document.getElementById('submitMsg').textContent = 'Rejoue pour gagner des étoiles !';
        return;
      }
      try {
        document.getElementById('submitMsg').textContent = '⏳ Envoi en cours...';
        const snap = await db.ref(DB_PATH + '/pendingGameStars').get();
        const val  = snap.val();
        const arr  = val ? (Array.isArray(val) ? val : Object.values(val)).filter(Boolean) : [];
        arr.push({
          id: Date.now().toString(),
          game: 'Copie du Parchemin',
          stars: earned,
          playedAt: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
        });
        await db.ref(DB_PATH + '/pendingGameStars').set(arr);
        document.getElementById('submitMsg').textContent =
          '✅ ' + earned + (earned > 1 ? ' étoiles' : ' étoile') + ' en attente de validation !';
      } catch(e) {
        document.getElementById('submitMsg').textContent = '❌ Erreur d\'envoi. Dis-le à Papa !';
      }
    }

    function goBack() {
      if (memoTimer) clearTimeout(memoTimer);
      window.location.href = 'jeux.html' + (isTest ? '?test' : '');
    }

    startGame();
  </script>
</body>
</html>
