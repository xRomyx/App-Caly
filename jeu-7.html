<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>La suite magique 🪄</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvRCxPT2W7djJcHSR9kweBnaNXYQtdZqo",
      authDomain: "app-caly.firebaseapp.com",
      databaseURL: "https://app-caly-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "app-caly",
      storageBucket: "app-caly.firebasestorage.app",
      messagingSenderId: "870451326147",
      appId: "1:870451326147:web:465cff6467b66efeda4676"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const DB_PATH = new URLSearchParams(window.location.search).has('test') ? 'calyApp-test' : 'calyApp';
    const isTest = DB_PATH === 'calyApp-test';
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1a0533 0%, #2d0e5c 50%, #1a0533 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 12px 16px 20px; color: #fff; overflow-x: hidden;
    }
    .test-banner {
      background: #ff9800; color: #fff; padding: 6px 14px;
      border-radius: 10px; text-align: center; font-weight: bold;
      margin-bottom: 10px; font-size: 13px; width: 100%; max-width: 480px;
    }
    .game-header { text-align: center; margin-bottom: 12px; width: 100%; max-width: 480px; }
    .game-title {
      font-size: 28px; font-weight: 900;
      background: linear-gradient(135deg, #fde68a, #a855f7, #f472b6);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 10px;
    }
    .progress-bar-wrap {
      background: rgba(255,255,255,0.1);
      border-radius: 50px; height: 10px; width: 100%; margin-bottom: 6px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #a855f7, #fde68a);
      height: 100%; border-radius: 50px; transition: width 0.4s ease;
    }
    .progress-text { font-size: 13px; color: rgba(255,255,255,0.6); }

    /* Carte magique */
    .magic-card {
      background: rgba(168,85,247,0.07);
      border: 2px solid rgba(168,85,247,0.3);
      border-radius: 28px; padding: 24px 14px 20px;
      width: 100%; max-width: 480px;
      text-align: center; position: relative; margin-bottom: 14px;
    }
    .magic-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, #a855f7, #fde68a, #f472b6, #fde68a, #a855f7);
      border-radius: 28px 28px 0 0;
    }

    .card-label {
      font-size: 14px; color: #d8b4fe; font-weight: bold;
      text-transform: uppercase; letter-spacing: 2px; margin-bottom: 18px;
    }

    /* Séquence d'emojis */
    .sequence-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 6px;
      flex-wrap: nowrap;
      margin-bottom: 18px;
    }
    .seq-item {
      display: flex; align-items: center; justify-content: center;
      width: 52px; height: 52px;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.15);
      border-radius: 14px;
      font-size: 28px;
      animation: itemAppear 0.35s ease both;
      flex-shrink: 0;
    }
    .seq-item.mystery {
      background: rgba(253,230,138,0.1);
      border: 2px dashed rgba(253,230,138,0.7);
      font-size: 24px;
      color: #fde68a;
      animation: itemAppear 0.35s ease both, pulse 1.3s ease-in-out infinite;
    }
    .seq-item.revealed {
      background: rgba(34,197,94,0.2);
      border: 2px solid #86efac;
      animation: bumpIn 0.4s ease;
    }
    @keyframes itemAppear {
      0%   { transform: scale(0.5) rotate(-10deg); opacity: 0; }
      70%  { transform: scale(1.1) rotate(2deg); }
      100% { transform: scale(1) rotate(0deg);   opacity: 1; }
    }
    @keyframes pulse { 0%, 100% { opacity: 1; box-shadow: 0 0 0 rgba(253,230,138,0); } 50% { opacity: 0.6; box-shadow: 0 0 14px rgba(253,230,138,0.4); } }

    .speak-btn {
      background: rgba(168,85,247,0.2);
      border: 2px solid rgba(168,85,247,0.4);
      border-radius: 50px; color: #d8b4fe; font-size: 14px;
      padding: 7px 18px; cursor: pointer; transition: background 0.2s;
    }
    .speak-btn:active { background: rgba(168,85,247,0.4); }

    /* Boutons réponses — 3 gros emojis */
    .answers-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 14px; width: 100%; max-width: 480px; margin-bottom: 20px;
    }
    .answer-btn {
      min-height: 80px; border-radius: 20px;
      border: 3px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
      font-size: 48px;
      cursor: pointer; transition: transform 0.1s;
      box-shadow: 0 3px 14px rgba(0,0,0,0.3);
      display: flex; align-items: center; justify-content: center;
    }
    .answer-btn:active:not(:disabled) { transform: scale(0.93); }
    .answer-btn:disabled { cursor: default; }
    .answer-btn.correct {
      background: linear-gradient(135deg, #16a34a, #15803d) !important;
      border-color: #86efac !important; transform: scale(1.1) !important;
      box-shadow: 0 0 30px rgba(34,197,94,0.85) !important;
      animation: bumpIn 0.35s ease;
    }
    .answer-btn.wrong {
      background: linear-gradient(135deg, #dc2626, #b91c1c) !important;
      border-color: #fca5a5 !important;
      box-shadow: 0 0 25px rgba(239,68,68,0.8) !important;
      animation: shake 0.45s ease;
    }

    .feedback-zone {
      min-height: 54px; text-align: center;
      width: 100%; max-width: 480px; margin-bottom: 10px;
    }
    .feedback-msg {
      font-size: 17px; font-weight: bold;
      padding: 12px 18px; border-radius: 16px;
      animation: bumpIn 0.3s ease; line-height: 1.4;
    }
    .feedback-msg.correct { background: rgba(34,197,94,0.2);  color: #86efac; }
    .feedback-msg.wrong   { background: rgba(239,68,68,0.2);  color: #fca5a5; }

    .btn-next {
      display: none; width: 100%; max-width: 480px;
      padding: 13px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, #a855f7, #7c3aed);
      color: #fff; font-size: 22px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 20px rgba(168,85,247,0.4);
      margin-bottom: 20px;
    }

    .result-screen { display: none; text-align: center; width: 100%; max-width: 480px; }
    .result-title {
      font-size: 36px; font-weight: 900;
      background: linear-gradient(135deg, #fde68a, #a855f7);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 14px;
    }
    .stars-earned { font-size: 56px; margin: 14px 0; animation: bumpUp 0.6s ease; min-height: 70px; }
    .score-detail { font-size: 18px; color: rgba(255,255,255,0.65); margin-bottom: 14px; }
    .submit-msg   { font-size: 14px; color: rgba(255,255,255,0.5);  margin-bottom: 18px; min-height: 22px; }
    .btn-retour {
      width: 100%; padding: 13px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, #fde68a, #f59e0b);
      color: #1a0533; font-size: 20px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 20px rgba(253,230,138,0.4);
    }

    .confetti-container {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 100; overflow: hidden;
    }
    .confetti-piece { position: absolute; border-radius: 2px; animation: confettiFall linear forwards; }
    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }
    .star-bg { position: fixed; pointer-events: none; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; z-index: 0; }
    .star-bg span { position: absolute; font-size: 12px; animation: twinkle linear infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.2; transform: scale(0.8); } 50% { opacity: 0.7; transform: scale(1.3); } }
    .content { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; align-items: center; }
    @keyframes bumpIn { 0% { transform: scale(0.85); opacity: 0; } 70% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes bumpUp { 0% { transform: translateY(30px) scale(0.5); opacity: 0; } 60% { transform: translateY(-10px) scale(1.1); } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  </style>
</head>
<body>
  <div class="star-bg" id="starBg"></div>
  <div class="confetti-container" id="confettiContainer"></div>

  <div class="content">
    <div id="testBanner"></div>

    <div class="game-header">
      <div class="game-title">🪄 La suite magique</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
      </div>
      <div class="progress-text" id="progressText">Question 1 / 10</div>
    </div>

    <div class="magic-card" id="magicCard">
      <div class="card-label">🪄 Qu'est-ce qui vient ensuite ?</div>
      <div class="sequence-row" id="sequenceRow"></div>
      <button class="speak-btn" onclick="speakQ()">🔊 Réécouter</button>
    </div>

    <div class="answers-grid" id="answersGrid"></div>
    <div class="feedback-zone" id="feedbackZone"></div>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Suivant →</button>

    <div class="result-screen" id="resultScreen">
      <div class="result-title" id="resultTitle"></div>
      <div class="stars-earned" id="starsEarned"></div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="submit-msg" id="submitMsg"></div>
      <button class="btn-retour" onclick="goBack()">🎮 Retour aux jeux</button>
    </div>
  </div>

  <script>
    const bg = document.getElementById('starBg');
    for (let i = 0; i < 30; i++) {
      const s = document.createElement('span');
      s.textContent = ['✦','✧','·','⋆','✨','⭐'][Math.floor(Math.random()*6)];
      s.style.left = Math.random()*100 + '%';
      s.style.top  = Math.random()*100 + '%';
      s.style.animationDuration = (3 + Math.random()*5) + 's';
      s.style.animationDelay    = (Math.random()*5) + 's';
      bg.appendChild(s);
    }
    if (isTest) document.getElementById('testBanner').innerHTML = '<div class="test-banner">🧪 VERSION TEST</div>';

    // Patterns à 3 éléments
    const PATTERNS_3 = [
      ['⭐','🌙','☀️'], ['🔴','🔵','🟡'], ['🐱','🐶','🐰'],
      ['🍎','🍊','🍋'], ['🌸','🌿','🌺'], ['💜','💛','🩷'],
      ['🐘','🦒','🦓'], ['🎯','🎸','🎺'],
    ];
    // Patterns à 4 éléments
    const PATTERNS_4 = [
      ['⭐','🌙','☀️','🌈'], ['🔴','🔵','🟡','🟢'],
      ['🐱','🐶','🐰','🐹'], ['🍎','🍊','🍋','🍇'],
      ['🌸','🌿','🌺','🍄'], ['🦁','🐯','🐻','🦊'],
      ['🎯','🎸','🎺','🥁'], ['🚀','🌍','🌟','🪐'],
    ];

    const TOTAL_Q  = 10;
    let selectedQ  = [];
    let currentQ   = 0;
    let score      = 0;
    let correctIdx = -1;
    let answered   = false;
    let currentQ_data = null;

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'fr-FR'; utt.rate = 0.88; utt.pitch = 1.1;
      window.speechSynthesis.speak(utt);
    }

    function speakQ() {
      if (currentQ_data) speak(currentQ_data.speechText);
    }

    function playSound(correct) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (correct) {
          [523,659,784,1047].forEach((freq, i) => {
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = freq; osc.type = 'sine';
            gain.gain.setValueAtTime(0.25, ctx.currentTime + i*0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.1 + 0.25);
            osc.start(ctx.currentTime + i*0.1); osc.stop(ctx.currentTime + i*0.1 + 0.25);
          });
        } else {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = 200; osc.type = 'sawtooth';
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
          osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.45);
        }
      } catch(e) {}
    }

    function launchConfetti() {
      const container = document.getElementById('confettiContainer');
      const colors = ['#fde68a','#a855f7','#f472b6','#c4b5fd','#38bdf8','#fff'];
      for (let i = 0; i < 45; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random()*100 + '%';
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDuration = (1.5 + Math.random()*2) + 's';
        piece.style.animationDelay    = (Math.random()*0.5) + 's';
        const size = 8 + Math.random()*10;
        piece.style.width = size+'px'; piece.style.height = size+'px';
        container.appendChild(piece);
        setTimeout(() => piece.remove(), 3800);
      }
    }

    function generateQuestion(type) {
      // type : 2, 3 ou 4
      if (type === 3) {
        const pattern = PATTERNS_3[Math.floor(Math.random() * PATTERNS_3.length)];
        const full = [0,1,2,3,4,5].map(i => pattern[i % 3]);
        const visible = full.slice(0, 5);
        const answer  = full[5];
        const options = shuffle([...pattern]);
        const speechText = 'Qu\'est-ce qui vient ensuite ?';
        return { visible, answer, options, pattern, speechText };
      } else if (type === 4) {
        const pattern = PATTERNS_4[Math.floor(Math.random() * PATTERNS_4.length)];
        // 5 éléments visibles (cycle complet + début du 2e cycle) → 6e caché
        const full = [0,1,2,3,4,5].map(i => pattern[i % 4]);
        const visible = full.slice(0, 5);
        const answer  = full[5];
        // Options : les 4 éléments du pattern
        const options = shuffle([...pattern]);
        const speechText = 'Qu\'est-ce qui vient ensuite ?';
        return { visible, answer, options, pattern, speechText };
      }
    }

    function startGame() {
      // 5 ABC + 5 ABCD
      const types = shuffle([3,3,3,3,3,4,4,4,4,4]);
      selectedQ = types.map(t => generateQuestion(t));
      currentQ = 0; score = 0;
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      document.getElementById('btnNext').style.display      = 'none';
      document.getElementById('feedbackZone').innerHTML     = '';
      document.getElementById('resultScreen').style.display = 'none';
      document.getElementById('magicCard').style.display    = '';
      document.getElementById('answersGrid').style.display  = '';

      const q = selectedQ[currentQ];
      currentQ_data = q;

      // Afficher la séquence
      const row = document.getElementById('sequenceRow');
      row.innerHTML = '';
      q.visible.forEach((emoji, i) => {
        const item = document.createElement('div');
        item.className = 'seq-item';
        item.textContent = emoji;
        item.style.animationDelay = (i * 0.08) + 's';
        row.appendChild(item);
      });
      // Ajouter la case mystère
      const mystery = document.createElement('div');
      mystery.className = 'seq-item mystery';
      mystery.id = 'mysteryItem';
      mystery.textContent = '?';
      mystery.style.animationDelay = (q.visible.length * 0.08) + 's';
      row.appendChild(mystery);

      // Progression
      document.getElementById('progressBar').style.width  = (currentQ / TOTAL_Q * 100) + '%';
      document.getElementById('progressText').textContent = 'Question ' + (currentQ + 1) + ' / ' + TOTAL_Q;

      // Boutons réponses (3 colonnes pour ABC, 4 pour ABCD)
      correctIdx = q.options.indexOf(q.answer);
      const grid = document.getElementById('answersGrid');
      grid.style.gridTemplateColumns = 'repeat(' + q.options.length + ', 1fr)';
      grid.innerHTML = '';
      q.options.forEach((emoji, idx) => {
        const btn = document.createElement('button');
        btn.className   = 'answer-btn';
        btn.textContent = emoji;
        btn.onclick     = () => checkAnswer(idx, emoji, q.answer);
        grid.appendChild(btn);
      });

      setTimeout(() => speak(q.speechText), 500);
    }

    function checkAnswer(idx, chosen, correct) {
      if (answered) return;
      answered = true;

      const btns = document.querySelectorAll('.answer-btn');
      btns.forEach(b => b.disabled = true);

      // Révéler la case mystère
      const mystery = document.getElementById('mysteryItem');
      if (mystery) {
        mystery.textContent = correct;
        mystery.classList.remove('mystery');
        mystery.classList.add('revealed');
      }

      const isCorrect = (idx === correctIdx);
      if (isCorrect) {
        btns[idx].classList.add('correct');
        score++;
        playSound(true);
        launchConfetti();
        document.getElementById('feedbackZone').innerHTML =
          '<div class="feedback-msg correct">✨ Bravo ! Tu as trouvé le bon motif !</div>';
        speak('Bravo ! Tu as trouvé la suite !');
      } else {
        btns[idx].classList.add('wrong');
        btns[correctIdx].classList.add('correct');
        playSound(false);
        document.getElementById('feedbackZone').innerHTML =
          '<div class="feedback-msg wrong">💪 C\'était ' + correct + ' ! Regarde bien le motif qui se répète.</div>';
        speak('C\'était ' + correct + ' ! Regarde bien le motif.');
      }

      const btnNext = document.getElementById('btnNext');
      btnNext.style.display   = 'block';
      btnNext.style.animation = 'none';
      void btnNext.offsetWidth;
      btnNext.style.animation = '';
    }

    function nextQuestion() {
      document.getElementById('btnNext').style.display = 'none';
      currentQ++;
      if (currentQ < TOTAL_Q) showQuestion();
      else showResult();
    }

    function getStars(s) {
      if (s >= 5) return 1;
      return 0;
    }

    function showResult() {
      document.getElementById('magicCard').style.display    = 'none';
      document.getElementById('answersGrid').style.display  = 'none';
      document.getElementById('feedbackZone').innerHTML     = '';
      document.getElementById('btnNext').style.display      = 'none';
      document.getElementById('progressBar').style.width    = '100%';

      const earned = getStars(score);
      document.getElementById('resultScreen').style.display = 'block';

      const titles = ['Continue !', 'Pas mal !', 'Bien joué !', 'Super !', 'Parfait ! 🎉'];
      document.getElementById('resultTitle').textContent = '🪄 ' + titles[earned];
      document.getElementById('starsEarned').textContent = earned > 0 ? '⭐'.repeat(earned) : '😊';
      document.getElementById('scoreDetail').textContent = score + ' / ' + TOTAL_Q + ' bonnes réponses';

      if (earned > 0) {
        launchConfetti();
        speak(titles[earned] + ' Tu as gagné ' + earned + (earned > 1 ? ' étoiles !' : ' étoile !'));
      } else {
        speak('Continue à t\'entraîner, tu vas y arriver !');
      }
      submitStars(earned);
    }

    async function submitStars(earned) {
      if (earned === 0) {
        document.getElementById('submitMsg').textContent = 'Rejoue pour gagner des étoiles !';
        return;
      }
      try {
        document.getElementById('submitMsg').textContent = '⏳ Envoi en cours...';
        const snap = await db.ref(DB_PATH + '/pendingGameStars').get();
        const val  = snap.val();
        const arr  = val ? (Array.isArray(val) ? val : Object.values(val)).filter(Boolean) : [];
        arr.push({
          id: Date.now().toString(),
          game: 'La Suite Magique',
          stars: earned,
          playedAt: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
        });
        await db.ref(DB_PATH + '/pendingGameStars').set(arr);
        document.getElementById('submitMsg').textContent =
          '✅ ' + earned + (earned > 1 ? ' étoiles' : ' étoile') + ' en attente de validation !';
      } catch(e) {
        document.getElementById('submitMsg').textContent = '❌ Erreur d\'envoi. Dis-le à Papa !';
      }
    }

    function goBack() {
      window.location.href = 'jeux.html?played=jeu-7' + (isTest ? '&test' : '');
    }

    startGame();
  </script>
</body>
</html>
