<head>

  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #1a0533 0%, #2d1b69 50%, #0d1b4b 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 16px;
      overflow: hidden;
      user-select: none;
    }

    /* ── Fond étoilé ── */
    .star-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star-bg span {
      position: absolute;
      color: rgba(255,255,255,0.6);
      animation: twinkle linear infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.7); }
      50%       { opacity: 1;   transform: scale(1.3); }
    }

    /* ── Conteneur principal ── */
    .game-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 420px;
      display: flex; flex-direction: column; align-items: center;
      gap: 16px;
    }

    /* ── Écrans ── */
    .screen { display: none; width: 100%; flex-direction: column; align-items: center; gap: 16px; }
    .screen.active { display: flex; }

    /* ── Loading ── */
    #screen-loading .load-emoji {
      font-size: 72px;
      animation: floatBig 1.5s ease-in-out infinite;
    }
    #screen-loading p { color: #d8b4fe; font-size: 18px; font-weight: bold; }

    /* ── Header barre ── */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; padding: 0 4px;
    }
    .btn-quit {
      background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2);
      border-radius: 50px; color: #fff; padding: 8px 16px;
      font-size: 13px; font-weight: bold; cursor: pointer;
      text-decoration: none;
    }
    .progress-pills { display: flex; gap: 8px; }
    .pill {
      width: 32px; height: 10px; border-radius: 20px;
      background: rgba(255,255,255,0.2); transition: background 0.4s;
    }
    .pill.done { background: #ffd700; }
    .pill.current { background: #a78bfa; }
    .score-chip {
      background: rgba(255,215,0,0.15); border: 2px solid #ffd700;
      border-radius: 50px; padding: 6px 14px;
      font-size: 16px; font-weight: bold; color: #ffd700;
    }

    /* ── Carte image ── */
    .image-card {
      width: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.92) 0%, rgba(255,235,255,0.92) 100%);
      border-radius: 32px;
      padding: 28px 20px 20px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(168,85,247,0.35), 0 0 0 3px rgba(255,255,255,0.4);
      position: relative; overflow: hidden;
    }
    .card-sparkles {
      position: absolute; inset: 0; pointer-events: none;
    }
    .card-sparkles span {
      position: absolute; font-size: 18px;
      animation: sparkFloat ease-in-out infinite;
      opacity: 0.7;
    }
    @keyframes sparkFloat {
      0%, 100% { transform: translateY(0) rotate(0deg);  opacity: 0.5; }
      50%       { transform: translateY(-8px) rotate(20deg); opacity: 1; }
    }
    .question-emoji {
      font-size: 100px; display: block;
      animation: floatBig 2.5s ease-in-out infinite;
      line-height: 1.1;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.15));
    }
    .question-label {
      margin-top: 10px;
      font-size: 15px; font-weight: bold; color: #7c3aed;
      letter-spacing: 1px;
    }
    .feedback-banner {
      margin-top: 12px;
      font-size: 20px; font-weight: 900;
      border-radius: 16px; padding: 8px 20px;
      display: none;
    }
    .feedback-banner.correct { background: #dcfce7; color: #16a34a; display: block; }
    .feedback-banner.wrong   { background: #fee2e2; color: #dc2626; display: block; }

    /* ── Boutons réponse ── */
    .answers { display: flex; flex-direction: column; gap: 12px; width: 100%; }
    .btn-answer {
      width: 100%; min-height: 60px;
      padding: 14px 20px;
      border-radius: 20px;
      border: 3px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.1);
      color: #fff;
      font-size: 20px; font-weight: 900;
      letter-spacing: 2px;
      cursor: pointer;
      transition: transform 0.15s, background 0.2s, border-color 0.2s;
      backdrop-filter: blur(4px);
    }
    .btn-answer:active { transform: scale(0.97); }
    .btn-answer:not(:disabled):hover { background: rgba(255,255,255,0.2); }
    .btn-answer.correct {
      background: linear-gradient(135deg, #16a34a, #4ade80) !important;
      border-color: #4ade80 !important;
      animation: bumpUp 0.3s ease;
    }
    .btn-answer.wrong {
      background: linear-gradient(135deg, #dc2626, #f87171) !important;
      border-color: #f87171 !important;
      animation: shake 0.4s ease;
    }
    .btn-answer.reveal {
      background: linear-gradient(135deg, #16a34a, #4ade80) !important;
      border-color: #4ade80 !important;
    }
    .btn-answer:disabled { cursor: default; }

    @keyframes bumpUp  { 0% { transform: scale(1); } 50% { transform: scale(1.06); } 100% { transform: scale(1); } }
    @keyframes shake   { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-8px)} 75%{transform:translateX(8px)} }
    @keyframes floatBig { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-10px)} }

    /* ── Confettis ── */
    .confetti-piece {
      position: fixed; top: -20px; pointer-events: none; z-index: 999;
      font-size: 22px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg);    opacity: 1; }
      80%  { opacity: 1; }
      100% { transform: translateY(110vh) rotate(720deg); opacity: 0; }
    }
    .btn-next {
      display: none; width: 100%; padding: 18px;
      border-radius: 50px; border: none;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: #fff; font-size: 22px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 20px rgba(168,85,247,0.4);
      animation: bumpIn 0.3s ease;
    }
    @keyframes bumpIn { 0%{transform:scale(0.8);opacity:0} 100%{transform:scale(1);opacity:1} }

    /* ── Écran résultat ── */
    .result-card {
      width: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.93) 0%, rgba(255,230,255,0.93) 100%);
      border-radius: 32px;
      padding: 35px 24px 28px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(168,85,247,0.35);
    }
    .result-stars-row {
      font-size: 52px; letter-spacing: 4px; margin-bottom: 14px;
    }
    .result-title {
      font-size: 28px; font-weight: 900; color: #7c3aed;
      font-family: Georgia, serif; margin-bottom: 6px;
    }
    .result-detail {
      font-size: 17px; color: #6b21a8; margin-bottom: 24px; font-weight: bold;
    }
    .result-pending {
      font-size: 13px; color: #9333ea; margin-bottom: 20px;
      background: rgba(147,51,234,0.08); border-radius: 12px; padding: 10px 16px;
    }
    .result-btns { display: flex; flex-direction: column; gap: 12px; }
    .btn-replay {
      padding: 16px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: #fff; font-size: 18px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 16px rgba(168,85,247,0.4);
    }
    .btn-menu {
      padding: 14px; border-radius: 50px;
      border: 2px solid rgba(124,58,237,0.4);
      background: transparent;
      color: #7c3aed; font-size: 16px; font-weight: bold; cursor: pointer;
    }
  </style>
</head>
<body>

<div class="star-bg" id="starBg"></div>

<div class="game-wrap">

  <!-- ══ LOADING ══ -->
  <div id="screen-loading" class="screen active">
    <div class="load-emoji">✨</div>
    <p>Chargement...</p>
  </div>

  <!-- ══ JEU ══ -->
  <div id="screen-game" class="screen">
    <div class="top-bar">
      <a id="quitBtn" href="jeux.html" class="btn-quit">← Menu</a>
      <div class="progress-pills">
        <div class="pill" id="pill0"></div>
        <div class="pill" id="pill1"></div>
        <div class="pill" id="pill2"></div>
      </div>
      <div class="score-chip">⭐ <span id="scoreDisplay">0</span></div>
    </div>

    <div class="image-card" id="imageCard">
      <div class="card-sparkles" id="cardSparkles"></div>
      <span class="question-emoji" id="questionEmoji">🐱</span>
      <div class="question-label">Quel est ce mot ?</div>
      <div class="feedback-banner" id="feedbackBanner"></div>
    </div>

    <div class="answers" id="answersContainer">
      <button class="btn-answer" id="btn0" onclick="checkAnswer(0)"></button>
      <button class="btn-answer" id="btn1" onclick="checkAnswer(1)"></button>
      <button class="btn-answer" id="btn2" onclick="checkAnswer(2)"></button>
      <button class="btn-next" id="btnNext" onclick="nextQuestion()">Suivant →</button>
    </div>
  </div>

  <!-- ══ RÉSULTAT ══ -->
  <div id="screen-result" class="screen">
    <div class="result-card">
      <div class="result-stars-row" id="resultStars"></div>
      <div class="result-title" id="resultTitle"></div>
      <div class="result-detail" id="resultDetail"></div>
      <div class="result-pending">
        ⏳ Tes étoiles attendent la validation de maman !
      </div>
      <div class="result-btns">
        <button class="btn-replay" onclick="startGame()">🔄 Rejouer</button>
        <button class="btn-menu" onclick="goMenu()">← Retour au menu</button>
      </div>
    </div>
  </div>

</div>

<script>
// ══════════════════════════════════════
//  BANQUE DE QUESTIONS
// ══════════════════════════════════════
const allQuestions = [
  { emoji: '🐱', answer: 'CHAT',       options: ['CHAT',       'CHIEN',    'LAPIN']     },
  { emoji: '🐶', answer: 'CHIEN',      options: ['CHAT',       'CHIEN',    'CANARD']    },
  { emoji: '🍎', answer: 'POMME',      options: ['POIRE',      'POMME',    'PRUNE']     },
  { emoji: '🌸', answer: 'FLEUR',      options: ['ARBRE',      'FLEUR',    'HERBE']     },
  { emoji: '🌙', answer: 'LUNE',       options: ['LUNE',       'ÉTOILE',   'NUAGE']     },
  { emoji: '☀️', answer: 'SOLEIL',     options: ['LUNE',       'PLUIE',    'SOLEIL']    },
  { emoji: '🏠', answer: 'MAISON',     options: ['ÉCOLE',      'MAISON',   'PORTE']     },
  { emoji: '🎂', answer: 'GÂTEAU',     options: ['PAIN',       'GÂTEAU',   'TARTE']     },
  { emoji: '👑', answer: 'COURONNE',   options: ['CHAPEAU',    'COURONNE', 'ROBE']      },
  { emoji: '🦋', answer: 'PAPILLON',   options: ['ABEILLE',    'PAPILLON', 'MOUCHE']    },
  { emoji: '🚂', answer: 'TRAIN',      options: ['VOITURE',    'AVION',    'TRAIN']     },
  { emoji: '🦄', answer: 'LICORNE',    options: ['CHEVAL',     'LICORNE',  'DRAGON']    },
  { emoji: '🍓', answer: 'FRAISE',     options: ['CERISE',     'FRAISE',   'BANANE']    },
  { emoji: '🎈', answer: 'BALLON',     options: ['BALLON',     'BULLE',    'BOULE']     },
  { emoji: '🐠', answer: 'POISSON',    options: ['CRABE',      'POISSON',  'REQUIN']    },
  { emoji: '🐸', answer: 'GRENOUILLE', options: ['SERPENT',    'LAPIN',    'GRENOUILLE']},
  { emoji: '⭐', answer: 'ÉTOILE',     options: ['LUNE',       'ÉTOILE',   'SOLEIL']    },
  { emoji: '🦁', answer: 'LION',       options: ['TIGRE',      'LION',     'OURS']      },
  { emoji: '🍄', answer: 'CHAMPIGNON', options: ['CHAMPIGNON', 'HERBE',    'MOUSSE']    },
  { emoji: '🌈', answer: 'ARC-EN-CIEL',options: ['NUAGE',      'PLUIE',    'ARC-EN-CIEL']},
];

// ══════════════════════════════════════
//  ÉTAT DU JEU
// ══════════════════════════════════════
const TOTAL_Q = 3;
let gameQuestions = [];
let currentQ     = 0;
let score        = 0;
let answered     = false;

// ══════════════════════════════════════
//  INIT
// ══════════════════════════════════════
window.addEventListener('load', async () => {
  buildStarBg();
  buildCardSparkles();
  await new Promise(r => setTimeout(r, 800));
  showScreen('game');
  startGame();
});

function startGame() {
  // Mélange et prend TOTAL_Q questions
  const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
  gameQuestions = shuffled.slice(0, TOTAL_Q);
  currentQ = 0;
  score    = 0;
  updateScoreDisplay();
  showScreen('game');
  showQuestion();
}

// ══════════════════════════════════════
//  AFFICHER UNE QUESTION
// ══════════════════════════════════════
function showQuestion() {
  answered = false;
  const q = gameQuestions[currentQ];

  // Pilules de progression
  for (let i = 0; i < TOTAL_Q; i++) {
    const p = document.getElementById('pill' + i);
    p.className = 'pill' + (i < currentQ ? ' done' : i === currentQ ? ' current' : '');
  }

  // Emoji
  const emojiEl = document.getElementById('questionEmoji');
  emojiEl.textContent = q.emoji;
  emojiEl.style.animation = 'none';
  void emojiEl.offsetWidth;
  emojiEl.style.animation = '';

  // Réinitialiser feedback
  const banner = document.getElementById('feedbackBanner');
  banner.className = 'feedback-banner';
  banner.textContent = '';

  // Mélanger les options
  const opts = [...q.options].sort(() => Math.random() - 0.5);

  for (let i = 0; i < 3; i++) {
    const btn = document.getElementById('btn' + i);
    btn.textContent = opts[i];
    btn.className   = 'btn-answer';
    btn.disabled    = false;
  }

  // URL du bouton quitter (avec ?test si nécessaire)
  document.getElementById('quitBtn').href = 'jeux.html' + (DB_PATH === 'calyApp-test' ? '?test' : '');
}

// ══════════════════════════════════════
//  VÉRIFIER UNE RÉPONSE
// ══════════════════════════════════════
function checkAnswer(btnIndex) {
  if (answered) return;
  answered = true;

  const q      = gameQuestions[currentQ];
  const chosen = document.getElementById('btn' + btnIndex).textContent;
  const isOk   = chosen === q.answer;

  // Désactiver tous les boutons
  for (let i = 0; i < 3; i++) document.getElementById('btn' + i).disabled = true;

  const btn    = document.getElementById('btn' + btnIndex);
  const banner = document.getElementById('feedbackBanner');

  if (isOk) {
    btn.classList.add('correct');
    banner.textContent = 'Bravo ! 🌟';
    banner.className   = 'feedback-banner correct';
    score++;
    updateScoreDisplay();
    playSound('correct');
    triggerConfetti(8);
  } else {
    btn.classList.add('wrong');
    banner.textContent = 'Presque ! Le bon mot était : ' + q.answer;
    banner.className   = 'feedback-banner wrong';
    playSound('wrong');
    // Montrer la bonne réponse
    for (let i = 0; i < 3; i++) {
      if (document.getElementById('btn' + i).textContent === q.answer) {
        document.getElementById('btn' + i).classList.add('reveal');
      }
    }
  }

  // Afficher le bouton Suivant
  const btnNext = document.getElementById('btnNext');
  btnNext.style.display = 'block';
  btnNext.style.animation = 'none'; void btnNext.offsetWidth; btnNext.style.animation = '';
}

// ══════════════════════════════════════
//  RÉSULTAT
// ══════════════════════════════════════
async function showResult() {
  showScreen('result');

  const starsRow   = document.getElementById('resultStars');
  const titleEl    = document.getElementById('resultTitle');
  const detailEl   = document.getElementById('resultDetail');

  const earned = Math.min(score, 2); // max 2 étoiles

  starsRow.textContent = '⭐'.repeat(earned) + '☆'.repeat(2 - earned);

  const messages = [
    ['Continue !',   'Tu vas y arriver !'],
    ['Bien joué !',  'Tu gagnes 1 étoile !'],
    ['Parfait !',    'Tu gagnes 2 étoiles ! 🎉'],
  ];
  const [title, detail] = messages[earned];
  titleEl.textContent  = title;
  detailEl.textContent = detail;

  if (earned >= 2) { playSound('fanfare'); triggerConfetti(20); }
  else if (earned === 1) playSound('correct');

  speak(title + ' ' + detail);

  // Soumettre à Firebase
  try {
    const snap = await db.ref(DB_PATH + '/pendingGameStars').get();
    const val  = snap.val();
    const arr  = val ? (Array.isArray(val) ? val : Object.values(val)).filter(Boolean) : [];
    const now  = new Date();
    arr.push({
      id:       Date.now().toString(),
      game:     'Le Mot Mystère',
      stars:    earned,
      playedAt: String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0'),
    });
    await db.ref(DB_PATH + '/pendingGameStars').set(arr);
  } catch (e) { console.error(e); }
}

function nextQuestion() {
  document.getElementById('btnNext').style.display = 'none';
  currentQ++;
  if (currentQ < TOTAL_Q) showQuestion();
  else showResult();
}

function goMenu() {
  window.location.href = 'jeux.html?played=jeu-15' + (DB_PATH === 'calyApp-test' ? '&test' : '');
}

// ══════════════════════════════════════
//  HELPERS UI
// ══════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function updateScoreDisplay() {
  document.getElementById('scoreDisplay').textContent = score;
}

// ══════════════════════════════════════
//  AUDIO (Web Audio API)
// ══════════════════════════════════════
function playSound(type) {
  try {
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const gain = ctx.createGain();
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.35, ctx.currentTime);

    if (type === 'correct') {
      [523, 659, 784].forEach((freq, i) => {
        const o = ctx.createOscillator();
        o.type = 'sine'; o.frequency.value = freq;
        o.connect(gain);
        o.start(ctx.currentTime + i * 0.12);
        o.stop(ctx.currentTime + i * 0.12 + 0.18);
      });
    } else if (type === 'wrong') {
      const o = ctx.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = 220;
      o.connect(gain);
      gain.gain.setValueAtTime(0.2, ctx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.start(ctx.currentTime);
      o.stop(ctx.currentTime + 0.4);
    } else if (type === 'fanfare') {
      [523, 659, 784, 1047].forEach((freq, i) => {
        const o = ctx.createOscillator();
        o.type = 'sine'; o.frequency.value = freq;
        o.connect(gain);
        o.start(ctx.currentTime + i * 0.15);
        o.stop(ctx.currentTime + i * 0.15 + 0.25);
      });
    }
  } catch(e) {}
}

// ══════════════════════════════════════
//  SYNTHÈSE VOCALE
// ══════════════════════════════════════
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = 'fr-FR';
  window.speechSynthesis.speak(msg);
}

// ══════════════════════════════════════
//  CONFETTIS
// ══════════════════════════════════════
function triggerConfetti(count) {
  const emojis = ['⭐','🌟','✨','💫','🎉','🌸','💖','🦄'];
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (16 + Math.random() * 20) + 'px';
      const dur = (1.5 + Math.random() * 2).toFixed(1);
      el.style.animationDuration = dur + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000 + 100);
    }, i * 80);
  }
}

// ══════════════════════════════════════
//  DÉCORATION
// ══════════════════════════════════════
function buildStarBg() {
  const bg = document.getElementById('starBg');
  const chars = ['✦','✧','⋆','·','∗'];
  for (let i = 0; i < 35; i++) {
    const s = document.createElement('span');
    s.textContent = chars[Math.floor(Math.random() * chars.length)];
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;
      font-size:${10+Math.random()*12}px;
      animation-duration:${2+Math.random()*4}s;
      animation-delay:${Math.random()*4}s;`;
    bg.appendChild(s);
  }
}

function buildCardSparkles() {
  const container = document.getElementById('cardSparkles');
  const positions = [
    {top:'8px',left:'12px'},{top:'8px',right:'12px'},
    {bottom:'8px',left:'12px'},{bottom:'8px',right:'12px'},
    {top:'50%',left:'6px'},{top:'50%',right:'6px'},
  ];
  positions.forEach((pos, i) => {
    const s = document.createElement('span');
    s.textContent = ['✨','⭐','💫','🌟','✦','✧'][i];
    s.style.cssText = Object.entries(pos).map(([k,v])=>`${k}:${v}`).join(';') +
      `;animation-duration:${2+i*0.4}s;animation-delay:${i*0.3}s;font-size:16px;`;
    container.appendChild(s);
  });
}
</script>

</body>
