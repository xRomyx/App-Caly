<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Le château des mots ✨</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvRCxPT2W7djJcHSR9kweBnaNXYQtdZqo",
      authDomain: "app-caly.firebaseapp.com",
      databaseURL: "https://app-caly-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "app-caly",
      storageBucket: "app-caly.firebasestorage.app",
      messagingSenderId: "870451326147",
      appId: "1:870451326147:web:465cff6467b66efeda4676"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const DB_PATH = new URLSearchParams(window.location.search).has('test') ? 'calyApp-test' : 'calyApp';
    const isTest = DB_PATH === 'calyApp-test';
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0a0f1e 0%, #1a2540 50%, #0a0f1e 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 12px 16px 20px; color: #fff; overflow-x: hidden;
    }
    .test-banner {
      background: #ff9800; color: #fff; padding: 6px 14px;
      border-radius: 10px; text-align: center; font-weight: bold;
      margin-bottom: 10px; font-size: 13px; width: 100%; max-width: 480px;
    }
    .game-header { text-align: center; margin-bottom: 12px; width: 100%; max-width: 480px; }
    .game-title {
      font-size: 28px; font-weight: 900;
      background: linear-gradient(135deg, #ffd700, #f59e0b, #fbbf24);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 10px;
    }
    .progress-bar-wrap {
      background: rgba(255,255,255,0.1);
      border-radius: 50px; height: 10px; width: 100%; margin-bottom: 6px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #f59e0b, #ffd700);
      height: 100%; border-radius: 50px; transition: width 0.4s ease;
    }
    .progress-text { font-size: 13px; color: rgba(255,255,255,0.6); }

    /* Carte château */
    .castle-card {
      background: rgba(255, 215, 0, 0.06);
      border: 2px solid rgba(255, 215, 0, 0.25);
      border-radius: 28px; padding: 28px 22px 22px;
      width: 100%; max-width: 480px;
      text-align: center; position: relative; margin-bottom: 14px;
    }
    .castle-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, #ffd700, #f59e0b, #ffd700);
      border-radius: 28px 28px 0 0;
    }
    .sparkle {
      position: absolute; font-size: 18px;
      animation: sparkleAnim 2.5s ease-in-out infinite; pointer-events: none;
    }
    .sparkle:nth-child(1) { top: -9px; left: 12%; animation-delay: 0s; }
    .sparkle:nth-child(2) { top: -9px; right: 12%; animation-delay: 1s; }
    .sparkle:nth-child(3) { bottom: -9px; right: 22%; animation-delay: 1.8s; }
    @keyframes sparkleAnim {
      0%, 100% { transform: scale(0.7) rotate(-15deg); opacity: 0.4; }
      50%       { transform: scale(1.3) rotate(15deg);  opacity: 1; }
    }

    .card-label {
      font-size: 13px; color: #fbbf24; font-weight: bold;
      text-transform: uppercase; letter-spacing: 2px; margin-bottom: 16px;
    }

    /* La phrase avec le trou */
    .sentence {
      font-size: 22px; font-weight: 700; line-height: 1.7;
      color: #f1f5f9; margin-bottom: 18px;
    }
    .blank {
      display: inline-block;
      min-width: 90px; padding: 2px 10px;
      border-bottom: 3px solid #ffd700;
      color: #ffd700; font-weight: 900;
      font-style: italic; letter-spacing: 2px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.5; }
    }
    .blank.filled {
      animation: none; opacity: 1;
      border-bottom-color: #86efac; color: #86efac;
    }

    .speak-btn {
      background: rgba(255,215,0,0.15);
      border: 2px solid rgba(255,215,0,0.35);
      border-radius: 50px; color: #fbbf24; font-size: 14px;
      padding: 7px 18px; cursor: pointer; transition: background 0.2s;
    }
    .speak-btn:active { background: rgba(255,215,0,0.35); }

    /* Boutons mots — fond neutre identique */
    .words-grid {
      display: flex; flex-direction: column;
      gap: 12px; margin-bottom: 20px;
      width: 100%; max-width: 480px;
    }
    .word-btn {
      width: 100%; padding: 18px 20px;
      border-radius: 16px;
      border: 3px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.07);
      color: #f1f5f9; font-size: 22px; font-weight: 900;
      letter-spacing: 2px; cursor: pointer;
      transition: transform 0.1s, border-color 0.2s;
      box-shadow: 0 3px 14px rgba(0,0,0,0.25);
    }
    .word-btn:active:not(:disabled) { transform: scale(0.97); }
    .word-btn:disabled { cursor: default; }
    .word-btn.correct {
      background: linear-gradient(135deg, #16a34a, #15803d) !important;
      border-color: #86efac !important;
      transform: scale(1.03) !important;
      box-shadow: 0 0 30px rgba(34,197,94,0.8), 0 0 60px rgba(34,197,94,0.25) !important;
      animation: bumpIn 0.35s ease;
    }
    .word-btn.wrong {
      background: linear-gradient(135deg, #dc2626, #b91c1c) !important;
      border-color: #fca5a5 !important;
      box-shadow: 0 0 25px rgba(239,68,68,0.8) !important;
      animation: shake 0.45s ease;
    }
    .word-btn.dimmed { opacity: 0.3; }

    /* Feedback */
    .feedback-zone {
      min-height: 54px; text-align: center;
      width: 100%; max-width: 480px; margin-bottom: 10px;
    }
    .feedback-msg {
      font-size: 17px; font-weight: bold;
      padding: 12px 18px; border-radius: 16px;
      animation: bumpIn 0.3s ease; line-height: 1.4;
    }
    .feedback-msg.correct { background: rgba(34,197,94,0.2);  color: #86efac; }
    .feedback-msg.wrong   { background: rgba(239,68,68,0.2);  color: #fca5a5; }

    /* Suivant */
    .btn-next {
      display: none; width: 100%; max-width: 480px;
      padding: 13px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, #f59e0b, #ffd700);
      color: #1a0f00; font-size: 22px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 20px rgba(255,215,0,0.4);
      margin-bottom: 20px;
    }

    /* Result */
    .result-screen { display: none; text-align: center; width: 100%; max-width: 480px; }
    .result-title {
      font-size: 36px; font-weight: 900;
      background: linear-gradient(135deg, #ffd700, #f59e0b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 14px;
    }
    .stars-earned { font-size: 56px; margin: 14px 0; animation: bumpUp 0.6s ease; min-height: 70px; }
    .score-detail { font-size: 18px; color: rgba(255,255,255,0.65); margin-bottom: 14px; }
    .submit-msg   { font-size: 14px; color: rgba(255,255,255,0.5);  margin-bottom: 18px; min-height: 22px; }
    .btn-retour {
      width: 100%; padding: 13px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, #ffd700, #f59e0b);
      color: #1a0f00; font-size: 20px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 20px rgba(255,215,0,0.4);
    }

    /* Confetti */
    .confetti-container {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 100; overflow: hidden;
    }
    .confetti-piece {
      position: absolute; border-radius: 2px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    .star-bg {
      position: fixed; pointer-events: none;
      top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; z-index: 0;
    }
    .star-bg span { position: absolute; font-size: 13px; animation: twinkle linear infinite; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50%       { opacity: 0.7; transform: scale(1.2); }
    }
    .content {
      position: relative; z-index: 1; width: 100%;
      display: flex; flex-direction: column; align-items: center;
    }

    @keyframes bumpIn {
      0%   { transform: scale(0.85); opacity: 0; }
      70%  { transform: scale(1.04); }
      100% { transform: scale(1);   opacity: 1; }
    }
    @keyframes bumpUp {
      0%   { transform: translateY(30px) scale(0.5); opacity: 0; }
      60%  { transform: translateY(-10px) scale(1.1); }
      100% { transform: translateY(0) scale(1);      opacity: 1; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-8px); }
      40%       { transform: translateX(8px); }
      60%       { transform: translateX(-6px); }
      80%       { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <div class="star-bg" id="starBg"></div>
  <div class="confetti-container" id="confettiContainer"></div>

  <div class="content">
    <div id="testBanner"></div>

    <div class="game-header">
      <div class="game-title">🏰 Le château des mots</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
      </div>
      <div class="progress-text" id="progressText">Question 1 / 8</div>
    </div>

    <!-- Carte -->
    <div class="castle-card" id="castleCard">
      <span class="sparkle">✦</span>
      <span class="sparkle">✧</span>
      <span class="sparkle">✦</span>
      <div class="card-label">Complète la phrase</div>
      <div class="sentence" id="sentenceEl"></div>
      <button class="speak-btn" onclick="speakSentence()">🔊 Réécouter</button>
    </div>

    <!-- Choix de mots -->
    <div class="words-grid" id="wordsGrid"></div>

    <!-- Feedback -->
    <div class="feedback-zone" id="feedbackZone"></div>

    <!-- Suivant -->
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Suivant →</button>

    <!-- Result -->
    <div class="result-screen" id="resultScreen">
      <div class="result-title" id="resultTitle"></div>
      <div class="stars-earned" id="starsEarned"></div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="submit-msg" id="submitMsg"></div>
      <button class="btn-retour" onclick="goBack()">🎮 Retour aux jeux</button>
    </div>
  </div>

  <script>
    // ── Fond étoilé ──────────────────────────────────────────────────────────
    const bg = document.getElementById('starBg');
    for (let i = 0; i < 30; i++) {
      const s = document.createElement('span');
      s.textContent = ['✦','✧','⋆','·','★','◆'][Math.floor(Math.random()*6)];
      s.style.left = Math.random()*100 + '%';
      s.style.top  = Math.random()*100 + '%';
      s.style.animationDuration = (3 + Math.random()*5) + 's';
      s.style.animationDelay    = (Math.random()*5) + 's';
      bg.appendChild(s);
    }
    if (isTest) {
      document.getElementById('testBanner').innerHTML =
        '<div class="test-banner">🧪 VERSION TEST</div>';
    }

    // ── Pool de phrases ───────────────────────────────────────────────────────
    // before = texte avant le trou, after = texte après, answer = bon mot, wrong = leurres
    // Les leurres sont toujours du même type grammatical → elle doit comprendre, pas deviner
    const ALL_QUESTIONS = [
      { before: 'Le poisson vit dans',    after: '.',                         answer: "L'EAU",      wrong: ["LE CIEL",      "L'HERBE"]      },
      { before: 'La nuit, on voit les',   after: 'dans le ciel.',             answer: 'ÉTOILES',    wrong: ['FLEURS',       'VOITURES']     },
      { before: 'Pour lire, on a besoin de ses', after: '.',                  answer: 'YEUX',       wrong: ['PIEDS',        'OREILLES']     },
      { before: 'En hiver, il fait',      after: 'et il neige.',              answer: 'FROID',      wrong: ['CHAUD',        'BEAU']         },
      { before: 'La',                     after: 'fait du miel.',             answer: 'ABEILLE',    wrong: ['GRENOUILLE',   'TORTUE']       },
      { before: 'Le médecin soigne les',  after: '.',                         answer: 'MALADES',    wrong: ['VOITURES',     'ARBRES']       },
      { before: 'La lune brille la',      after: '.',                         answer: 'NUIT',       wrong: ['MATIN',        'MIDI']         },
      { before: "Pour écrire, j'ai besoin d'un", after: '.',                 answer: 'CRAYON',     wrong: ['CHAPEAU',      'COUSSIN']      },
      { before: "Quand il pleut, on prend un", after: '.',                    answer: 'PARAPLUIE',  wrong: ['SANDWICH',     'OREILLER']     },
      { before: 'La',                     after: 'est le fruit des singes.',  answer: 'BANANE',     wrong: ['CAROTTE',      'FROMAGE']      },
      { before: 'Pour nager, on va à la', after: '.',                         answer: 'PISCINE',    wrong: ['FORÊT',        'BOULANGERIE']  },
      { before: "Sans eau, les plantes vont", after: '.',                     answer: 'MOURIR',     wrong: ['CHANTER',      'VOYAGER']      },
      { before: 'Les oiseaux font leur',  after: 'dans les arbres.',          answer: 'NID',        wrong: ['ÉCOLE',        'GÂTEAU']       },
      { before: 'Pour voir de loin, on met des', after: '.',                  answer: 'LUNETTES',   wrong: ['CHAUSSETTES',  'GANTS']        },
      { before: 'Le soleil se lève le',   after: 'et se couche le soir.',     answer: 'MATIN',      wrong: ['MIDI',         'MINUIT']       },
      { before: 'Le boulanger fabrique du', after: 'chaque matin.',           answer: 'PAIN',       wrong: ['VÉLO',         'CHÂTEAU']      },
      { before: 'En été, il fait',        after: 'et on va à la plage.',      answer: 'CHAUD',      wrong: ['FROID',        'SOMBRE']       },
      { before: 'Pour traverser la rue, on regarde à gauche et à', after: '.', answer: 'DROITE',   wrong: ['HAUT',         'BAS']          },
      { before: 'La neige fond quand il fait', after: '.',                    answer: 'CHAUD',      wrong: ['FROID',        'NUIT']         },
      { before: "Pour aller à l'école, on prend son", after: '.',             answer: 'SAC',        wrong: ['LIT',          'PISCINE']      },
    ];

    const TOTAL_Q  = 8;
    let selectedQ  = [];
    let currentQ   = 0;
    let score      = 0;
    let correctIdx = -1;
    let answered   = false;

    // ── Utilitaires ───────────────────────────────────────────────────────────
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'fr-FR'; utt.rate = 0.85; utt.pitch = 1.05;
      window.speechSynthesis.speak(utt);
    }

    function speakSentence() {
      const q = selectedQ[currentQ];
      if (!q) return;
      const full = q.before + '... quelque chose... ' + q.after + ' Quel est le mot manquant ?';
      speak(full);
    }

    function playSound(correct) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (correct) {
          [523, 659, 784, 1047].forEach((freq, i) => {
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = freq; osc.type = 'sine';
            gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.25);
            osc.start(ctx.currentTime + i * 0.1);
            osc.stop(ctx.currentTime + i * 0.1 + 0.25);
          });
        } else {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = 200; osc.type = 'sawtooth';
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
          osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.45);
        }
      } catch(e) {}
    }

    function launchConfetti() {
      const container = document.getElementById('confettiContainer');
      const colors = ['#ffd700','#f59e0b','#fbbf24','#34d399','#60a5fa','#fff'];
      for (let i = 0; i < 40; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random()*100 + '%';
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDuration = (1.5 + Math.random()*2) + 's';
        piece.style.animationDelay    = (Math.random()*0.5) + 's';
        const size = 8 + Math.random()*10;
        piece.style.width = size + 'px'; piece.style.height = size + 'px';
        container.appendChild(piece);
        setTimeout(() => piece.remove(), 3800);
      }
    }

    // ── Affichage de la phrase avec le trou ───────────────────────────────────
    function buildSentenceHTML(q, filledWord) {
      const blankClass = filledWord ? 'blank filled' : 'blank';
      const blankContent = filledWord ? filledWord : '___';
      let html = '';
      if (q.before) html += q.before + ' ';
      html += '<span class="' + blankClass + '">' + blankContent + '</span>';
      if (q.after)  html += ' ' + q.after;
      return html;
    }

    // ── Jeu ───────────────────────────────────────────────────────────────────
    function startGame() {
      selectedQ = shuffle(ALL_QUESTIONS).slice(0, TOTAL_Q);
      currentQ = 0; score = 0;
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      document.getElementById('btnNext').style.display       = 'none';
      document.getElementById('feedbackZone').innerHTML      = '';
      document.getElementById('resultScreen').style.display  = 'none';
      document.getElementById('castleCard').style.display    = '';
      document.getElementById('wordsGrid').style.display     = '';

      const q = selectedQ[currentQ];
      document.getElementById('sentenceEl').innerHTML = buildSentenceHTML(q, null);

      // Options mélangées
      const options = shuffle([q.answer, ...q.wrong]);
      correctIdx = options.indexOf(q.answer);

      // Progression
      document.getElementById('progressBar').style.width  = (currentQ / TOTAL_Q * 100) + '%';
      document.getElementById('progressText').textContent = 'Question ' + (currentQ + 1) + ' / ' + TOTAL_Q;

      // Boutons
      const grid = document.getElementById('wordsGrid');
      grid.innerHTML = '';
      options.forEach((word, idx) => {
        const btn = document.createElement('button');
        btn.className   = 'word-btn';
        btn.textContent = word;
        btn.onclick     = () => checkAnswer(idx, options);
        grid.appendChild(btn);
      });

      // Auto-lecture
      setTimeout(() => speakSentence(), 500);
    }

    function checkAnswer(idx, options) {
      if (answered) return;
      answered = true;

      const q    = selectedQ[currentQ];
      const btns = document.querySelectorAll('.word-btn');
      btns.forEach(b => b.disabled = true);

      const isCorrect = (idx === correctIdx);

      // Remplir le trou avec la bonne réponse
      document.getElementById('sentenceEl').innerHTML =
        buildSentenceHTML(q, q.answer);

      if (isCorrect) {
        btns[idx].classList.add('correct');
        score++;
        playSound(true);
        launchConfetti();
        document.getElementById('feedbackZone').innerHTML =
          '<div class="feedback-msg correct">✨ Bravo ! La phrase est complète !</div>';
        speak('Bravo ! ' + q.before + ' ' + q.answer + ' ' + q.after);
      } else {
        btns[idx].classList.add('wrong');
        btns[correctIdx].classList.add('correct');
        btns.forEach((b, i) => {
          if (i !== idx && i !== correctIdx) b.classList.add('dimmed');
        });
        playSound(false);
        document.getElementById('feedbackZone').innerHTML =
          '<div class="feedback-msg wrong">💪 Le mot manquant était : ' + q.answer + ' !</div>';
        speak('Le mot manquant était : ' + q.answer);
      }

      const btnNext = document.getElementById('btnNext');
      btnNext.style.display   = 'block';
      btnNext.style.animation = 'none';
      void btnNext.offsetWidth;
      btnNext.style.animation = '';
    }

    function nextQuestion() {
      document.getElementById('btnNext').style.display = 'none';
      currentQ++;
      if (currentQ < TOTAL_Q) showQuestion();
      else showResult();
    }

    // ── Résultat ──────────────────────────────────────────────────────────────
    function getStars(s) {
      if (s >= 6) return 2;
      if (s >= 3) return 1;
      return 0;
    }

    function showResult() {
      document.getElementById('castleCard').style.display   = 'none';
      document.getElementById('wordsGrid').style.display    = 'none';
      document.getElementById('feedbackZone').innerHTML     = '';
      document.getElementById('btnNext').style.display      = 'none';
      document.getElementById('progressBar').style.width    = '100%';

      const earned = getStars(score);
      document.getElementById('resultScreen').style.display = 'block';

      const titles = ['Continue !', 'Pas mal !', 'Bien joué !', 'Super !', 'Excellent !', 'Parfait ! 🎉'];
      document.getElementById('resultTitle').textContent = '🏰 ' + titles[earned];
      document.getElementById('starsEarned').textContent = earned > 0 ? '⭐'.repeat(earned) : '😊';
      document.getElementById('scoreDetail').textContent = score + ' / ' + TOTAL_Q + ' bonnes réponses';

      if (earned > 0) {
        launchConfetti();
        speak(titles[earned] + ' Tu as gagné ' + earned + (earned > 1 ? ' étoiles !' : ' étoile !'));
      } else {
        speak('Continue à t\'entraîner, tu vas y arriver !');
      }

      submitStars(earned);
    }

    async function submitStars(earned) {
      if (earned === 0) {
        document.getElementById('submitMsg').textContent = 'Rejoue pour gagner des étoiles !';
        return;
      }
      try {
        document.getElementById('submitMsg').textContent = '⏳ Envoi en cours...';
        const snap = await db.ref(DB_PATH + '/pendingGameStars').get();
        const val  = snap.val();
        const arr  = val ? (Array.isArray(val) ? val : Object.values(val)).filter(Boolean) : [];
        arr.push({
          id: Date.now().toString(),
          game: 'Le Château des Mots',
          stars: earned,
          playedAt: new Date().toLocaleDateString('fr-FR', {
            day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
          })
        });
        await db.ref(DB_PATH + '/pendingGameStars').set(arr);
        document.getElementById('submitMsg').textContent =
          '✅ ' + earned + (earned > 1 ? ' étoiles' : ' étoile') + ' en attente de validation !';
      } catch(e) {
        document.getElementById('submitMsg').textContent = '❌ Erreur d\'envoi. Dis-le à Papa !';
      }
    }

    function goBack() {
      window.location.href = 'jeux.html?played=jeu-20' + (isTest ? '&test' : '');
    }

    startGame();
  </script>
</body>
</html>
