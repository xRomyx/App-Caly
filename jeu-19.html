<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Les grandes énigmes ✨</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvRCxPT2W7djJcHSR9kweBnaNXYQtdZqo",
      authDomain: "app-caly.firebaseapp.com",
      databaseURL: "https://app-caly-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "app-caly",
      storageBucket: "app-caly.firebasestorage.app",

    firebase.initializeApp(firebaseConfig);

    const DB_PATH = new URLSearchParams(window.location.search).has('test') ? 'calyApp-test' : 'calyApp';
    const isTest = DB_PATH === 'calyApp-test';
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #0f1a2e 0%, #1a2d4a 50%, #0f1a2e 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 20px 16px 40px; color: #fff; overflow-x: hidden;
    }
    .test-banner {
      background: #ff9800; color: #fff; padding: 6px 14px;
      border-radius: 10px; text-align: center; font-weight: bold;
      margin-bottom: 10px; font-size: 13px; width: 100%; max-width: 480px;
    }
    .game-header { text-align: center; margin-bottom: 18px; width: 100%; max-width: 480px; }
    .game-title {
      font-size: 28px; font-weight: 900;
      background: linear-gradient(135deg, #ffd700, #60a5fa, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 10px;
    }
    .progress-bar-wrap {
      background: rgba(255,255,255,0.1);
      border-radius: 50px; height: 10px; width: 100%; margin-bottom: 6px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #60a5fa, #ffd700);
      height: 100%; border-radius: 50px; transition: width 0.4s ease;
    }
    .progress-text { font-size: 13px; color: rgba(255,255,255,0.6); }

    /* Carte devinette */
    .riddle-card {
      background: rgba(255,255,255,0.07);
      border: 2px solid rgba(96,165,250,0.3);
      border-radius: 28px; padding: 24px 22px;
      width: 100%; max-width: 480px;
      position: relative; margin-bottom: 20px;
    }
    .sparkle {
      position: absolute; font-size: 18px;
      animation: sparkleAnim 2.5s ease-in-out infinite; pointer-events: none;
    }
    .sparkle:nth-child(1) { top: -9px; left: 12%; animation-delay: 0s; }
    .sparkle:nth-child(2) { top: -9px; right: 12%; animation-delay: 1s; }
    .sparkle:nth-child(3) { bottom: -9px; right: 25%; animation-delay: 1.8s; }
    @keyframes sparkleAnim {
      0%, 100% { transform: scale(0.7) rotate(-15deg); opacity: 0.4; }
      50%       { transform: scale(1.3) rotate(15deg);  opacity: 1; }
    }

    .riddle-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 18px;
    }
    .riddle-icon { font-size: 36px; }
    .riddle-label {
      font-size: 14px; color: #93c5fd; font-weight: bold;
      text-transform: uppercase; letter-spacing: 1px;
    }

    /* Indices */
    .clues-list { list-style: none; padding: 0; }
    .clue-item {
      display: flex; align-items: flex-start; gap: 10px;
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      animation: slideIn 0.3s ease both;
    }
    .clue-item:last-child { border-bottom: none; padding-bottom: 0; }
    .clue-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #60a5fa; flex-shrink: 0; margin-top: 8px;
    }
    .clue-text {
      font-size: 19px; font-weight: 600; color: #e2e8f0; line-height: 1.4;
    }
    @keyframes slideIn {
      from { transform: translateX(-12px); opacity: 0; }
      to   { transform: translateX(0);     opacity: 1; }
    }
    .clue-item:nth-child(1) { animation-delay: 0.05s; }
    .clue-item:nth-child(2) { animation-delay: 0.15s; }
    .clue-item:nth-child(3) { animation-delay: 0.25s; }

    .speak-btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: rgba(96,165,250,0.2);
      border: 2px solid rgba(96,165,250,0.4);
      border-radius: 50px; color: #93c5fd; font-size: 14px;
      padding: 6px 16px; cursor: pointer; margin-top: 16px;
      transition: background 0.2s;
    }
    .speak-btn:active { background: rgba(96,165,250,0.4); }

    /* Boutons réponses */
    .answers-list {
      display: flex; flex-direction: column; gap: 12px;
      width: 100%; max-width: 480px; margin-bottom: 20px;
    }
    .answer-btn {
      width: 100%; padding: 16px 20px;
      border-radius: 18px;
      border: 3px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff; cursor: pointer;
      display: flex; align-items: center; gap: 14px;
      text-align: left; transition: transform 0.1s;
      box-shadow: 0 3px 12px rgba(0,0,0,0.2);
    }
    .answer-btn:active:not(:disabled) { transform: scale(0.98); }
    .answer-btn:disabled { cursor: default; }
    .ans-emoji { font-size: 38px; flex-shrink: 0; }
    .ans-label { font-size: 20px; font-weight: 700; }
    .answer-btn.correct {
      background: linear-gradient(135deg, #16a34a, #15803d) !important;
      border-color: #86efac !important;
      transform: scale(1.03) !important;
      box-shadow: 0 0 30px rgba(34,197,94,0.8), 0 0 60px rgba(34,197,94,0.25) !important;
      animation: bumpIn 0.35s ease;
    }
    .answer-btn.wrong {
      background: linear-gradient(135deg, #dc2626, #b91c1c) !important;
      border-color: #fca5a5 !important;
      box-shadow: 0 0 25px rgba(239,68,68,0.8) !important;
      animation: shake 0.45s ease;
    }
    .answer-btn.dimmed { opacity: 0.3; }

    /* Feedback */
    .feedback-zone {
      min-height: 54px; text-align: center;
      width: 100%; max-width: 480px; margin-bottom: 10px;
    }
    .feedback-msg {
      font-size: 17px; font-weight: bold;
      padding: 12px 18px; border-radius: 16px;
      animation: bumpIn 0.3s ease; line-height: 1.4;
    }
    .feedback-msg.correct { background: rgba(34,197,94,0.2);  color: #86efac; }
    .feedback-msg.wrong   { background: rgba(239,68,68,0.2);  color: #fca5a5; }

    /* Suivant */
    .btn-next {
      display: none; width: 100%; max-width: 480px;
      padding: 18px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, #60a5fa, #a855f7);
      color: #fff; font-size: 22px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 20px rgba(96,165,250,0.4);
      margin-bottom: 20px;
    }

    /* Result */
    .result-screen { display: none; text-align: center; width: 100%; max-width: 480px; }
    .result-title {
      font-size: 36px; font-weight: 900;
      background: linear-gradient(135deg, #ffd700, #60a5fa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 14px;
    }
    .stars-earned { font-size: 58px; margin: 14px 0; animation: bumpUp 0.6s ease; min-height: 70px; }
    .score-detail { font-size: 18px; color: rgba(255,255,255,0.65); margin-bottom: 22px; }
    .submit-msg   { font-size: 14px; color: rgba(255,255,255,0.5);  margin-bottom: 18px; min-height: 22px; }
    .btn-retour {
      width: 100%; padding: 18px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, #ffd700, #ff9800);
      color: #1a0533; font-size: 20px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 20px rgba(255,215,0,0.4);
    }

    /* Confetti */
    .confetti-container {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 100; overflow: hidden;
    }
    .confetti-piece {
      position: absolute; border-radius: 2px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    .star-bg {
      position: fixed; pointer-events: none;
      top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; z-index: 0;
    }
    .star-bg span { position: absolute; font-size: 13px; animation: twinkle linear infinite; }
    @keyframes twinkle {
      0%, 100% { opacity: 0.2; transform: scale(0.8); }
      50%       { opacity: 0.8; transform: scale(1.2); }
    }
    .content {
      position: relative; z-index: 1; width: 100%;
      display: flex; flex-direction: column; align-items: center;
    }

    @keyframes bumpIn {
      0%   { transform: scale(0.85); opacity: 0; }
      70%  { transform: scale(1.04); }
      100% { transform: scale(1);   opacity: 1; }
    }
    @keyframes bumpUp {
      0%   { transform: translateY(30px) scale(0.5); opacity: 0; }
      60%  { transform: translateY(-10px) scale(1.1); }
      100% { transform: translateY(0) scale(1);      opacity: 1; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-8px); }
      40%       { transform: translateX(8px); }
      60%       { transform: translateX(-6px); }
      80%       { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <div class="star-bg" id="starBg"></div>
  <div class="confetti-container" id="confettiContainer"></div>

  <div class="content">
    <div id="testBanner"></div>

    <div class="game-header">
      <div class="game-title">🔮 Les grandes énigmes</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
      </div>
      <div class="progress-text" id="progressText">Énigme 1 / 5</div>
    </div>

    <!-- Carte devinette -->
    <div class="riddle-card" id="riddleCard">
      <span class="sparkle">✦</span>
      <span class="sparkle">✧</span>
      <span class="sparkle">✦</span>
      <div class="riddle-header">
        <span class="riddle-icon">🔮</span>
        <span class="riddle-label">Lis les indices — qui suis-je ?</span>
      </div>
      <ul class="clues-list" id="cluesList"></ul>
      <button class="speak-btn" onclick="speakClues()">🔊 Réécouter</button>
    </div>

    <!-- Réponses -->
    <div class="answers-list" id="answersList"></div>

    <!-- Feedback -->
    <div class="feedback-zone" id="feedbackZone"></div>

    <!-- Suivant -->
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Suivant →</button>

    <!-- Result -->
    <div class="result-screen" id="resultScreen">
      <div class="result-title" id="resultTitle"></div>
      <div class="stars-earned" id="starsEarned"></div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="submit-msg" id="submitMsg"></div>
      <button class="btn-retour" onclick="goBack()">🎮 Retour aux jeux</button>
    </div>
  </div>

  <script>
    // ── Fond étoilé ──────────────────────────────────────────────────────────
    const bg = document.getElementById('starBg');
    for (let i = 0; i < 30; i++) {
      const s = document.createElement('span');
      s.textContent = ['✦','✧','⋆','·','★'][Math.floor(Math.random()*5)];
      s.style.left = Math.random()*100 + '%';
      s.style.top  = Math.random()*100 + '%';
      s.style.animationDuration = (3 + Math.random()*5) + 's';
      s.style.animationDelay    = (Math.random()*5) + 's';
      bg.appendChild(s);
    }
    if (isTest) {
      document.getElementById('testBanner').innerHTML =
        '<div class="test-banner">🧪 VERSION TEST</div>';
    }

    // ── Pool d'énigmes ────────────────────────────────────────────────────────
    // Faits surprenants — les mauvaises réponses partagent toujours des indices
    const ALL_QUESTIONS = [
      {
        clues: ["Je suis le seul animal domestique à m'être apprivoisé tout seul", "Je tourne mes deux oreilles indépendamment l'une de l'autre", "Je ronronne autant en inspirant qu'en expirant"],
        answer: { emoji: '🐈', label: 'Chat' },
        wrong:  [{ emoji: '🐕', label: 'Chien' }, { emoji: '🦁', label: 'Lion' }]
      },
      {
        clues: ["Je suis le seul mammifère capable de vraiment voler", "Je navigue dans le noir grâce aux sons que j'émets", "J'hiberne suspendu la tête en bas"],
        answer: { emoji: '🦇', label: 'Chauve-souris' },
        wrong:  [{ emoji: '🦅', label: 'Aigle' }, { emoji: '🦉', label: 'Hibou' }]
      },
      {
        clues: ["Ma maison fait partie de mon corps et je ne la quitte jamais", "Je peux vivre plus longtemps que ton arrière-grand-mère", "Je suis l'un des animaux les plus anciens de la planète"],
        answer: { emoji: '🐢', label: 'Tortue' },
        wrong:  [{ emoji: '🦀', label: 'Crabe' }, { emoji: '🐌', label: 'Escargot' }]
      },
      {
        clues: ["Je produis une nourriture qui ne se périme jamais", "Je visite des milliers de fleurs pour faire une cuillère de nourriture", "Je danse pour indiquer à mes amies où trouver à manger"],
        answer: { emoji: '🐝', label: 'Abeille' },
        wrong:  [{ emoji: '🦋', label: 'Papillon' }, { emoji: '🦟', label: 'Moustique' }]
      },
      {
        clues: ["Ma langue est bleu-violet et mesure presque 50 cm", "Je dors seulement 2 heures par nuit", "Mes bébés tombent de presque 2 mètres à leur naissance"],
        answer: { emoji: '🦒', label: 'Girafe' },
        wrong:  [{ emoji: '🐘', label: 'Éléphant' }, { emoji: '🐪', label: 'Chameau' }]
      },
      {
        clues: ["Je suis habillé en noir et blanc comme un serveur de restaurant", "Je nage à 40 km/h mais je ne peux pas voler", "Je vis dans l'endroit le plus froid de la planète"],
        answer: { emoji: '🐧', label: 'Pingouin' },
        wrong:  [{ emoji: '🦢', label: 'Cygne' }, { emoji: '🦜', label: 'Perroquet' }]
      },
      {
        clues: ["Je change de couleur selon mes émotions, pas seulement pour me cacher", "Mes deux yeux peuvent regarder dans deux directions différentes en même temps", "Je tire ma langue plus vite qu'un battement de cœur"],
        answer: { emoji: '🦎', label: 'Caméléon' },
        wrong:  [{ emoji: '🐸', label: 'Grenouille' }, { emoji: '🐍', label: 'Serpent' }]
      },
      {
        clues: ["Mes bébés naissent de la taille d'un grain de raisin", "Je peux me déplacer à 70 km/h en sautant", "Mon corps est fait pour avancer mais pas du tout pour reculer"],
        answer: { emoji: '🦘', label: 'Kangourou' },
        wrong:  [{ emoji: '🐇', label: 'Lapin' }, { emoji: '🐨', label: 'Koala' }]
      },
      {
        clues: ["Je dors avec seulement la moitié de mon cerveau à la fois", "Je reconnais mon propre reflet dans un miroir", "Je saute hors de l'eau juste pour le plaisir"],
        answer: { emoji: '🐬', label: 'Dauphin' },
        wrong:  [{ emoji: '🦈', label: 'Requin' }, { emoji: '🐋', label: 'Baleine' }]
      },
      {
        clues: ["Je nais blanc et je deviens coloré grâce à ce que je mange", "Je tiens sur une seule patte pour ne pas perdre de chaleur", "Mon bec est recourbé vers le bas pour filtrer l'eau"],
        answer: { emoji: '🦩', label: 'Flamant rose' },
        wrong:  [{ emoji: '🦢', label: 'Cygne' }, { emoji: '🦜', label: 'Perroquet' }]
      },
      {
        clues: ["J'ai trois cœurs et mon sang est bleu", "Je peux ouvrir des bocaux avec mes 8 bras", "Je peux imiter la forme et la couleur de presque n'importe quoi"],
        answer: { emoji: '🐙', label: 'Pieuvre' },
        wrong:  [{ emoji: '🦑', label: 'Calmar' }, { emoji: '🦀', label: 'Crabe' }]
      },
      {
        clues: ["J'oublie la moitié des noisettes que je cache pour l'hiver", "Je peux descendre un arbre la tête en bas", "Je peux tomber de plusieurs mètres sans me blesser grâce à ma queue"],
        answer: { emoji: '🐿️', label: 'Écureuil' },
        wrong:  [{ emoji: '🐇', label: 'Lapin' }, { emoji: '🦔', label: 'Hérisson' }]
      },
      {
        clues: ["Je suis le seul grand félin à vivre en groupe", "Ce sont les femelles qui chassent et nourrissent toute la famille", "Le mâle et la femelle ont l'air très différents"],
        answer: { emoji: '🦁', label: 'Lion' },
        wrong:  [{ emoji: '🐯', label: 'Tigre' }, { emoji: '🐆', label: 'Léopard' }]
      },
      {
        clues: ["Mes piquants sont en réalité des poils durcis et creux", "Je peux manger des champignons vénéneux sans tomber malade", "Je peux avoir jusqu'à 7000 piquants sur le dos"],
        answer: { emoji: '🦔', label: 'Hérisson' },
        wrong:  [{ emoji: '🐇', label: 'Lapin' }, { emoji: '🐭', label: 'Souris' }]
      },
      {
        clues: ["Je suis sur Terre depuis l'époque des dinosaures sans avoir changé", "Je ne peux pas mâcher : j'avale mes proies entières ou en gros morceaux", "Ma mâchoire est la plus puissante de tout le règne animal"],
        answer: { emoji: '🐊', label: 'Crocodile' },
        wrong:  [{ emoji: '🦎', label: 'Lézard' }, { emoji: '🐍', label: 'Serpent' }]
      },
    ];

    const TOTAL_Q  = 5;
    let selectedQ  = [];
    let currentQ   = 0;
    let score      = 0;
    let correctIdx = -1;
    let answered   = false;

    // ── Utilitaires ───────────────────────────────────────────────────────────
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = 'fr-FR'; utt.rate = 0.88; utt.pitch = 1.05;
      window.speechSynthesis.speak(utt);
    }

    function speakClues() {
      const q = selectedQ[currentQ];
      if (q) speak(q.clues.join('. ') + '. Qui suis-je ?');
    }

    function playSound(correct) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (correct) {
          [523, 659, 784, 1047].forEach((freq, i) => {
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = freq; osc.type = 'sine';
            gain.gain.setValueAtTime(0.25, ctx.currentTime + i * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.1 + 0.25);
            osc.start(ctx.currentTime + i * 0.1);
            osc.stop(ctx.currentTime + i * 0.1 + 0.25);
          });
        } else {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = 200; osc.type = 'sawtooth';
          gain.gain.setValueAtTime(0.28, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.5);
          osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.5);
        }
      } catch(e) {}
    }

    function launchConfetti() {
      const container = document.getElementById('confettiContainer');
      const colors = ['#ffd700','#60a5fa','#a855f7','#34d399','#f472b6','#fff'];
      for (let i = 0; i < 40; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random()*100 + '%';
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDuration = (1.5 + Math.random()*2) + 's';
        piece.style.animationDelay    = (Math.random()*0.5) + 's';
        const size = 8 + Math.random()*10;
        piece.style.width = size + 'px'; piece.style.height = size + 'px';
        container.appendChild(piece);
        setTimeout(() => piece.remove(), 3800);
      }
    }

    // ── Jeu ───────────────────────────────────────────────────────────────────
    function startGame() {
      selectedQ = shuffle(ALL_QUESTIONS).slice(0, TOTAL_Q);
      currentQ = 0; score = 0;
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      document.getElementById('btnNext').style.display      = 'none';
      document.getElementById('feedbackZone').innerHTML     = '';
      document.getElementById('resultScreen').style.display = 'none';
      document.getElementById('riddleCard').style.display   = '';
      document.getElementById('answersList').style.display  = '';

      const q = selectedQ[currentQ];

      // Indices
      const list = document.getElementById('cluesList');
      list.innerHTML = '';
      q.clues.forEach(clue => {
        const li = document.createElement('li');
        li.className = 'clue-item';
        li.innerHTML = '<div class="clue-dot"></div><span class="clue-text">' + clue + '</span>';
        list.appendChild(li);
      });

      // Options mélangées
      const options = shuffle([q.answer, ...q.wrong]);
      correctIdx = options.findIndex(o => o.label === q.answer.label);

      // Progression
      document.getElementById('progressBar').style.width  = (currentQ / TOTAL_Q * 100) + '%';
      document.getElementById('progressText').textContent = 'Énigme ' + (currentQ + 1) + ' / ' + TOTAL_Q;

      // Boutons réponses
      const list2 = document.getElementById('answersList');
      list2.innerHTML = '';
      options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'answer-btn';
        btn.innerHTML =
          '<span class="ans-emoji">' + opt.emoji + '</span>' +
          '<span class="ans-label">' + opt.label + '</span>';
        btn.onclick = () => checkAnswer(idx);
        list2.appendChild(btn);
      });

      // Auto-lecture
      setTimeout(() => speak(q.clues.join('. ') + '. Qui suis-je ?'), 500);
    }

    function checkAnswer(idx) {
      if (answered) return;
      answered = true;

      const q    = selectedQ[currentQ];
      const btns = document.querySelectorAll('.answer-btn');
      btns.forEach(b => b.disabled = true);

      const isCorrect = (idx === correctIdx);

      if (isCorrect) {
        btns[idx].classList.add('correct');
        score++;
        playSound(true);
        launchConfetti();
        document.getElementById('feedbackZone').innerHTML =
          '<div class="feedback-msg correct">✨ Bravo ! C\'est bien le ' + q.answer.label + ' ' + q.answer.emoji + ' !</div>';
        speak('Bravo ! C\'est bien le ' + q.answer.label + ' !');
      } else {
        btns[idx].classList.add('wrong');
        btns[correctIdx].classList.add('correct');
        btns.forEach((b, i) => {
          if (i !== idx && i !== correctIdx) b.classList.add('dimmed');
        });
        playSound(false);
        document.getElementById('feedbackZone').innerHTML =
          '<div class="feedback-msg wrong">💪 C\'est le ' + q.answer.label + ' ' + q.answer.emoji + ' !</div>';
        speak('C\'est le ' + q.answer.label + ' !');
      }

      const btnNext = document.getElementById('btnNext');
      btnNext.style.display   = 'block';
      btnNext.style.animation = 'none';
      void btnNext.offsetWidth;
      btnNext.style.animation = '';
    }

    function nextQuestion() {
      document.getElementById('btnNext').style.display = 'none';
      currentQ++;
      if (currentQ < TOTAL_Q) showQuestion();
      else showResult();
    }

    // ── Résultat ──────────────────────────────────────────────────────────────
    function getStars(s) {
      if (s >= 4) return 2;
      if (s >= 2) return 1;
      return 0;
    }

    function showResult() {
      document.getElementById('riddleCard').style.display  = 'none';
      document.getElementById('answersList').style.display = 'none';
      document.getElementById('feedbackZone').innerHTML    = '';
      document.getElementById('btnNext').style.display     = 'none';
      document.getElementById('progressBar').style.width   = '100%';

      const earned = getStars(score);
      document.getElementById('resultScreen').style.display = 'block';

      const titles = ['Continue !', 'Pas mal !', 'Bien joué !', 'Parfait ! 🎉'];
      document.getElementById('resultTitle').textContent = '🔮 ' + titles[earned];
      document.getElementById('starsEarned').textContent = earned > 0 ? '⭐'.repeat(earned) : '😊';
      document.getElementById('scoreDetail').textContent = score + ' / ' + TOTAL_Q + ' bonnes réponses';

      if (earned > 0) {
        launchConfetti();
        speak(titles[earned] + ' Tu as gagné ' + earned + (earned > 1 ? ' étoiles !' : ' étoile !'));
      } else {
        speak('Continue à t\'entraîner, tu vas y arriver !');
      }

      submitStars(earned);
    }

    async function submitStars(earned) {
      if (earned === 0) {
        document.getElementById('submitMsg').textContent = 'Rejoue pour gagner des étoiles !';
        return;
      }
      try {
        document.getElementById('submitMsg').textContent = '⏳ Envoi en cours...';
        const snap = await db.ref(DB_PATH + '/pendingGameStars').get();
        const val  = snap.val();
        const arr  = val ? (Array.isArray(val) ? val : Object.values(val)).filter(Boolean) : [];
        arr.push({
          id: Date.now().toString(),
          game: 'Les Grandes Énigmes',
          stars: earned,
          playedAt: new Date().toLocaleDateString('fr-FR', {
            day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
          })
        });
        await db.ref(DB_PATH + '/pendingGameStars').set(arr);
        document.getElementById('submitMsg').textContent =
          '✅ ' + earned + (earned > 1 ? ' étoiles' : ' étoile') + ' en attente de validation !';
      } catch(e) {
        document.getElementById('submitMsg').textContent = '❌ Erreur d\'envoi. Dis-le à Papa !';
      }
    }

    function goBack() {
      window.location.href = 'jeux.html?played=jeu-19' + (isTest ? '&test' : '');
    }

    startGame();
  </script>
</body>
</html>
