        // ── Composant Timer isolé (ne re-rend que lui-même chaque seconde) ──
        function TimerButton({ voiceEnabled }) {
          const [seconds, setSeconds] = React.useState(null); // null = arrêté

          React.useEffect(() => {
            if (seconds === null) return;
            if (seconds <= 0) {
              // Fin du minuteur : son + voix
              try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain); gain.connect(ctx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(880, ctx.currentTime);
                gain.gain.setValueAtTime(0.5, ctx.currentTime);
                osc.start(); osc.stop(ctx.currentTime + 0.3);
              } catch(e) {}
              if (voiceEnabled) {
                setTimeout(() => {
                  const msg = new SpeechSynthesisUtterance('Bravo ma princesse, tu as fini de brosser tes dents !');
                  msg.lang = 'fr-FR'; msg.rate = 0.88; msg.pitch = 1.1;
                  window.speechSynthesis.speak(msg);
                }, 400);
              }
              setSeconds(null);
              return;
            }
            const t = setTimeout(() => setSeconds(s => s - 1), 1000);
            return () => clearTimeout(t);
          }, [seconds, voiceEnabled]);

          const toggle = (e) => {
            e.stopPropagation();
            if (seconds !== null) {
              setSeconds(null);
            } else {
              setSeconds(120);
              if (voiceEnabled) {
                const msg = new SpeechSynthesisUtterance("C'est parti pour 2 minutes de brossage !");
                msg.lang = 'fr-FR'; msg.rate = 0.88; msg.pitch = 1.1;
                window.speechSynthesis.speak(msg);
              }
            }
          };

          const fmt = (s) => `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;

          return (
            <button className="btn-timer" onClick={toggle}
              style={{ background: seconds !== null ? '#ef5350' : '#ba68c8' }}>
              {seconds !== null ? `🛑 Arrêter (${fmt(seconds)})` : '⏱️ Lancer 2 min'}
            </button>
          );
        }

        // ── Hachage SHA-256 du PIN (Web Crypto API, sans librairie) ──
        async function hashPin(pin) {
          const data = new TextEncoder().encode(pin + ':caly-pin-salt');
          const buf  = await crypto.subtle.digest('SHA-256', data);
          return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
        }
        // Un hash SHA-256 fait 64 caractères — un PIN brut fait ≤ 10 car.
        function isPinPlaintext(val) { return !val || val.length <= 10; }

        function App() {
          const [loading, setLoading] = React.useState(true);
          const [tasks, setTasks] = React.useState(defaultTasks);
          const [stars, setStars] = React.useState(0);
          const [level, setLevel] = React.useState(1);
          const [parentPassword, setParentPassword] = React.useState('1234');
          const [historyLog, setHistoryLog] = React.useState([]);
          const [rewardLog, setRewardLog] = React.useState([]);
          const [pendingRewards, setPendingRewards] = React.useState([]);
          const [pendingGameStars, setPendingGameStars] = React.useState([]);
          const [grantedReward, setGrantedReward] = React.useState(null);
          const [voiceEnabled, setVoiceEnabled] = React.useState(true);
          const [darkMode, setDarkMode] = React.useState(false);
          const [childMode, setChildMode] = React.useState(false);
          const isRemoteRef = React.useRef(false);
          const [currentCategory, setCurrentCategory] = React.useState('all');
          const [showCelebration, setShowCelebration] = React.useState(false);
          const [celebrationActive, setCelebrationActive] = React.useState(false);
          const [histTab, setHistTab] = React.useState('all');
          const [celebrationStars, setCelebrationStars] = React.useState([]);
          const [vacationMode, setVacationMode] = React.useState(false);
          const [weeklyGames, setWeeklyGames] = React.useState(null);

          // Écoute Firebase en temps réel (sync entre les deux téléphones)
          React.useEffect(() => {
            const ref = db.ref(DB_PATH);
            ref.on('value', (snapshot) => {
              const data = snapshot.val();
              isRemoteRef.current = true;
              if (data) {
                setStars(data.stars ?? 0);
                setLevel(data.level ?? 1);
                // Migration : si le PIN est encore en clair → le hacher et sauver
                const rawPin = data.parentPassword ?? '1234';
                if (isPinPlaintext(rawPin)) {
                  hashPin(rawPin).then(hashed => {
                    db.ref(DB_PATH + '/parentPassword').set(hashed);
                    setParentPassword(hashed);
                  });
                } else {
                  setParentPassword(rawPin);
                }
                setHistoryLog(data.historyLog ?? []);
                setRewardLog(data.rewardLog ?? []);
                setPendingRewards(data.pendingRewards ?? []);
                const rawGS = data.pendingGameStars;
                const gsArr = rawGS ? (Array.isArray(rawGS) ? rawGS : Object.values(rawGS)).filter(Boolean) : [];
                setPendingGameStars(gsArr);
                setGrantedReward(data.grantedReward ?? null);
                setVoiceEnabled(data.voiceEnabled ?? true);
                setDarkMode(data.darkMode ?? false);
                const rawTasks = data.tasks;
                const savedTasks = rawTasks
                  ? (Array.isArray(rawTasks) ? rawTasks : Object.values(rawTasks)).filter(Boolean)
                  : [];
                setTasks(defaultTasks.map(dt => {
                  const saved = savedTasks.find(t => t && t.id === dt.id);
                  return saved ? { ...dt, done: saved.done, pending: saved.pending } : dt;
                }));
              } else {
                // Première ouverture : migration depuis localStorage ou valeurs par défaut
                const localTasks = localStorage.getItem('caly_tasks');
                const migratedTasks = localTasks ? JSON.parse(localTasks) : [];
                isRemoteRef.current = false;
                setStars(parseInt(localStorage.getItem('caly_stars') || '0', 10));
                setLevel(parseInt(localStorage.getItem('caly_level') || '1', 10));
                const localPin = localStorage.getItem('caly_parent_pin') || '1234';
                if (isPinPlaintext(localPin)) {
                  hashPin(localPin).then(h => setParentPassword(h));
                } else {
                  setParentPassword(localPin);
                }
                setHistoryLog(JSON.parse(localStorage.getItem('caly_history_log') || '[]'));
                setRewardLog(JSON.parse(localStorage.getItem('caly_reward_log') || '[]'));
                setTasks(defaultTasks.map(dt => {
                  const saved = migratedTasks.find(t => t && t.id === dt.id);
                  return saved ? { ...dt, done: saved.done, pending: saved.pending } : dt;
                }));
              }
              setLoading(false);
            });
            return () => ref.off();
          }, []);

          // Listeners séparés : vacationMode + weeklyGames (lecture seule côté index)
          React.useEffect(() => {
            const refVac = db.ref(DB_PATH + '/vacationMode');
            const refWG  = db.ref(DB_PATH + '/weeklyGames');
            refVac.on('value', snap => setVacationMode(snap.val() === true));
            refWG.on('value',  snap => setWeeklyGames(snap.val() || null));
            return () => { refVac.off(); refWG.off(); };
          }, []);

          // Sauvegarde vers Firebase quand les données changent (sauf màj distante)
          React.useEffect(() => {
            if (isRemoteRef.current) { isRemoteRef.current = false; return; }
            if (loading) return;
            db.ref(DB_PATH).update({
              tasks: tasks.map(t => ({ id: t.id, done: t.done, pending: t.pending })),
              stars,
              level,
              parentPassword,
              historyLog,
              rewardLog,
              pendingRewards,
              pendingGameStars,
              grantedReward,
              voiceEnabled,
              darkMode,
            });
          }, [tasks, stars, level, parentPassword, historyLog, rewardLog, pendingRewards, pendingGameStars, grantedReward, voiceEnabled, darkMode, loading]);

          // Dark mode : classe CSS sur <body> uniquement en mode parent
          React.useEffect(() => {
            document.body.classList.toggle('dark-mode', childMode && darkMode);
          }, [darkMode, childMode]);

          const checkDailyReset = React.useCallback(() => {
            const now = new Date();
            // Date locale explicite : getDate/getMonth/getFullYear utilisent l'heure du téléphone, pas UTC
            const todayStr = now.getFullYear() + '-' +
              String(now.getMonth() + 1).padStart(2, '0') + '-' +
              String(now.getDate()).padStart(2, '0');
            db.ref(DB_PATH + '/lastResetDate').get().then(snap => {
              const lastSavedDate = snap.val();
              if (lastSavedDate !== todayStr) {
                if (lastSavedDate) {
                  // Nouveau jour détecté → lire les tâches actuelles dans Firebase
                  // puis écrire le reset + la nouvelle date en UNE SEULE opération atomique.
                  // (Évite la boucle : écrire lastResetDate seul déclenchait onValue
                  //  qui ré-écrasait le reset avec les anciennes tâches.)
                  const isMonday = now.getDay() === 1;
                  db.ref(DB_PATH + '/tasks').get().then(tasksSnap => {
                    const rawTasks = tasksSnap.val();
                    const savedTasks = rawTasks
                      ? (Array.isArray(rawTasks) ? rawTasks : Object.values(rawTasks)).filter(Boolean)
                      : [];
                    const resetTasksForDB = defaultTasks.map(dt => {
                      const saved = savedTasks.find(t => t && t.id === dt.id);
                      // Les pending non validés sont effacés au reset du matin
                      if (dt.category === 'nettoyage') {
                        return { id: dt.id, done: isMonday ? false : (saved ? saved.done : false), pending: false };
                      }
                      return { id: dt.id, done: false, pending: false };
                    });
                    // Écriture atomique : tâches réinitialisées + nouvelle date.
                    // Le listener onValue se déclenchera et mettra à jour React state
                    // avec les tâches déjà réinitialisées (plus de race condition).
                    db.ref(DB_PATH).update({
                      tasks: resetTasksForDB,
                      lastResetDate: todayStr,
                    });
                  });
                } else {
                  // Première ouverture : juste enregistrer la date, pas de reset
                  db.ref(DB_PATH + '/lastResetDate').set(todayStr);
                }
              }
            });
          }, []);

          React.useEffect(() => {
            if (!loading) {
              checkDailyReset();
              const interval = setInterval(checkDailyReset, 60000);
              return () => clearInterval(interval);
            }
          }, [checkDailyReset, loading]);

          const addToHistory = (entry) => {
            setHistoryLog(prev => [entry, ...prev].slice(0, 100));
          };


          const speak = (text) => {
            if (!voiceEnabled) return;
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'fr-FR';
            window.speechSynthesis.speak(msg);
          };

          const toggleModeSecure = async () => {
            if (!childMode) {
              const input = window.prompt("Entrez le code secret de Maman :");
              if (input === null) return;
              if (!/^\d+$/.test(input)) { alert("Le code doit contenir uniquement des chiffres !"); return; }
              const inputHash = await hashPin(input);
              if (inputHash === parentPassword) setChildMode(true);
              else alert("Code incorrect ! 🤫");
            } else {
              setChildMode(false);
            }
          };

          const changePin = async () => {
            const current = window.prompt("Code actuel :");
            if (current === null) return;
            const currentHash = await hashPin(current);
            if (currentHash !== parentPassword) { alert("Code actuel incorrect !"); return; }
            const newPin = window.prompt("Nouveau code (chiffres uniquement) :");
            if (newPin === null) return;
            if (!/^\d{4,8}$/.test(newPin)) { alert("Le code doit contenir entre 4 et 8 chiffres !"); return; }
            const confirm = window.prompt("Confirmer le nouveau code :");
            if (confirm !== newPin) { alert("Les codes ne correspondent pas !"); return; }
            const newHash = await hashPin(newPin);
            setParentPassword(newHash);
            await db.ref(DB_PATH + '/parentPassword').set(newHash);
            alert("✅ Code PIN modifié avec succès !");
          };

          const requestTaskValidation = (id) => {
            setTasks(tasks.map(t => t.id === id ? { ...t, pending: true } : t));
            speak('Demande envoyée à maman !');
          };

          const acceptTask = (id, points) => {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            setTasks(tasks.map(t => t.id === id ? { ...t, done: true, pending: false } : t));
            const newStars = stars + points;
            setStars(newStars);

            const now = new Date();
            addToHistory({ type:'task', icon:task.icon, name:task.name, points:points, date:String(now.getDate()).padStart(2,'0')+'/'+String(now.getMonth()+1).padStart(2,'0'), time:String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0'), ts:now.getTime() });
            speak('Bravo ma princesse !');

            const targetLevel = Math.floor(newStars / 60) + 1;
            if (targetLevel > level) { setLevel(targetLevel); setShowCelebration(true); }
          };

          const rejectTask = (id) => {
            setTasks(tasks.map(t => t.id === id ? { ...t, done: false, pending: false } : t));
            speak('Mission à refaire.');
          };

          const toggleVacationMode = async () => {
            await db.ref(DB_PATH + '/vacationMode').set(!vacationMode);
          };

          const toggleGameUnlock = async (gameId) => {
            const wg = weeklyGames || {};
            const toArr = v => v ? (Array.isArray(v) ? v : Object.values(v)).filter(Boolean) : [];
            const unlocked = toArr(wg.parentUnlocked);
            const isUnlocked = unlocked.includes(gameId);
            const newUnlocked = isUnlocked
              ? unlocked.filter(g => g !== gameId)
              : [...unlocked, gameId];
            await db.ref(DB_PATH + '/weeklyGames/parentUnlocked').set(newUnlocked);
          };

          const handleBonus = () => {
            const newStars = stars + 15;
            setStars(newStars);
            { const _n=new Date(); addToHistory({ type:'bonus', icon:'✨', name:'Bonus parental +15', points:15, date:String(_n.getDate()).padStart(2,'0')+'/'+String(_n.getMonth()+1).padStart(2,'0'), time:String(_n.getHours()).padStart(2,'0')+':'+String(_n.getMinutes()).padStart(2,'0'), ts:_n.getTime() }); }
            speak('Super bonus pour ma princesse !');
            const targetLevel = Math.floor(newStars / 60) + 1;
            if (targetLevel > level) { setLevel(targetLevel); setShowCelebration(true); }
          };

          const handlePenalty = () => {
            const newStars = Math.max(0, stars - 5);
            setStars(newStars);
            { const _n=new Date(); addToHistory({ type:'malus', icon:'⚠️', name:'Retrait bêtise', points:-5, date:String(_n.getDate()).padStart(2,'0')+'/'+String(_n.getMonth()+1).padStart(2,'0'), time:String(_n.getHours()).padStart(2,'0')+':'+String(_n.getMinutes()).padStart(2,'0'), ts:_n.getTime() }); }
            speak('Attention aux bêtises !');
          };

          const requestReward = (reward) => {
            if (stars < reward.cost) return;
            setPendingRewards(prev => [...prev, { id: reward.id, name: reward.name, cost: reward.cost }]);
            speak("Demande envoyée ! Tu auras " + (stars - reward.cost) + " étoiles si c'est accordé.");
          };

          const acceptReward = (reward) => {
            setPendingRewards(prev => prev.filter(r => r.id !== reward.id));
            setStars(prev => Math.max(0, prev - reward.cost));
            setRewardLog(prev => [`🛍️ ${new Date().toLocaleDateString('fr-FR')} — ${reward.name} (-${reward.cost} ⭐)`, ...prev]);
            setGrantedReward(reward.name);
            speak("Récompense accordée !");
          };

          React.useEffect(() => {
            if (grantedReward && !childMode) {
              setTimeout(() => speak("Super nouvelle ! Ta récompense " + grantedReward + " a été accordée !"), 400);
            }
          }, [grantedReward]);

          const rejectReward = (rewardId) => {
            setPendingRewards(prev => prev.filter(r => r.id !== rewardId));
            speak("Demande refusée.");
          };

          const resetWeek = () => {
            if (window.confirm("Recommencer la semaine ?")) {
              setTasks(defaultTasks.map(t => ({ ...t, done: false, pending: false })));
              setHistoryLog([]);
              // rewardLog intentionnellement conservé
            }
          };

          const recalcLevel = () => {
            setLevel(Math.floor(stars / 60) + 1);
          };

          const acceptGameReward = (item) => {
            setPendingGameStars(prev => prev.filter(g => g.id !== item.id));
            const newStars = stars + item.stars;
            setStars(newStars);
            { const _n=new Date(); addToHistory({ type:'game', icon:'🎮', name:item.game, points:item.stars, date:String(_n.getDate()).padStart(2,'0')+'/'+String(_n.getMonth()+1).padStart(2,'0'), time:String(_n.getHours()).padStart(2,'0')+':'+String(_n.getMinutes()).padStart(2,'0'), ts:_n.getTime() }); }
            speak("Bravo pour ton jeu !");
            const targetLevel = Math.floor(newStars / 60) + 1;
            if (targetLevel > level) { setLevel(targetLevel); setShowCelebration(true); }
          };

          const rejectGameReward = (id) => {
            setPendingGameStars(prev => prev.filter(g => g.id !== id));
          };

          const handleCelebration = () => {
            const particles = Array.from({ length: 35 }, (_, i) => ({
              id: i,
              left: Math.floor(Math.random() * 100),
              size: 16 + Math.floor(Math.random() * 22),
              duration: (1.8 + Math.random() * 2.5).toFixed(1),
              delay: (Math.random() * 1).toFixed(2),
              emoji: ['⭐','🌟','✨','💫','🦄','🌊','🌸','💖'][Math.floor(Math.random() * 8)],
            }));
            setCelebrationStars(particles);
            setShowCelebration(false);
            setCelebrationActive(true);
            if (!voiceEnabled) {
              setTimeout(() => setCelebrationActive(false), 4000);
            } else {
              window.speechSynthesis.cancel();
              const msg = new SpeechSynthesisUtterance(
                "Bravo ! Tu passes au niveau " + level + ", tu es maintenant une " + currentLevelData.title + " ! Tu peux être fière de toi !"
              );
              msg.lang = 'fr-FR';
              msg.onend = () => setCelebrationActive(false);
              window.speechSynthesis.speak(msg);
            }
          };

          const currentLevelData = getLevelData(level);
          const filteredTasks = tasks.filter(t => currentCategory === 'all' || t.category === currentCategory);

          // Palette inline pour le mode parent selon dark/light
          const ps = {
            h1:          darkMode ? '#d8b4fe' : '#4a148c',
            h3:          darkMode ? '#e0e0e0' : '#333',
            text:        darkMode ? '#e0e0e0' : '#333',
            textSec:     darkMode ? '#aaa'    : '#666',
            textMuted:   darkMode ? '#888'    : '#555',
            textEmpty:   darkMode ? '#888'    : '#888',
            divider:     darkMode ? '#2a2a4a' : '#eee',
            inlineBg:    darkMode ? '#252535' : '#fafafa',
            inlineBorder:darkMode ? '1px solid #2a2a4a' : '1px solid #eee',
            histPurple:  darkMode ? '#c084fc' : '#7b1fa2',
          };

          if (loading) {
            return (
              <div style={{ display: 'flex', justifyContent: 'center', alignItems: 'center', minHeight: '100vh', flexDirection: 'column', gap: '20px' }}>
                <div style={{ fontSize: '60px', animation: 'floatSirene 1.5s ease-in-out infinite' }}>✨</div>
                <div style={{ fontSize: '22px', color: '#d81b60', fontWeight: 'bold', fontFamily: 'Georgia, serif' }}>Chargement du monde de Caly...</div>
              </div>
            );
          }

          return (
            <div style={{ maxWidth: '600px', margin: '0 auto' }}>
              {DB_PATH === 'calyApp-test' && (
                <div style={{ background: '#ff9800', color: '#fff', padding: '10px 16px', borderRadius: '12px', textAlign: 'center', marginBottom: '15px', fontWeight: 'bold', fontSize: '15px' }}>
                  🧪 VERSION TEST — les données de Caly ne sont pas affectées
                </div>
              )}
              {grantedReward && !childMode && (
                <div style={{ position: 'fixed', top: 0, left: 0, right: 0, bottom: 0, background: 'linear-gradient(135deg, #ff69b4 0%, #da70d6 60%, #ffd700 100%)', zIndex: 10000, display: 'flex', flexDirection: 'column', justifyContent: 'center', alignItems: 'center', gap: '20px', padding: '30px', textAlign: 'center' }}>
                  <div style={{ fontSize: '90px', animation: 'floatSirene 1.5s ease-in-out infinite' }}>🎁</div>
                  <div style={{ fontSize: '30px', fontWeight: '900', color: '#fff', fontFamily: 'Georgia, serif', textShadow: '0 2px 10px rgba(0,0,0,0.2)' }}>
                    Récompense accordée !
                  </div>
                  <div style={{ fontSize: '20px', color: '#fff', fontWeight: 'bold', background: 'rgba(255,255,255,0.25)', padding: '15px 25px', borderRadius: '20px', maxWidth: '300px' }}>
                    {grantedReward}
                  </div>
                  <div style={{ fontSize: '36px', animation: 'floatSirene 2s ease-in-out infinite' }}>⭐🌟✨💖⭐</div>
                  <button
                    onClick={() => setGrantedReward(null)}
                    style={{ marginTop: '10px', padding: '16px 45px', borderRadius: '50px', border: 'none', background: '#fff', color: '#e91e63', fontSize: '22px', fontWeight: '900', cursor: 'pointer', boxShadow: '0 6px 20px rgba(0,0,0,0.2)' }}
                  >
                    Yesss ! 🎉
                  </button>
                </div>
              )}
              {celebrationActive && (
                <div className="celebration-overlay">
                  {celebrationStars.map(s => (
                    <div key={s.id} className="falling-star" style={{
                      left: `${s.left}%`,
                      fontSize: `${s.size}px`,
                      animationDuration: `${s.duration}s`,
                      animationDelay: `${s.delay}s`,
                    }}>{s.emoji}</div>
                  ))}
                </div>
              )}
              <div style={{ display: 'flex', justifyContent: 'center', gap: '10px', marginBottom: '25px', flexWrap: 'wrap' }}>
                <button onClick={toggleModeSecure} className="btn-mode">
                  {childMode ? '👑 Retour au Monde de Caly' : '🔒 Configuration Parentale'}
                </button>
                {childMode && (DB_PATH === 'calyApp-test' ? (
                  <button onClick={() => window.location.href = window.location.pathname} className="btn-mode" style={{ background: '#e8f5e9', borderColor: '#4caf50', color: '#2e7d32' }}>✅ Vraie version</button>
                ) : (
                  <button onClick={() => window.location.href = window.location.pathname + '?test'} className="btn-mode" style={{ background: '#fff3e0', borderColor: '#ff9800', color: '#e65100' }}>🧪 App test</button>
                ))}
              </div>

              {childMode ? (
                /* ================= CONFIGURATION PARENT ================= */
                <div>
                  <h1 style={{ color: ps.h1, textAlign: 'center' }}>Espace Maman ⚙️</h1>
                  <div className="card" style={{ textAlign: 'center' }}>
                    <p style={{ color: ps.text, fontSize: '18px', margin: '0' }}>Score actuel de Caly :</p>
                    <div style={{ fontSize: '45px', fontWeight: 'bold', color: '#e91e63', margin: '5px 0' }}>⭐ {stars}</div>
                    <p style={{ color: ps.textSec, margin: '0' }}>Niveau : {level}</p>
                    {Math.floor(stars / 60) + 1 !== level && (
                      <button onClick={recalcLevel} style={{ marginTop: '10px', padding: '7px 16px', background: '#ff9800', color: '#fff', border: 'none', borderRadius: '8px', cursor: 'pointer', fontWeight: 'bold', fontSize: '13px' }}>
                        🔧 Corriger le niveau (devrait être {Math.floor(stars / 60) + 1})
                      </button>
                    )}
                  </div>

                  <div style={{ display: 'flex', gap: '10px', marginBottom: '15px' }}>
                    <button onClick={() => { const n = stars + 5; setStars(n); { const _n=new Date(); addToHistory({ type:'bonus', icon:'✨', name:'Bonus parental +5', points:5, date:String(_n.getDate()).padStart(2,'0')+'/'+String(_n.getMonth()+1).padStart(2,'0'), time:String(_n.getHours()).padStart(2,'0')+':'+String(_n.getMinutes()).padStart(2,'0'), ts:_n.getTime() }); } speak('Petit bonus pour ma princesse !'); const t = Math.floor(n/60)+1; if(t>level){setLevel(t);setShowCelebration(true);} }} className="btn-parent" style={{ background: '#ce93d8' }}>✨ Petit Bonus (+5 ⭐)</button>
                    <button onClick={handleBonus} className="btn-parent" style={{ background: '#ba68c8' }}>✨ Grand Bonus (+15 ⭐)</button>
                    <button onClick={handlePenalty} className="btn-parent" style={{ background: '#ef5350' }}>⚠️ Bêtise (-5 ⭐)</button>
                  </div>
                  <div style={{ display: 'flex', gap: '10px', marginBottom: '15px' }}>
                    <button onClick={() => setVoiceEnabled(v => !v)} className="btn-parent" style={{ background: voiceEnabled ? '#4caf50' : '#9e9e9e' }}>
                      {voiceEnabled ? '🔊 Vocal activé' : '🔇 Vocal désactivé'}
                    </button>
                    <button onClick={() => setDarkMode(d => !d)} className="btn-parent" style={{ background: darkMode ? '#3730a3' : '#64748b' }}>
                      {darkMode ? '🌙 Mode sombre' : '☀️ Mode clair'}
                    </button>
                  </div>
                  <div style={{ display: 'flex', gap: '10px', marginBottom: '25px' }}>
                    <button onClick={changePin} className="btn-parent" style={{ background: '#546e7a' }}>🔑 Changer le code PIN</button>
                  </div>

                  {/* ── Gestion des Jeux ── */}
                  {(() => {
                    const GAME_META = {
                      'jeu-1':  {n:"L'horloge enchantée",    i:'⏰'},
                      'jeu-2':  {n:"Compte les étoiles",     i:'🌠'},
                      'jeu-3':  {n:"Le marché enchanté",     i:'🛒'},
                      'jeu-4':  {n:"Nourris le dragon",      i:'🐉'},
                      'jeu-5':  {n:"La course des nombres",  i:'🏇'},
                      'jeu-6':  {n:"Bonne nuit les chiffres",i:'🌙'},
                      'jeu-7':  {n:"La suite magique",       i:'🪄'},
                      'jeu-8':  {n:"La carte au trésor",     i:'🗺️'},
                      'jeu-9':  {n:"L'intrus enchanté",      i:'🔮'},
                      'jeu-10': {n:"Le cirque des contraires",i:'🤡'},
                      'jeu-11': {n:"Mémo des fées",          i:'🧚'},
                      'jeu-12': {n:"Qu'est-ce qui a changé ?",i:'🔍'},

                                onClick={(e) => { e.stopPropagation(); if (canAfford && !isPending) requestReward(r); }}
                                disabled={!canAfford || isPending}
                                style={{ padding: '8px 12px', background: isPending ? '#ffa726' : canAfford ? 'linear-gradient(135deg, #ffd700, #ffa500)' : '#e0e0e0', color: isPending || !canAfford ? '#fff' : '#5d4037', border: 'none', borderRadius: '10px', cursor: canAfford && !isPending ? 'pointer' : 'default', fontWeight: 'bold', fontSize: '13px', whiteSpace: 'nowrap' }}>
                                {isPending ? '⏳ En attente' : canAfford ? 'Demander 🛍️' : 'Pas assez 🔒'}
                              </button>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  ) : (
                    filteredTasks.map(task => (
                      <div key={task.id} className="task-card">
                        <div style={{ textAlign: 'left', color: '#333', flexGrow: 1, cursor: 'pointer' }} onClick={() => speak(task.name)}>
                          <h3 style={{ margin: '0', fontSize: '17px', color: '#3f0c1f', display: 'flex', alignItems: 'center', gap: '10px', fontWeight: '700' }}>
                            <span style={{ fontSize: '22px' }}>{task.icon}</span>
                            <span>{task.name}</span>
                            {voiceEnabled && <span style={{ fontSize: '14px', color: '#ff69b4' }}>🔊</span>}
                          </h3>
                          <p style={{ margin: '4px 0 0 0', color: '#e91e63', fontSize: '13px', fontWeight: 'bold' }}>+{task.points} {task.points > 1 ? 'étoiles' : 'étoile'}</p>
                          {task.hasTimer && !task.done && !task.pending && (
                            <div>
                              <TimerButton voiceEnabled={voiceEnabled} />
                            </div>
                          )}
                        </div>
                        <button
                          onClick={() => requestTaskValidation(task.id)}
                          disabled={task.done || task.pending}
                          className="btn-valider"
                          style={{
                            background: task.done ? '#4caf50' : task.pending ? '#ffa726' : 'linear-gradient(135deg, #ff4081 0%, #e91e63 100%)',
                            cursor: (task.done || task.pending) ? 'default' : 'pointer'
                          }}
                        >
                          {task.done ? '✓ Fait' : task.pending ? 'Vérification ⏳' : 'Valider 🎉'}
                        </button>
                      </div>
                    ))
                  )}
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
