        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            margin: 0; 
            padding: 20px; 
            background: linear-gradient(135deg, #fad0c4 0%, #ffd1ff 100%); 
            min-height: 100vh; 
        }
        
        .btn-mode { 
            padding: 10px 22px; 
            font-size: 14px; 
            border-radius: 25px; 
            border: none; 
            background: rgba(255, 255, 255, 0.7); 
            backdrop-filter: blur(5px);
            cursor: pointer; 
            font-weight: bold;
            color: #6c5ce7;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
        }
        .btn-mode:hover {
            transform: translateY(-2px);
            background: #ffffff;
        }

        .royal-header {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(15px);
            border-radius: 32px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(255, 154, 158, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.6); 
            margin-bottom: 30px;
            position: relative;
        }

        .royal-cat-container {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .royal-cat-badge {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle at 30% 30%, #ffffff 0%, #fbc2eb 50%, #a6c1ee 100%);
            border: 6px solid #ffffff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 65px;
            box-shadow: 0 15px 35px rgba(166, 193, 238, 0.6), inset 0 -10px 20px rgba(0,0,0,0.05);
            animation: floatSirene 4s ease-in-out infinite;
            position: relative;
        }

        .badge-heart-decor {
            position: absolute;
            bottom: -12px;
            width: 32px;
            height: 32px;
            background: #a29bfe;
            transform: rotate(45deg);
            box-shadow: 0 4px 10px rgba(162, 155, 254, 0.5);
            border: 2px solid #ffffff;
            border-radius: 4px 4px 0 4px;
        }
        .badge-heart-decor::before, .badge-heart-decor::after {
            content: '';
            position: absolute;
            width: 32px;
            height: 32px;
            background: #a29bfe;
            border-radius: 50%;
        }
        .badge-heart-decor::before { top: -16px; left: 0; }
        .badge-heart-decor::after { left: -16px; top: 0; }

        @keyframes floatSirene {
            0% { transform: translateY(0px) scale(1); }
            50% { transform: translateY(-10px) scale(1.02); }
            100% { transform: translateY(0px) scale(1); }
        }

        .princess-title {
            font-size: 42px;
            font-weight: 900;
            margin: 10px 0 5px 0;
            color: #2d3436;
            font-family: 'Segoe UI', sans-serif;
            letter-spacing: -0.5px;
        }

        .star-medallion {
            background: linear-gradient(90deg, #ff7675 0%, #6c5ce7 100%);
            color: white;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 40px;
            border-radius: 40px;
            font-size: 24px;
            font-weight: bold;
            box-shadow: 0 8px 25px rgba(108, 92, 231, 0.3);
            margin-top: 15px;
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        .category-scroll {
            display: flex;
            gap: 20px;
            overflow-x: auto;
            padding: 15px 5px;
            margin-bottom: 25px;
            justify-content: center;
        }
        .category-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn-category-round {
            width: 64px;
            height: 64px;
            border-radius: 50%;
            border: 4px solid #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 6px 18px rgba(0,0,0,0.06);
            transition: all 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .category-item:hover .btn-category-round, .category-item.active .btn-category-round {
            transform: scale(1.15) translateY(-4px);
            box-shadow: 0 10px 25px rgba(108, 92, 231, 0.2);
        }
        .category-label {
            font-size: 13px;
            font-weight: 700;
            color: #636e72;
        }
        .category-item.active .category-label {
            color: #2d3436;
            font-weight: 800;
        }

        .task-card { 
            background: #ffffff; 
            border-radius: 28px; 
            padding: 22px 28px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 16px;

        }
        .task-card:hover {

            font-weight: bold;

            box-shadow: 0 5px 15px rgba(0,0,0,0.05);

        }
        .btn-valider:hover:not(:disabled) {

        .btn-timer {

        .card { background: #fff; border-radius: 28px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); margin-bottom: 25px; }

</head>

        function App() {
          const [tasks, setTasks] = React.useState(() => {
            const saved = localStorage.getItem('caly_tasks');
            if (saved) {
              const parsed = JSON.parse(saved);
              return defaultTasks.map(dt => {
                const existing = parsed.find(pt => pt.id === dt.id);
                return existing ? { ...dt, done: existing.done, pending: existing.pending } : dt;
              });
            }
            return defaultTasks;
          });
          const [stars, setStars] = React.useState(() => {
            const saved = localStorage.getItem('caly_stars');
            return saved ? parseInt(saved, 10) : 0;
          });
          const [level, setLevel] = React.useState(() => {
            const saved = localStorage.getItem('caly_level');
            return saved ? parseInt(saved, 10) : 1;
          });
          const [parentPassword, setParentPassword] = React.useState(() => {
            const saved = localStorage.getItem('caly_parent_pin');
            return saved ? saved : '1234';
          });
          const [historyLog, setHistoryLog] = React.useState(() => {
            const saved = localStorage.getItem('caly_history_log');
            return saved ? JSON.parse(saved) : [];
          });
          const [childMode, setChildMode] = React.useState(false); 
          const [currentCategory, setCurrentCategory] = React.useState('all');
          const [activeTimers, setActiveTimers] = React.useState({});

          React.useEffect(() => {
            const now = new Date();
            const todayStr = now.toDateString();
            const lastSavedDate = localStorage.getItem('caly_last_date');
            const currentDay = now.getDay(); 

            if (lastSavedDate && lastSavedDate !== todayStr) {
              setTasks(prev => prev.map(t => {
                if (t.category !== 'nettoyage') {
                  return { ...t, done: false, pending: false };
                }
                if (currentDay === 1) {
                  return { ...t, done: false, pending: false };
                }
                return t;
              }));
            }
            localStorage.setItem('caly_last_date', todayStr);
          }, []);

          React.useEffect(() => {
            const cleanStorageTasks = tasks.map(t => ({ id: t.id, done: t.done, pending: t.pending }));
            localStorage.setItem('caly_tasks', JSON.stringify(cleanStorageTasks));
          }, [tasks]);
          
          React.useEffect(() => { localStorage.setItem('caly_stars', stars.toString()); }, [stars]);
          React.useEffect(() => { localStorage.setItem('caly_level', level.toString()); }, [level]);
          React.useEffect(() => { localStorage.setItem('caly_parent_pin', parentPassword); }, [parentPassword]);
          React.useEffect(() => { localStorage.setItem('caly_history_log', JSON.stringify(historyLog)); }, [historyLog]);

          React.useEffect(() => {
            const interval = setInterval(() => {
              setActiveTimers(prev => {
                const next = { ...prev };
                Object.keys(next).forEach(id => {
                  if (next[id] > 1) {
                    next[id] -= 1;
                  } else {
                    delete next[id];
                    triggerTimerEnd();
                  }
                });
                return next;
              });
            }, 1000);
            return () => clearInterval(interval);
          }, []);

          const triggerTimerEnd = () => {
            try {
              const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
              const oscillator = audioCtx.createOscillator();
              const gainNode = audioCtx.createGain();
              oscillator.connect(gainNode);
              gainNode.connect(audioCtx.destination);
              oscillator.type = 'sine';
              oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
              gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
              oscillator.start();
              oscillator.stop(audioCtx.currentTime + 0.3);
            } catch (e) { console.log(e); }
            setTimeout(() => { speak('Bravo ma princesse, tu as fini de brosser tes dents !'); }, 500);
          };

          const handleTimerClick = (id, e) => {
            e.stopPropagation();
            if (activeTimers[id]) {
              setActiveTimers(prev => { const next = { ...prev }; delete next[id]; return next; });
            } else {
              setActiveTimers(prev => ({ ...prev, [id]: 120 }));
              speak('C’est parti pour 2 minutes de brossage !');
            }
          };

          const formatTime = (seconds) => {
            const m = Math.floor(seconds / 60);
            const s = seconds % 60;
            return `${m}:${s.toString().padStart(2, '0')}`;
          };

          const speak = (text) => {
            window.speechSynthesis.cancel();
            const msg = new SpeechSynthesisUtterance(text);
            msg.lang = 'fr-FR';
            window.speechSynthesis.speak(msg);
          };

          const toggleModeSecure = () => {
            if (!childMode) {
              const input = window.prompt("Entrez le code secret de Maman :");
              if (input === parentPassword) setChildMode(true);
              else if (input !== null) alert("Code incorrect ! 🤫");
            } else {
              setChildMode(false);
            }
          };

          const requestTaskValidation = (id) => {
            setTasks(tasks.map(t => t.id === id ? { ...t, pending: true } : t));
            speak('Demande envoyée à maman !');
          };

          const acceptTask = (id, points) => {
            const task = tasks.find(t => t.id === id);
            if (!task) return;
            setTasks(tasks.map(t => t.id === id ? { ...t, done: true, pending: false } : t));
            const newStars = stars + points;
            setStars(newStars);

            const now = new Date();
            const logMessage = `Validé à ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            setHistoryLog([logMessage, ...historyLog]);
            speak('Bravo ma princesse !');

            const targetLevel = Math.floor(newStars / 60) + 1;
            if (targetLevel > level) setLevel(targetLevel);
          };

          const rejectTask = (id) => {
            setTasks(tasks.map(t => t.id === id ? { ...t, done: false, pending: false } : t));
            speak('Mission à refaire.');
          };

          const handleBonus = () => {
            const newStars = stars + 15;
            setStars(newStars);
            setHistoryLog([`✨ BONUS PARENTAL (+15 ⭐)`, ...historyLog]);
            speak('Super bonus pour ma princesse !');
            const targetLevel = Math.floor(newStars / 60) + 1;
            if (targetLevel > level) setLevel(targetLevel);
          };

          const handlePenalty = () => {
            const newStars = Math.max(0, stars - 5);
            setStars(newStars);
            setHistoryLog([`⚠️ RETRAIT BÊTISE (-5 ⭐)`, ...historyLog]);
            speak('Attention aux bêtises !');
          };

          const buyReward = (cost, rewardName) => {
            if (stars >= cost) {
              setStars(stars - cost);
              setHistoryLog([`🛍️ RÉCOMPENSE ACHETÉE : ${rewardName} (-${cost} ⭐)`, ...historyLog]);
              speak(`Félicitations pour ta récompense !`);
            }
          };

          const resetWeek = () => {
            if (window.confirm("Recommencer la semaine ?")) {
              setTasks(defaultTasks.map(t => ({ ...t, done: false, pending: false })));
              setHistoryLog([]);
            }
          };

          const filteredTasks = tasks.filter(t => currentCategory === 'all' || t.category === currentCategory);

          return (
            <div style={{ maxWidth: '600px', margin: '0 auto' }}>
              <div style={{ textAlign: 'center', marginBottom: '25px' }}>
                <button onClick={toggleModeSecure} className="btn-mode">
                  {childMode ? '👑 Retour au Monde de Caly' : '🔒 Configuration Parentale'}
                </button>
              </div>

              {childMode ? (
                /* ================= CONFIGURATION PARENT ================= */
                <div>
                  <h1 style={{ color: '#3f51b5', textAlign: 'center' }}>Espace Maman ⚙️</h1>
                  <div className="card" style={{ textAlign: 'center' }}>
                    <p style={{ color: '#333', fontSize: '18px', margin: '0' }}>Score actuel de Caly :</p>
                    <div style={{ fontSize: '45px', fontWeight: 'bold', color: '#3f51b5', margin: '5px 0' }}>⭐ {stars}</div>
                    <p style={{ color: '#666', margin: '0' }}>Niveau : {level}</p>
                  </div>

                  <div style={{ display: 'flex', gap: '10px', marginBottom: '25px' }}>
                    <button onClick={handleBonus} className="btn-parent" style={{ background: '#7e57c2' }}>✨ Donner un Bonus (+15 ⭐)</button>
                    <button onClick={handlePenalty} className="btn-parent" style={{ background: '#ef5350' }}>⚠️ Retrait Bêtise (-5 ⭐)</button>
                  </div>

                  <div className="card">
                    <h3 style={{ color: '#333', marginTop: '0' }}>⏳ Missions en attente de validation :</h3>
                    {tasks.filter(t => t.pending).length === 0 ? (
                      <p style={{ color: '#888', fontStyle: 'italic', margin: '0' }}>Aucune mission en attente.</p>
                    ) : (
                      tasks.filter(t => t.pending).map(task => (
                        <div key={task.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', marginBottom: '12px', color: '#333', borderBottom: '1px solid #eee', paddingBottom: '8px' }}>
                          <span>{task.name} (+{task.points}⭐)</span>
                          <div>
                            <button onClick={() => acceptTask(task.id, task.points)} style={{ background: '#4caf50', color: '#fff', border: 'none', padding: '6px 12px', borderRadius: '6px', cursor: 'pointer', marginRight: '5px', fontWeight: 'bold' }}>Valider</button>
                            <button onClick={() => rejectTask(task.id)} style={{ background: '#f44336', color: '#fff', border: 'none', padding: '6px 12px', borderRadius: '6px', cursor: 'pointer', fontWeight: 'bold' }}>Refuser</button>
                          </div>
                        </div>
                      ))
                    )}
                  </div>

                  <div className="card">
                    <h3 style={{ color: '#333', marginTop: '0' }}>🛍️ Boutique magique (Mode Maman) :</h3>
                    {rewards.map(r => (
                      <div key={r.id} style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'center', padding: '10px 0', borderBottom: '1px solid #f9f9f9', color: '#333' }}>
                        <span style={{ color: stars >= r.cost ? '#333' : '#aaa' }}>{r.name} <strong>({r.cost} ⭐)</strong></span>
                        <button onClick={() => buyReward(r.cost, r.name)} disabled={stars < r.cost} style={{ padding: '6px 14px', background: stars >= r.cost ? '#3f51b5' : '#e0e0e0', color: '#fff', border: 'none', borderRadius: '8px', cursor: stars >= r.cost ? 'pointer' : 'default', fontWeight: 'bold' }}>Débloquer 🛒</button>
                      </div>
                    ))}
                  </div>
                </div>
              ) : (
                /* ================= INTERFACE PREMIUM CALY CHAT ================= */
                <div>
                  <div className="royal-header">
                    <div className="royal-cat-container">
                      <div className="royal-cat-badge">
                        {iconsSVG.sirene}
                        <div className="badge-heart-decor"></div>
                      </div>
                    </div>
                    <h1 className="princess-title" onClick={() => speak('Bonjour Caly chat !')}>Caly chat</h1>
                    <p style={{ color: '#6c5ce7', margin: '0', fontSize: '15px', fontWeight: 'bold' }}>✨ MONDE DE NIVEAU {level} ✨</p>
                    
                    <div>
                      <div className="star-medallion">
                        <span>💖</span> {stars} Étoiles
                      </div>
                    </div>
                  </div>

                  <div className="category-scroll">
                    {categoriesList.map(cat => (
                      <div 
                        key={cat.id} 
                        onClick={() => { setCurrentCategory(cat.id); speak(cat.voice); }}
                        className={`category-item ${currentCategory === cat.id ? 'active' : ''}`}
                      >
                        <div 
                          className="btn-category-round"
                          style={{ 
                            background: cat.color,
                            border: currentCategory === cat.id ? '4px solid #6c5ce7' : '3px solid #ffffff'
                          }}
                        >
                          <span style={{ fontSize: '24px' }}>{cat.icon}</span>
                        </div>
                        <span className="category-label">{cat.label}</span>
                      </div>
                    ))}
                  </div>

                  {filteredTasks.map(task => (
                    <div key={task.id} className="task-card">
                      <div className="task-illustration-box" style={{ backgroundColor: task.bgBox }}>
                        {task.icon}
                      </div>
                      
                      <div style={{ textAlign: 'left', color: '#333', flexGrow: 1, paddingLeft: '18px', cursor: 'pointer' }} onClick={() => speak(task.name)}>
                        <h3 style={{ margin: '0', fontSize: '17px', color: '#2d3436', display: 'flex', alignItems: 'center', gap: '6px', fontWeight: '700' }}>
                          <span>{task.name}</span>
                          <span style={{ fontSize: '13px', color: '#a6c1ee' }}>🔊</span>
                        </h3>
                        <p style={{ margin: '4px 0 0 0', color: '#6c5ce7', fontSize: '13px', fontWeight: 'bold' }}>+{task.points} {task.points > 1 ? 'étoiles' : 'étoile'}</p>
                        
                        {task.hasTimer && !task.done && !task.pending && (
                          <div>
                            <button className="btn-timer" onClick={(e) => handleTimerClick(task.id, e)} style={{ background: activeTimers[task.id] ? '#ef5350' : '#6c5ce7' }}>
                              {activeTimers[task.id] ? `🛑 ${formatTime(activeTimers[task.id])}` : '⏱️ 2 min'}
                            </button>
                          </div>
                        )}
                      </div>
                      <button 
                        onClick={() => requestTaskValidation(task.id)} 
                        disabled={task.done || task.pending} 
                        className="btn-valider" 
                        style={{ 
                          background: task.done ? '#4caf50' : task.pending ? '#ffa726' : 'linear-gradient(135deg, #6c5ce7 0%, #a29bfe 100%)',
                          cursor: (task.done || task.pending) ? 'default' : 'pointer'
                        }}
                      >
                        {task.done ? '✓ Fait' : task.pending ? 'Vérif ⏳' : 'Valider 🎉'}
                      </button>
                    </div>
                  ))}

                  <div className="card" style={{ background: '#fffdeb', border: '2px solid #ffd700', borderRadius: '24px', textAlign: 'left' }}>
                    <h3 style={{ margin: '0 0 12px 0', fontSize: '20px', color: '#5d4037', fontFamily: 'Georgia, serif' }}>🛍️ Boutique magique</h3>
                    {rewards.map(r => (
                      <p key={r.id} style={{ margin: '8px 0', fontSize: '16px', color: stars >= r.cost ? '#2e7d32' : '#555', fontWeight: stars >= r.cost ? 'bold' : 'normal' }}>
                        {stars >= r.cost ? '⭐ ' : '🔒 '} <strong>{r.cost} ⭐</strong> = {r.name}
                      </p>
                    ))}
                  </div>
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
