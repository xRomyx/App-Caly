        function App() {
          const [loading, setLoading] = React.useState(true);
          const [tasks, setTasks] = React.useState(defaultTasks);
          const [stars, setStars] = React.useState(0);
          const [level, setLevel] = React.useState(1);
          const [parentPassword, setParentPassword] = React.useState('1234');
          const [historyLog, setHistoryLog] = React.useState([]);
          const [rewardLog, setRewardLog] = React.useState([]);
          const [pendingRewards, setPendingRewards] = React.useState([]);
          const [grantedReward, setGrantedReward] = React.useState(null);
          const [voiceEnabled, setVoiceEnabled] = React.useState(true);
          const [childMode, setChildMode] = React.useState(false);
          const isRemoteRef = React.useRef(false);
          const [currentCategory, setCurrentCategory] = React.useState('all');
          const [activeTimers, setActiveTimers] = React.useState({});
          const [showCelebration, setShowCelebration] = React.useState(false);
          const [celebrationActive, setCelebrationActive] = React.useState(false);
          const [celebrationStars, setCelebrationStars] = React.useState([]);

          // Écoute Firebase en temps réel (sync entre les deux téléphones)
          React.useEffect(() => {
            const ref = db.ref(DB_PATH);
            ref.on('value', (snapshot) => {
              const data = snapshot.val();
              isRemoteRef.current = true;
              if (data) {
                setStars(data.stars ?? 0);
                setLevel(data.level ?? 1);
                setParentPassword(data.parentPassword ?? '1234');
                setHistoryLog(data.historyLog ?? []);
                setRewardLog(data.rewardLog ?? []);
                setPendingRewards(data.pendingRewards ?? []);
                setGrantedReward(data.grantedReward ?? null);
                setVoiceEnabled(data.voiceEnabled ?? true);
                const savedTasks = data.tasks ?? [];
                setTasks(defaultTasks.map(dt => {
                  const saved = savedTasks.find(t => t && t.id === dt.id);
                  return saved ? { ...dt, done: saved.done, pending: saved.pending } : dt;
                }));
              } else {
                // Première ouverture : migration depuis localStorage ou valeurs par défaut
                const localTasks = localStorage.getItem('caly_tasks');
                const migratedTasks = localTasks ? JSON.parse(localTasks) : [];
                isRemoteRef.current = false;
                setStars(parseInt(localStorage.getItem('caly_stars') || '0', 10));
                setLevel(parseInt(localStorage.getItem('caly_level') || '1', 10));
                setParentPassword(localStorage.getItem('caly_parent_pin') || '1234');
                setHistoryLog(JSON.parse(localStorage.getItem('caly_history_log') || '[]'));
                setRewardLog(JSON.parse(localStorage.getItem('caly_reward_log') || '[]'));
                setTasks(defaultTasks.map(dt => {
                  const saved = migratedTasks.find(t => t && t.id === dt.id);
                  return saved ? { ...dt, done: saved.done, pending: saved.pending } : dt;
                }));
              }
              setLoading(false);
            });
            return () => ref.off();
          }, []);

          // Sauvegarde vers Firebase quand les données changent (sauf màj distante)
          React.useEffect(() => {
            if (isRemoteRef.current) { isRemoteRef.current = false; return; }
            if (loading) return;

                            {voiceEnabled && <span style={{ fontSize: '14px', color: '#ff69b4' }}>🔊</span>}
                          </h3>
                          <p style={{ margin: '4px 0 0 0', color: '#e91e63', fontSize: '13px', fontWeight: 'bold' }}>+{task.points} {task.points > 1 ? 'étoiles' : 'étoile'}</p>
                          {task.hasTimer && !task.done && !task.pending && (
                            <div>
                              <button className="btn-timer" onClick={(e) => handleTimerClick(task.id, e)} style={{ background: activeTimers[task.id] ? '#ef5350' : '#ba68c8' }}>
                                {activeTimers[task.id] ? `🛑 Arrêter (${formatTime(activeTimers[task.id])})` : '⏱️ Lancer 2 min'}
                              </button>
                            </div>
                          )}
                        </div>
                        <button
                          onClick={() => requestTaskValidation(task.id)}
                          disabled={task.done || task.pending}
                          className="btn-valider"
                          style={{
                            background: task.done ? '#4caf50' : task.pending ? '#ffa726' : 'linear-gradient(135deg, #ff4081 0%, #e91e63 100%)',
                            cursor: (task.done || task.pending) ? 'default' : 'pointer'
                          }}
                        >
                          {task.done ? '✓ Fait' : task.pending ? 'Vérification ⏳' : 'Valider 🎉'}
                        </button>
                      </div>
                    ))
                  )}
                </div>
              )}
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
