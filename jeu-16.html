<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>L'Alphabet Enchanté ✨</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvRCxPT2W7djJcHSR9kweBnaNXYQtdZqo",
      authDomain: "app-caly.firebaseapp.com",
      databaseURL: "https://app-caly-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "app-caly",
      storageBucket: "app-caly.firebasestorage.app",
      messagingSenderId: "870451326147",
      appId: "1:870451326147:web:465cff6467b66efeda4676"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const DB_PATH = new URLSearchParams(window.location.search).has('test') ? 'calyApp-test' : 'calyApp';
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #0d1b4b 0%, #1e0a3c 50%, #0a1a2e 100%);
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 16px; overflow: hidden;
      user-select: none;
    }

    /* ── Fond ── */
    .star-bg { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .star-bg span { position: absolute; color: rgba(255,255,255,0.55); animation: twinkle linear infinite; }
    @keyframes twinkle {
      0%,100% { opacity: 0.15; transform: scale(0.7); }
      50%      { opacity: 1;    transform: scale(1.3); }
    }

    .game-wrap {
      position: relative; z-index: 1;
      width: 100%; max-width: 440px;
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }

    /* ── Écrans ── */
    .screen { display: none; width: 100%; flex-direction: column; align-items: center; gap: 14px; }
    .screen.active { display: flex; }

    /* ── Loading ── */
    #screen-loading .load-emoji { font-size: 72px; animation: floatBig 1.5s ease-in-out infinite; }
    #screen-loading p { color: #c4b5fd; font-size: 18px; font-weight: bold; }

    /* ── Top bar ── */
    .top-bar {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%;
    }
    .btn-quit {
      background: rgba(255,255,255,0.1); border: 2px solid rgba(255,255,255,0.2);
      border-radius: 50px; color: #fff; padding: 8px 16px;
      font-size: 13px; font-weight: bold; cursor: pointer; text-decoration: none;
    }
    .progress-pills { display: flex; gap: 7px; }
    .pill { width: 28px; height: 10px; border-radius: 20px; background: rgba(255,255,255,0.18); transition: background 0.4s; }
    .pill.done    { background: #ffd700; }
    .pill.current { background: #c084fc; }
    .score-chip {
      background: rgba(255,215,0,0.15); border: 2px solid #ffd700;
      border-radius: 50px; padding: 6px 14px;
      font-size: 16px; font-weight: bold; color: #ffd700;
    }

    /* ── Carte lettre ── */
    .letter-card {
      width: 100%;
      background: linear-gradient(135deg, rgba(255,255,255,0.93) 0%, rgba(240,220,255,0.93) 100%);
      border-radius: 32px;
      padding: 24px 16px 16px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(168,85,247,0.4), 0 0 0 3px rgba(255,255,255,0.35);
      position: relative; overflow: hidden;
    }
    .card-deco { position: absolute; inset: 0; pointer-events: none; }
    .card-deco span {
      position: absolute; font-size: 18px; opacity: 0.7;
      animation: sparkFloat ease-in-out infinite;
    }
    @keyframes sparkFloat {
      0%,100% { transform: translateY(0) rotate(0deg); opacity: 0.5; }
      50%      { transform: translateY(-7px) rotate(15deg); opacity: 1; }
    }

    .big-letter {
      font-size: 68px; font-weight: 900;
      font-family: Georgia, 'Times New Roman', serif;
      line-height: 1; display: block;
      background: linear-gradient(135deg, #7c3aed, #ec4899, #f59e0b);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      filter: drop-shadow(0 3px 6px rgba(124,58,237,0.3));
      animation: floatBig 3s ease-in-out infinite;
    }
    .letter-prompt {
      margin-top: 10px; font-size: 15px; font-weight: bold;
      color: #7c3aed; letter-spacing: 0.5px;
    }
    .feedback-banner {
      margin-top: 10px; font-size: 19px; font-weight: 900;
      border-radius: 14px; padding: 8px 18px; display: none;
    }
    .feedback-banner.correct { background: #dcfce7; color: #16a34a; display: block; }
    .feedback-banner.wrong   { background: #fee2e2; color: #dc2626; display: block; }

    /* ── Options 3 cartes ── */
    .options-grid {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: 10px; width: 100%;
    }
    .option-card {
      background: rgba(255,255,255,0.1);
      border: 3px solid rgba(255,255,255,0.22);
      border-radius: 20px; padding: 14px 6px 12px;
      text-align: center; cursor: pointer;
      transition: transform 0.15s, background 0.2s, border-color 0.2s;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
      min-height: 110px;
    }
    .option-card:active:not(:disabled) { transform: scale(0.95); }
    .option-card:not(.disabled):hover  { background: rgba(255,255,255,0.2); }
    .opt-emoji { font-size: 52px; line-height: 1; }
    .opt-word  { font-size: 12px; font-weight: 900; color: rgba(255,255,255,0.9); letter-spacing: 1px; }

    .option-card.correct { background: linear-gradient(135deg,#16a34a,#4ade80) !important; border-color:#4ade80 !important; animation: bumpUp 0.3s ease; }
    .option-card.wrong   { background: linear-gradient(135deg,#dc2626,#f87171) !important; border-color:#f87171 !important; animation: shake 0.4s ease; }
    .option-card.reveal  { background: linear-gradient(135deg,#16a34a,#4ade80) !important; border-color:#4ade80 !important; }
    .option-card.disabled { cursor: default; pointer-events: none; }

    @keyframes bumpUp  { 0%{transform:scale(1)} 50%{transform:scale(1.08)} 100%{transform:scale(1)} }
    @keyframes shake   { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-7px)} 75%{transform:translateX(7px)} }
    @keyframes floatBig { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-9px)} }

    /* ── Confettis ── */
    .confetti-piece {
      position: fixed; top: -20px; pointer-events: none; z-index: 999; font-size: 22px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%  { transform:translateY(0) rotate(0deg);     opacity:1; }
      80% { opacity:1; }
      100%{ transform:translateY(110vh) rotate(720deg); opacity:0; }
    }
    .btn-next {
      display: none; width: 100%; padding: 18px;
      border-radius: 50px; border: none;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: #fff; font-size: 22px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 20px rgba(168,85,247,0.4);
      animation: bumpIn 0.3s ease;
    }
    @keyframes bumpIn { 0%{transform:scale(0.8);opacity:0} 100%{transform:scale(1);opacity:1} }

    /* ── Résultat ── */
    .result-card {
      width: 100%;
      background: linear-gradient(135deg,rgba(255,255,255,0.93),rgba(240,220,255,0.93));
      border-radius: 32px; padding: 35px 24px 28px;
      text-align: center;
      box-shadow: 0 8px 40px rgba(168,85,247,0.4);
    }
    .result-stars-row  { font-size: 50px; letter-spacing: 4px; margin-bottom: 14px; }
    .result-title      { font-size: 28px; font-weight: 900; color: #7c3aed; font-family:Georgia,serif; margin-bottom: 6px; }
    .result-detail     { font-size: 17px; color: #6b21a8; margin-bottom: 14px; font-weight: bold; }
    .result-pending    { font-size: 13px; color: #9333ea; background: rgba(147,51,234,0.08); border-radius: 12px; padding: 10px 14px; margin-bottom: 20px; }
    .result-btns       { display: flex; flex-direction: column; gap: 12px; }
    .btn-replay { padding:16px; border-radius:50px; border:none; background:linear-gradient(135deg,#a855f7,#6366f1); color:#fff; font-size:18px; font-weight:900; cursor:pointer; box-shadow:0 4px 16px rgba(168,85,247,0.4); }
    .btn-menu   { padding:14px; border-radius:50px; border:2px solid rgba(124,58,237,0.4); background:transparent; color:#7c3aed; font-size:16px; font-weight:bold; cursor:pointer; }
  </style>
</head>
<body>

<div class="star-bg" id="starBg"></div>

<div class="game-wrap">

  <!-- ══ LOADING ══ -->
  <div id="screen-loading" class="screen active">
    <div class="load-emoji">🔤</div>
    <p>Chargement...</p>
  </div>

  <!-- ══ JEU ══ -->
  <div id="screen-game" class="screen">
    <div class="top-bar">
      <a id="quitBtn" href="jeux.html" class="btn-quit">← Menu</a>
      <div class="progress-pills" id="pillsContainer"></div>
      <div class="score-chip">⭐ <span id="scoreDisplay">0</span></div>
    </div>

    <div class="letter-card">
      <div class="card-deco" id="cardDeco"></div>
      <span class="big-letter" id="bigLetter">A</span>
      <div class="letter-prompt">Quel mot commence par cette lettre ?</div>
      <div class="feedback-banner" id="feedbackBanner"></div>
    </div>

    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Suivant →</button>

    <div class="options-grid" id="optionsGrid">
      <div class="option-card" id="opt0" onclick="checkAnswer(0)">
        <span class="opt-emoji" id="emoji0">🌳</span>
        <span class="opt-word"  id="word0">ARBRE</span>
      </div>
      <div class="option-card" id="opt1" onclick="checkAnswer(1)">
        <span class="opt-emoji" id="emoji1">🐱</span>
        <span class="opt-word"  id="word1">CHAT</span>
      </div>
      <div class="option-card" id="opt2" onclick="checkAnswer(2)">
        <span class="opt-emoji" id="emoji2">🌙</span>
        <span class="opt-word"  id="word2">LUNE</span>
      </div>
    </div>
  </div>

  <!-- ══ RÉSULTAT ══ -->
  <div id="screen-result" class="screen">
    <div class="result-card">
      <div class="result-stars-row" id="resultStars"></div>
      <div class="result-title"  id="resultTitle"></div>
      <div class="result-detail" id="resultDetail"></div>
      <div class="result-pending">⏳ Tes étoiles attendent la validation de maman !</div>
      <div class="result-btns">
        <button class="btn-replay" onclick="startGame()">🔄 Rejouer</button>
        <button class="btn-menu"   onclick="goMenu()">← Retour au menu</button>
      </div>
    </div>
  </div>

</div>

<script>
// ══════════════════════════════════════
//  BANQUE DE QUESTIONS
//  Chaque question : lettre + image correcte + 2 images fausses
// ══════════════════════════════════════
const allQuestions = [
  { letter:'A', correct:{emoji:'🌳',word:'ARBRE'},   wrong:[{emoji:'🐱',word:'CHAT'},      {emoji:'🌙',word:'LUNE'}]      },
  { letter:'B', correct:{emoji:'🎈',word:'BALLON'},  wrong:[{emoji:'🍎',word:'POMME'},     {emoji:'🦁',word:'LION'}]      },
  { letter:'C', correct:{emoji:'🐱',word:'CHAT'},    wrong:[{emoji:'🌸',word:'FLEUR'},     {emoji:'🚂',word:'TRAIN'}]     },
  { letter:'D', correct:{emoji:'🐬',word:'DAUPHIN'}, wrong:[{emoji:'🐸',word:'GRENOUILLE'},{emoji:'⭐',word:'ÉTOILE'}]    },
  { letter:'F', correct:{emoji:'🌸',word:'FLEUR'},   wrong:[{emoji:'🐶',word:'CHIEN'},     {emoji:'🌙',word:'LUNE'}]      },
  { letter:'G', correct:{emoji:'🎂',word:'GÂTEAU'},  wrong:[{emoji:'🐠',word:'POISSON'},   {emoji:'🎈',word:'BALLON'}]    },
  { letter:'L', correct:{emoji:'🦁',word:'LION'},    wrong:[{emoji:'🍎',word:'POMME'},     {emoji:'🐶',word:'CHIEN'}]     },
  { letter:'M', correct:{emoji:'🏠',word:'MAISON'},  wrong:[{emoji:'🐱',word:'CHAT'},      {emoji:'⭐',word:'ÉTOILE'}]    },
  { letter:'O', correct:{emoji:'🐻',word:'OURS'},    wrong:[{emoji:'🌸',word:'FLEUR'},     {emoji:'🚂',word:'TRAIN'}]     },
  { letter:'P', correct:{emoji:'🍎',word:'POMME'},   wrong:[{emoji:'🦁',word:'LION'},      {emoji:'🐱',word:'CHAT'}]      },
  { letter:'R', correct:{emoji:'🦊',word:'RENARD'},  wrong:[{emoji:'🎂',word:'GÂTEAU'},    {emoji:'🐠',word:'POISSON'}]   },
  { letter:'S', correct:{emoji:'☀️',word:'SOLEIL'},  wrong:[{emoji:'🌸',word:'FLEUR'},     {emoji:'🐱',word:'CHAT'}]      },
  { letter:'T', correct:{emoji:'🐢',word:'TORTUE'},  wrong:[{emoji:'🍎',word:'POMME'},     {emoji:'🎈',word:'BALLON'}]    },
  { letter:'V', correct:{emoji:'🐄',word:'VACHE'},   wrong:[{emoji:'🐶',word:'CHIEN'},     {emoji:'🌙',word:'LUNE'}]      },
  { letter:'É', correct:{emoji:'⭐',word:'ÉTOILE'},  wrong:[{emoji:'🍓',word:'FRAISE'},    {emoji:'🏠',word:'MAISON'}]    },
];

// ══════════════════════════════════════
//  ÉTAT
// ══════════════════════════════════════
const TOTAL_Q = 5;
let gameQuestions = [];
let currentQ      = 0;
let score         = 0;
let answered      = false;
let correctIndex  = -1;

// ══════════════════════════════════════
//  INIT
// ══════════════════════════════════════
window.addEventListener('load', async () => {
  buildStarBg();
  buildCardDeco();
  buildPills();
  await new Promise(r => setTimeout(r, 700));
  showScreen('game');
  startGame();
});

function startGame() {
  const shuffled = [...allQuestions].sort(() => Math.random() - 0.5);
  gameQuestions = shuffled.slice(0, TOTAL_Q);
  currentQ = 0; score = 0;
  updateScoreDisplay();
  showScreen('game');
  showQuestion();
}

// ══════════════════════════════════════
//  AFFICHER UNE QUESTION
// ══════════════════════════════════════
function showQuestion() {
  answered = false;
  const q = gameQuestions[currentQ];

  // Pilules
  for (let i = 0; i < TOTAL_Q; i++) {
    const p = document.getElementById('pill' + i);
    if (p) p.className = 'pill' + (i < currentQ ? ' done' : i === currentQ ? ' current' : '');
  }

  // Lettre
  const letterEl = document.getElementById('bigLetter');
  letterEl.textContent = q.letter;
  letterEl.style.animation = 'none'; void letterEl.offsetWidth; letterEl.style.animation = '';

  // Feedback reset
  const banner = document.getElementById('feedbackBanner');
  banner.className = 'feedback-banner'; banner.textContent = '';

  // Construire les 3 options mélangées
  const opts = [q.correct, ...q.wrong].sort(() => Math.random() - 0.5);
  correctIndex = opts.findIndex(o => o.word === q.correct.word);

  for (let i = 0; i < 3; i++) {
    document.getElementById('emoji' + i).textContent = opts[i].emoji;
    document.getElementById('word' + i).textContent  = opts[i].word;
    const card = document.getElementById('opt' + i);
    card.className = 'option-card';
  }

  // Lien quitter
  document.getElementById('quitBtn').href = 'jeux.html' + (DB_PATH === 'calyApp-test' ? '?test' : '');
}

// ══════════════════════════════════════
//  VÉRIFIER
// ══════════════════════════════════════
function checkAnswer(idx) {
  if (answered) return;
  answered = true;

  const isOk   = idx === correctIndex;
  const banner = document.getElementById('feedbackBanner');

  // Désactiver toutes les cartes
  for (let i = 0; i < 3; i++) document.getElementById('opt' + i).classList.add('disabled');

  const card = document.getElementById('opt' + idx);

  if (isOk) {
    card.classList.add('correct');
    banner.textContent = 'Bravo ! 🌟';
    banner.className   = 'feedback-banner correct';
    score++; updateScoreDisplay();
    playSound('correct'); triggerConfetti(8);
  } else {
    card.classList.add('wrong');
    banner.textContent = 'Presque ! Le mot qui commence par ' + gameQuestions[currentQ].letter + ' est : ' + gameQuestions[currentQ].correct.word;
    banner.className   = 'feedback-banner wrong';
    playSound('wrong');
    document.getElementById('opt' + correctIndex).classList.add('reveal');
  }

  const btnNext = document.getElementById('btnNext');
  btnNext.style.display = 'block';
  btnNext.style.animation = 'none'; void btnNext.offsetWidth; btnNext.style.animation = '';
}

// ══════════════════════════════════════
//  RÉSULTAT
// ══════════════════════════════════════
async function showResult() {
  showScreen('result');

  // Calcul étoiles : 0-1 → 0★, 2 → 1★, 3-4 → 2★, 5 → 3★
  let earned = 0;
  if (score >= 4) earned = 2;
  else if (score >= 2) earned = 1;

  document.getElementById('resultStars').textContent  = '⭐'.repeat(earned) + '☆'.repeat(2 - earned);
  const msgs = [
    ['Continue !',       'Essaie encore, tu vas y arriver !'],
    ['Bien essayé !',    'Tu gagnes 1 étoile !'],
    ['Super !',          'Tu gagnes 2 étoiles !'],
    ['Parfait !',        'Toutes les réponses correctes ! 3 étoiles ! 🎉'],
  ];
  const [title, detail] = msgs[earned];
  document.getElementById('resultTitle').textContent  = title;
  document.getElementById('resultDetail').textContent = detail;

  if (earned === 3) { playSound('fanfare'); triggerConfetti(22); }
  else if (earned > 0) playSound('correct');
  speak(title + ' ' + detail);

  // Firebase
  try {
    const snap = await db.ref(DB_PATH + '/pendingGameStars').get();
    const val  = snap.val();
    const arr  = val ? (Array.isArray(val) ? val : Object.values(val)).filter(Boolean) : [];
    const now  = new Date();
    arr.push({
      id:       Date.now().toString(),
      game:     "L'Alphabet Enchanté",
      stars:    earned,
      playedAt: String(now.getHours()).padStart(2,'0') + ':' + String(now.getMinutes()).padStart(2,'0'),
    });
    await db.ref(DB_PATH + '/pendingGameStars').set(arr);
  } catch(e) { console.error(e); }
}

function nextQuestion() {
  document.getElementById('btnNext').style.display = 'none';
  currentQ++;
  if (currentQ < TOTAL_Q) showQuestion();
  else showResult();
}

function goMenu() {
  window.location.href = 'jeux.html?played=jeu-16' + (DB_PATH === 'calyApp-test' ? '&test' : '');
}

// ══════════════════════════════════════
//  HELPERS
// ══════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}
function updateScoreDisplay() { document.getElementById('scoreDisplay').textContent = score; }

function buildPills() {
  const container = document.getElementById('pillsContainer');
  for (let i = 0; i < TOTAL_Q; i++) {
    const p = document.createElement('div');
    p.className = 'pill'; p.id = 'pill' + i;
    container.appendChild(p);
  }
}

// ══════════════════════════════════════
//  AUDIO
// ══════════════════════════════════════
function playSound(type) {
  try {
    const ctx  = new (window.AudioContext || window.webkitAudioContext)();
    const gain = ctx.createGain();
    gain.connect(ctx.destination);
    gain.gain.setValueAtTime(0.35, ctx.currentTime);

    if (type === 'correct') {
      [523, 659, 784].forEach((f, i) => {
        const o = ctx.createOscillator();
        o.type = 'sine'; o.frequency.value = f;
        o.connect(gain);
        o.start(ctx.currentTime + i * 0.12);
        o.stop(ctx.currentTime + i * 0.12 + 0.18);
      });
    } else if (type === 'wrong') {
      const o = ctx.createOscillator();
      o.type = 'sawtooth'; o.frequency.value = 200;
      o.connect(gain);
      gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
      o.start(ctx.currentTime); o.stop(ctx.currentTime + 0.4);
    } else if (type === 'fanfare') {
      [523, 659, 784, 1047].forEach((f, i) => {
        const o = ctx.createOscillator();
        o.type = 'sine'; o.frequency.value = f;
        o.connect(gain);
        o.start(ctx.currentTime + i * 0.15);
        o.stop(ctx.currentTime + i * 0.15 + 0.28);
      });
    }
  } catch(e) {}
}

// ══════════════════════════════════════
//  SYNTHÈSE VOCALE
// ══════════════════════════════════════
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const msg = new SpeechSynthesisUtterance(text);
  msg.lang = 'fr-FR';
  window.speechSynthesis.speak(msg);
}

// ══════════════════════════════════════
//  CONFETTIS
// ══════════════════════════════════════
function triggerConfetti(count) {
  const emojis = ['⭐','🌟','✨','💫','🎉','🌸','💖','🔤'];
  for (let i = 0; i < count; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'confetti-piece';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      el.style.left = Math.random() * 100 + 'vw';
      el.style.fontSize = (14 + Math.random() * 18) + 'px';
      const dur = (1.5 + Math.random() * 2).toFixed(1);
      el.style.animationDuration = dur + 's';
      document.body.appendChild(el);
      setTimeout(() => el.remove(), dur * 1000 + 100);
    }, i * 80);
  }
}

// ══════════════════════════════════════
//  DÉCORATION
// ══════════════════════════════════════
function buildStarBg() {
  const bg = document.getElementById('starBg');
  const chars = ['✦','✧','⋆','·','∗','✸'];
  for (let i = 0; i < 35; i++) {
    const s = document.createElement('span');
    s.textContent = chars[Math.floor(Math.random() * chars.length)];
    s.style.cssText = `left:${Math.random()*100}%;top:${Math.random()*100}%;
      font-size:${8+Math.random()*14}px;
      animation-duration:${2+Math.random()*4}s;
      animation-delay:${Math.random()*4}s;`;
    bg.appendChild(s);
  }
}

function buildCardDeco() {
  const c = document.getElementById('cardDeco');
  const positions = [
    {top:'6px',left:'10px'},{top:'6px',right:'10px'},
    {bottom:'6px',left:'10px'},{bottom:'6px',right:'10px'},
    {top:'45%',left:'4px'},{top:'45%',right:'4px'},
  ];
  ['✨','⭐','💫','🌟','✦','✧'].forEach((icon, i) => {
    const s = document.createElement('span');
    s.textContent = icon;
    s.style.cssText = Object.entries(positions[i]).map(([k,v])=>`${k}:${v}`).join(';')
      + `;animation-duration:${2.2+i*0.35}s;animation-delay:${i*0.28}s;font-size:16px;`;
    c.appendChild(s);
  });
}
</script>
