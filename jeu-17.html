<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>La baguette du son ✨</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvRCxPT2W7djJcHSR9kweBnaNXYQtdZqo",
      authDomain: "app-caly.firebaseapp.com",
      databaseURL: "https://app-caly-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "app-caly",
      storageBucket: "app-caly.firebasestorage.app",
      messagingSenderId: "870451326147",
      appId: "1:870451326147:web:465cff6467b66efeda4676"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const DB_PATH = new URLSearchParams(window.location.search).has('test') ? 'calyApp-test' : 'calyApp';
    const isTest = DB_PATH === 'calyApp-test';
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1a0533 0%, #2d1b69 50%, #1a0533 100%);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 16px 40px;
      color: #fff;
      overflow-x: hidden;
    }
    .test-banner {
      background: #ff9800; color: #fff; padding: 6px 14px;
      border-radius: 10px; text-align: center; font-weight: bold;
      margin-bottom: 10px; font-size: 13px; width: 100%; max-width: 480px;
    }
    .game-header {
      text-align: center;
      margin-bottom: 18px;
      width: 100%; max-width: 480px;
    }
    .game-title {
      font-size: 28px;
      font-weight: 900;
      background: linear-gradient(135deg, #ffd700, #a78bfa, #ff69b4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    .progress-bar-wrap {
      background: rgba(255,255,255,0.1);
      border-radius: 50px;
      height: 10px;
      width: 100%;
      margin-bottom: 6px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #a855f7, #ffd700);
      height: 100%;
      border-radius: 50px;
      transition: width 0.4s ease;
    }
    .progress-text {
      font-size: 13px;
      color: rgba(255,255,255,0.6);
    }

    /* Question card */
    .question-card {
      background: rgba(255,255,255,0.1);
      border: 2px solid rgba(255,255,255,0.2);
      border-radius: 28px;
      padding: 28px 20px 22px;
      width: 100%; max-width: 480px;
      text-align: center;
      position: relative;
      margin-bottom: 20px;
    }
    .sparkle {
      position: absolute;
      font-size: 20px;
      animation: sparkleAnim 2s ease-in-out infinite;
      pointer-events: none;
    }
    .sparkle:nth-child(1) { top: -10px; left: 14%; animation-delay: 0s; }
    .sparkle:nth-child(2) { top: -10px; right: 14%; animation-delay: 0.8s; }
    .sparkle:nth-child(3) { bottom: -10px; left: 22%; animation-delay: 1.4s; }
    @keyframes sparkleAnim {
      0%, 100% { transform: scale(0.7) rotate(-15deg); opacity: 0.4; }
      50%       { transform: scale(1.3) rotate(15deg);  opacity: 1; }
    }

    .word-emoji {
      font-size: 95px;
      margin-bottom: 14px;
      display: block;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.35));
    }
    .word-text {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: 5px;
      background: linear-gradient(135deg, #fff, #d8b4fe);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 10px;
    }
    .speak-btn {
      background: rgba(168,85,247,0.25);
      border: 2px solid rgba(168,85,247,0.5);
      border-radius: 50px;
      color: #d8b4fe;
      font-size: 16px;
      padding: 8px 20px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .speak-btn:active { background: rgba(168,85,247,0.45); }
    .question-label {
      font-size: 16px;
      color: rgba(255,255,255,0.65);
      margin-top: 14px;
      line-height: 1.4;
    }

    /* Letter buttons */
    .letters-grid {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 20px;
      width: 100%; max-width: 480px;
    }
    .letter-btn {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      border: none;
      font-size: 40px;
      font-weight: 900;
      color: #fff;
      cursor: pointer;
      transition: transform 0.12s;
      box-shadow: 0 6px 20px rgba(0,0,0,0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    /* Couleurs assignées dynamiquement via JS (mélangées aléatoirement) */
    .letter-btn:active:not(:disabled) { transform: scale(0.9); }
    .letter-btn:disabled { cursor: default; }
    .letter-btn.correct {
      background: linear-gradient(135deg, #16a34a, #15803d) !important;
      transform: scale(1.22) !important;
      border: 4px solid #86efac !important;
      box-shadow: 0 0 45px rgba(34,197,94,0.95), 0 0 90px rgba(34,197,94,0.4) !important;
      animation: bumpIn 0.4s ease;
    }
    .letter-btn.wrong {
      background: linear-gradient(135deg, #dc2626, #b91c1c) !important;
      border: 4px solid #fca5a5 !important;
      box-shadow: 0 0 40px rgba(239,68,68,0.9), 0 0 80px rgba(239,68,68,0.35) !important;
      animation: shake 0.45s ease;
    }

    /* Feedback */
    .feedback-zone {
      min-height: 54px;
      text-align: center;
      width: 100%; max-width: 480px;
      margin-bottom: 10px;
    }
    .feedback-msg {
      font-size: 17px;
      font-weight: bold;
      padding: 12px 18px;
      border-radius: 16px;
      animation: bumpIn 0.3s ease;
      line-height: 1.4;
    }
    .feedback-msg.correct { background: rgba(34,197,94,0.22);  color: #86efac; }
    .feedback-msg.wrong   { background: rgba(239,68,68,0.22);  color: #fca5a5; }

    /* Suivant */
    .btn-next {
      display: none;
      width: 100%; max-width: 480px;
      padding: 18px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #a855f7, #6366f1);
      color: #fff;
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(168,85,247,0.4);
      margin-bottom: 20px;
    }

    /* Result screen */
    .result-screen {
      display: none;
      text-align: center;
      width: 100%; max-width: 480px;
    }
    .result-title {
      font-size: 38px;
      font-weight: 900;
      background: linear-gradient(135deg, #ffd700, #ff69b4);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 14px;
    }
    .stars-earned {
      font-size: 58px;
      margin: 14px 0;
      animation: bumpUp 0.6s ease;
      min-height: 70px;
    }
    .score-detail {
      font-size: 18px;
      color: rgba(255,255,255,0.65);
      margin-bottom: 22px;
    }
    .submit-msg {
      font-size: 14px;
      color: rgba(255,255,255,0.5);
      margin-bottom: 18px;
      min-height: 22px;
    }
    .btn-retour {
      width: 100%;
      padding: 18px;
      border-radius: 50px;
      border: none;
      background: linear-gradient(135deg, #ffd700, #ff9800);
      color: #1a0533;
      font-size: 20px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 20px rgba(255,215,0,0.4);
    }

    /* Confetti */
    .confetti-container {
      position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      pointer-events: none; z-index: 100; overflow: hidden;
    }
    .confetti-piece {
      position: absolute;
      width: 10px; height: 10px;
      border-radius: 2px;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(-20px) rotate(0deg);   opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    /* Stars BG */
    .star-bg {
      position: fixed; pointer-events: none;
      top: 0; left: 0; right: 0; bottom: 0;
      overflow: hidden; z-index: 0;
    }
    .star-bg span {
      position: absolute; font-size: 14px;
      animation: twinkle linear infinite;
    }
    @keyframes twinkle {
      0%, 100% { opacity: 0.3; transform: scale(0.8); }
      50%       { opacity: 1;   transform: scale(1.2); }
    }

    .content {
      position: relative; z-index: 1;
      width: 100%;
      display: flex; flex-direction: column; align-items: center;
    }

    @keyframes bumpIn {
      0%   { transform: scale(0.5); opacity: 0; }
      70%  { transform: scale(1.1); }
      100% { transform: scale(1);   opacity: 1; }
    }
    @keyframes bumpUp {
      0%   { transform: translateY(30px) scale(0.5); opacity: 0; }
      60%  { transform: translateY(-10px) scale(1.1); }
      100% { transform: translateY(0) scale(1);      opacity: 1; }
    }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%       { transform: translateX(-8px); }
      40%       { transform: translateX(8px); }
      60%       { transform: translateX(-6px); }
      80%       { transform: translateX(6px); }
    }
  </style>
</head>
<body>

  <div class="star-bg" id="starBg"></div>
  <div class="confetti-container" id="confettiContainer"></div>

  <div class="content">
    <div id="testBanner"></div>

    <div class="game-header">
      <div class="game-title">🪄 La baguette du son</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
      </div>
      <div class="progress-text" id="progressText">Question 1 / 5</div>
    </div>

    <!-- Question card -->
    <div class="question-card" id="questionCard">
      <span class="sparkle">✦</span>
      <span class="sparkle">✧</span>
      <span class="sparkle">✦</span>
      <div class="word-emoji" id="wordEmoji"></div>
      <div class="word-text" id="wordText"></div>
      <button class="speak-btn" onclick="speakWord()">🔊 Réécouter</button>
      <div class="question-label">Avec quelle lettre<br>commence ce mot ?</div>
    </div>

    <!-- 3 letter buttons -->
    <div class="letters-grid" id="lettersGrid"></div>

    <!-- Feedback -->
    <div class="feedback-zone" id="feedbackZone"></div>

    <!-- Suivant -->
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Suivant →</button>

    <!-- Result screen -->
    <div class="result-screen" id="resultScreen">
      <div class="result-title" id="resultTitle"></div>
      <div class="stars-earned" id="starsEarned"></div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="submit-msg" id="submitMsg"></div>
      <button class="btn-retour" onclick="goBack()">🎮 Retour aux jeux</button>
    </div>
  </div>

  <script>
    // ── Fond étoilé ──────────────────────────────────────────────────────────
    const bg = document.getElementById('starBg');
    for (let i = 0; i < 25; i++) {
      const s = document.createElement('span');
      s.textContent = ['✦','✧','⋆','·'][Math.floor(Math.random()*4)];
      s.style.left = Math.random()*100 + '%';
      s.style.top  = Math.random()*100 + '%';
      s.style.animationDuration = (2 + Math.random()*4) + 's';
      s.style.animationDelay    = (Math.random()*4) + 's';
      bg.appendChild(s);
    }

    // ── Bannière test ─────────────────────────────────────────────────────────
    if (isTest) {
      document.getElementById('testBanner').innerHTML =
        '<div class="test-banner">🧪 VERSION TEST</div>';
    }

    // ── Questions (pool de 25) ────────────────────────────────────────────────
    // Chaque question : emoji visible + mot écrit + lettre initiale + 2 leurres
    const ALL_QUESTIONS = [
      { emoji: '🍎', word: 'Pomme',      letter: 'P', wrong: ['M', 'T'] },
      { emoji: '🌙', word: 'Lune',       letter: 'L', wrong: ['N', 'V'] },
      { emoji: '🚂', word: 'Train',      letter: 'T', wrong: ['R', 'N'] },
      { emoji: '🦊', word: 'Renard',     letter: 'R', wrong: ['N', 'D'] },
      { emoji: '🏠', word: 'Maison',     letter: 'M', wrong: ['S', 'N'] },
      { emoji: '🌊', word: 'Vague',      letter: 'V', wrong: ['G', 'A'] },
      { emoji: '🍌', word: 'Banane',     letter: 'B', wrong: ['N', 'A'] },
      { emoji: '🌸', word: 'Rose',       letter: 'R', wrong: ['S', 'O'] },
      { emoji: '🍓', word: 'Fraise',     letter: 'F', wrong: ['R', 'S'] },
      { emoji: '🌟', word: 'Soleil',     letter: 'S', wrong: ['L', 'E'] },
      { emoji: '🦄', word: 'Licorne',    letter: 'L', wrong: ['C', 'N'] },
      { emoji: '🏔️', word: 'Montagne',  letter: 'M', wrong: ['T', 'G'] },
      { emoji: '🦆', word: 'Canard',     letter: 'C', wrong: ['N', 'D'] },
      { emoji: '🎁', word: 'Cadeau',     letter: 'C', wrong: ['D', 'A'] },
      { emoji: '🦁', word: 'Lion',       letter: 'L', wrong: ['I', 'N'] },
      { emoji: '🌵', word: 'Cactus',     letter: 'C', wrong: ['T', 'S'] },
      { emoji: '🐸', word: 'Grenouille', letter: 'G', wrong: ['R', 'N'] },
      { emoji: '🎉', word: 'Fête',       letter: 'F', wrong: ['T', 'E'] },
      { emoji: '🍰', word: 'Gâteau',     letter: 'G', wrong: ['T', 'A'] },
      { emoji: '🌻', word: 'Tournesol',  letter: 'T', wrong: ['R', 'S'] },
      { emoji: '🐝', word: 'Abeille',    letter: 'A', wrong: ['B', 'E'] },
      { emoji: '🦩', word: 'Flamant',    letter: 'F', wrong: ['L', 'M'] },
      { emoji: '🐙', word: 'Poulpe',     letter: 'P', wrong: ['L', 'O'] },
      { emoji: '🍇', word: 'Raisin',     letter: 'R', wrong: ['A', 'S'] },
      { emoji: '🐬', word: 'Dauphin',    letter: 'D', wrong: ['P', 'N'] },
    ];

    // Palette de couleurs pour les boutons (mélangée aléatoirement à chaque question)
    const BTN_COLORS = [
      { bg: 'linear-gradient(135deg, #f472b6, #ec4899)', shadow: '0 6px 20px rgba(244,114,182,0.45)' },
      { bg: 'linear-gradient(135deg, #818cf8, #6366f1)', shadow: '0 6px 20px rgba(129,140,248,0.45)' },
      { bg: 'linear-gradient(135deg, #fb923c, #f97316)', shadow: '0 6px 20px rgba(251,146,60,0.45)'  },
    ];

    const TOTAL_Q   = 5;
    let selectedQ   = [];
    let currentQ    = 0;
    let score       = 0;
    let correctIdx  = -1;
    let answered    = false;

    // ── Utilitaires ───────────────────────────────────────────────────────────
    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang  = 'fr-FR';
      utt.rate  = 0.88;
      utt.pitch = 1.15;
      window.speechSynthesis.speak(utt);
    }

    function playSound(correct) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (correct) {
          [523, 659, 784].forEach((freq, i) => {
            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = freq;
            osc.type = 'sine';
            gain.gain.setValueAtTime(0.28, ctx.currentTime + i * 0.12);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i * 0.12 + 0.28);
            osc.start(ctx.currentTime + i * 0.12);
            osc.stop(ctx.currentTime + i * 0.12 + 0.28);
          });
        } else {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = 220;
          osc.type = 'sawtooth';
          gain.gain.setValueAtTime(0.28, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 0.45);
        }
      } catch(e) {}
    }

    function launchConfetti() {
      const container = document.getElementById('confettiContainer');
      const colors = ['#ffd700','#ff69b4','#a855f7','#34d399','#60a5fa','#f472b6'];
      for (let i = 0; i < 35; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random()*100 + '%';
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDuration = (1.5 + Math.random()*2) + 's';
        piece.style.animationDelay    = (Math.random()*0.5) + 's';
        const size = 8 + Math.random()*8;
        piece.style.width  = size + 'px';
        piece.style.height = size + 'px';
        container.appendChild(piece);
        setTimeout(() => piece.remove(), 3600);
      }
    }

    // ── Jeu ───────────────────────────────────────────────────────────────────
    function startGame() {
      selectedQ = shuffle(ALL_QUESTIONS).slice(0, TOTAL_Q);
      currentQ  = 0;
      score     = 0;
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      document.getElementById('btnNext').style.display    = 'none';
      document.getElementById('feedbackZone').innerHTML   = '';
      document.getElementById('resultScreen').style.display = 'none';
      document.getElementById('questionCard').style.display = '';
      document.getElementById('lettersGrid').style.display  = '';

      const q = selectedQ[currentQ];
      document.getElementById('wordEmoji').textContent = q.emoji;
      document.getElementById('wordText').textContent  = q.word.toUpperCase();

      // Mélanger les 3 options (bonne réponse + 2 leurres)
      const options = shuffle([q.letter, ...q.wrong]);
      correctIdx = options.indexOf(q.letter);

      // Barre de progression
      document.getElementById('progressBar').style.width  = (currentQ / TOTAL_Q * 100) + '%';
      document.getElementById('progressText').textContent = 'Question ' + (currentQ + 1) + ' / ' + TOTAL_Q;

      // Boutons lettres — couleurs mélangées aléatoirement
      const grid = document.getElementById('lettersGrid');
      grid.innerHTML = '';
      const colorOrder = shuffle([0, 1, 2]);
      options.forEach((letter, idx) => {
        const btn = document.createElement('button');
        btn.className = 'letter-btn';
        btn.textContent = letter;
        btn.setAttribute('aria-label', 'Lettre ' + letter);
        // Appliquer la couleur aléatoire
        const c = BTN_COLORS[colorOrder[idx]];
        btn.style.background = c.bg;
        btn.style.boxShadow  = c.shadow;
        btn.onclick = () => checkAnswer(idx, options);
        grid.appendChild(btn);
      });

      // Auto-lecture après un court délai
      setTimeout(() => speak(q.word + '. Avec quelle lettre commence ce mot ?'), 600);
    }

    function speakWord() {
      const q = selectedQ[currentQ];
      if (q) speak(q.word);
    }

    function checkAnswer(idx) {
      if (answered) return;
      answered = true;

      const q    = selectedQ[currentQ];
      const btns = document.querySelectorAll('.letter-btn');
      btns.forEach(b => b.disabled = true);

      const isCorrect = (idx === correctIdx);

      if (isCorrect) {
        btns[idx].classList.add('correct');
        score++;
        playSound(true);
        launchConfetti();
        document.getElementById('feedbackZone').innerHTML =
          '<div class="feedback-msg correct">✨ Bravo ! ' + q.word + ' commence par ' + q.letter + ' !</div>';
        speak('Bravo ! ' + q.word + ' commence par ' + q.letter);
      } else {
        btns[idx].classList.add('wrong');
        btns[correctIdx].classList.add('correct');
        playSound(false);
        document.getElementById('feedbackZone').innerHTML =
          '<div class="feedback-msg wrong">💪 ' + q.word + ' commence par ' + q.letter + ' !</div>';
        speak(q.word + ' commence par ' + q.letter);
      }

      // Afficher le bouton Suivant
      const btnNext = document.getElementById('btnNext');
      btnNext.style.display = 'block';
      btnNext.style.animation = 'none';
      void btnNext.offsetWidth;
      btnNext.style.animation = '';
    }

    function nextQuestion() {
      document.getElementById('btnNext').style.display = 'none';
      currentQ++;
      if (currentQ < TOTAL_Q) showQuestion();
      else showResult();
    }

    // ── Résultat ──────────────────────────────────────────────────────────────
    function getStars(s) {
      if (s >= 4) return 2;
      if (s >= 2) return 1;
      return 0;
    }

    function showResult() {
      document.getElementById('questionCard').style.display = 'none';
      document.getElementById('lettersGrid').style.display  = 'none';
      document.getElementById('feedbackZone').innerHTML     = '';
      document.getElementById('btnNext').style.display      = 'none';
      document.getElementById('progressBar').style.width    = '100%';

      const earned = getStars(score);
      document.getElementById('resultScreen').style.display = 'block';

      const titles = ['Continue !', 'Pas mal !', 'Bien joué !', 'Super !', 'Parfait ! 🎉'];
      document.getElementById('resultTitle').textContent = titles[earned];
      document.getElementById('starsEarned').textContent = earned > 0 ? '⭐'.repeat(earned) : '😊';
      document.getElementById('scoreDetail').textContent =
        score + ' / ' + TOTAL_Q + ' bonnes réponses';

      if (earned > 0) {
        launchConfetti();
        speak(titles[earned] + ' Tu as gagné ' + earned + (earned > 1 ? ' étoiles !' : ' étoile !'));
      } else {
        speak('Continue à t\'entraîner, tu vas y arriver !');
      }

      submitStars(earned);
    }

    async function submitStars(earned) {
      if (earned === 0) {
        document.getElementById('submitMsg').textContent = 'Rejoue pour gagner des étoiles !';
        return;
      }
      try {
        document.getElementById('submitMsg').textContent = '⏳ Envoi en cours...';
        const snap = await db.ref(DB_PATH + '/pendingGameStars').get();
        const val  = snap.val();
        const arr  = val ? (Array.isArray(val) ? val : Object.values(val)).filter(Boolean) : [];
        arr.push({
          id: Date.now().toString(),
          game: 'La Baguette du Son',
          stars: earned,
          playedAt: new Date().toLocaleDateString('fr-FR', {
            day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit'
          })
        });
        await db.ref(DB_PATH + '/pendingGameStars').set(arr);
        document.getElementById('submitMsg').textContent =
          '✅ ' + earned + (earned > 1 ? ' étoiles' : ' étoile') + ' en attente de validation !';
      } catch(e) {
        document.getElementById('submitMsg').textContent =
          '❌ Erreur d\'envoi. Dis-le à Papa !';
      }
    }

    function goBack() {
      window.location.href = 'jeux.html' + (isTest ? '?test' : '');
    }

    // ── Démarrage ─────────────────────────────────────────────────────────────
    startGame();
  </script>
</body>
</html>
