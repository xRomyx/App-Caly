<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>La voix des lettres 🔊</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBvRCxPT2W7djJcHSR9kweBnaNXYQtdZqo",
      authDomain: "app-caly.firebaseapp.com",
      databaseURL: "https://app-caly-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "app-caly",
      storageBucket: "app-caly.firebasestorage.app",
      messagingSenderId: "870451326147",
      appId: "1:870451326147:web:465cff6467b66efeda4676"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const DB_PATH = new URLSearchParams(window.location.search).has('test') ? 'calyApp-test' : 'calyApp';
    const isTest = DB_PATH === 'calyApp-test';
  </script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(135deg, #1a0533 0%, #2d0a4e 50%, #1a0533 100%);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 12px 16px 20px; color: #fff; overflow-x: hidden;
    }
    .test-banner {
      background: #ff9800; color: #fff; padding: 6px 14px;
      border-radius: 10px; text-align: center; font-weight: bold;
      margin-bottom: 10px; font-size: 13px; width: 100%; max-width: 480px;
    }
    .game-header { text-align: center; margin-bottom: 12px; width: 100%; max-width: 480px; }
    .game-title {
      font-size: 28px; font-weight: 900;
      background: linear-gradient(135deg, #f472b6, #c084fc, #818cf8);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 10px;
    }
    .progress-bar-wrap {
      background: rgba(255,255,255,0.1);
      border-radius: 50px; height: 10px; width: 100%; margin-bottom: 6px;
    }
    .progress-bar-fill {
      background: linear-gradient(90deg, #f472b6, #c084fc);
      height: 100%; border-radius: 50px; transition: width 0.4s ease;
    }
    .progress-text { font-size: 13px; color: rgba(255,255,255,0.6); }

    .question-card {
      background: rgba(244,114,182,0.07);
      border: 2px solid rgba(244,114,182,0.25);
      border-radius: 28px; padding: 16px 16px 14px;
      width: 100%; max-width: 480px;
      text-align: center; position: relative; margin-bottom: 14px;
    }
    .question-card::before {
      content: '';
      position: absolute; top: 0; left: 0; right: 0; height: 4px;
      background: linear-gradient(90deg, #f472b6, #c084fc, #818cf8, #c084fc, #f472b6);
      border-radius: 28px 28px 0 0;
    }
    .listen-icon {
      font-size: 54px; margin-bottom: 8px;
      animation: pulse 2.2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.08); }
    }
    .listen-label {
      font-size: 16px; color: rgba(255,255,255,0.85);
      font-weight: 700; margin-bottom: 10px;
    }
    .speak-btn {
      background: rgba(244,114,182,0.15);
      border: 2px solid rgba(244,114,182,0.4);
      border-radius: 50px; color: #f9a8d4; font-size: 15px;
      padding: 9px 22px; cursor: pointer; transition: background 0.2s;
    }
    .speak-btn:active { background: rgba(244,114,182,0.35); }

    .choices-wrap {
      width: 100%; max-width: 420px;
      display: flex; justify-content: center; gap: 14px;
      margin-bottom: 20px;
    }
    .letter-btn {
      flex: 1;
      min-height: 80px;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(38px, 13vw, 62px); font-weight: 900;
      border-radius: 22px;
      background: rgba(244,114,182,0.1);
      border: 3px solid rgba(244,114,182,0.35);
      color: #fce7f3;
      cursor: pointer;
      transition: transform 0.12s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .letter-btn:active { transform: scale(0.91); }
    .letter-btn.correct {
      background: linear-gradient(135deg, #16a34a, #15803d) !important;
      border-color: #86efac !important;
      box-shadow: 0 0 26px rgba(34,197,94,0.8) !important;
      animation: bumpIn 0.35s ease;
    }
    .letter-btn.wrong {
      background: linear-gradient(135deg, #dc2626, #b91c1c) !important;
      border-color: #fca5a5 !important;
      animation: shake 0.45s ease;
    }

    .feedback-zone {
      min-height: 54px; text-align: center;
      width: 100%; max-width: 480px; margin-bottom: 10px;
    }
    .feedback-msg {
      font-size: 17px; font-weight: bold;
      padding: 12px 18px; border-radius: 16px;
      animation: bumpIn 0.3s ease; line-height: 1.4;
    }
    .feedback-msg.correct { background: rgba(34,197,94,0.2);  color: #86efac; }
    .feedback-msg.wrong   { background: rgba(239,68,68,0.2);  color: #fca5a5; }

    .btn-next {
      display: none; width: 100%; max-width: 480px;
      padding: 13px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, #f472b6, #db2777);
      color: #fff; font-size: 22px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 20px rgba(244,114,182,0.4);
      margin-bottom: 20px;
    }

    .result-screen { display: none; text-align: center; width: 100%; max-width: 480px; }
    .result-title {
      font-size: 36px; font-weight: 900;
      background: linear-gradient(135deg, #f472b6, #c084fc);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text; margin-bottom: 14px;
    }
    .stars-earned { font-size: 56px; margin: 14px 0; animation: bumpUp 0.6s ease; min-height: 70px; }
    .score-detail { font-size: 18px; color: rgba(255,255,255,0.65); margin-bottom: 14px; }
    .submit-msg   { font-size: 14px; color: rgba(255,255,255,0.5); margin-bottom: 18px; min-height: 22px; }
    .btn-retour {
      width: 100%; padding: 13px; border-radius: 50px; border: none;
      background: linear-gradient(135deg, #fde68a, #f59e0b);
      color: #1a0533; font-size: 20px; font-weight: 900;
      cursor: pointer; box-shadow: 0 4px 20px rgba(253,230,138,0.4);
    }

    .confetti-container { position: fixed; top: 0; left: 0; right: 0; bottom: 0; pointer-events: none; z-index: 100; overflow: hidden; }
    .confetti-piece { position: absolute; border-radius: 2px; animation: confettiFall linear forwards; }
    @keyframes confettiFall { 0% { transform: translateY(-20px) rotate(0deg); opacity: 1; } 100% { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    .star-bg { position: fixed; pointer-events: none; top: 0; left: 0; right: 0; bottom: 0; overflow: hidden; z-index: 0; }
    .star-bg span { position: absolute; font-size: 12px; animation: twinkle linear infinite; }
    @keyframes twinkle { 0%, 100% { opacity: 0.15; transform: scale(0.8); } 50% { opacity: 0.5; transform: scale(1.2); } }
    .content { position: relative; z-index: 1; width: 100%; display: flex; flex-direction: column; align-items: center; }
    @keyframes bumpIn { 0% { transform: scale(0.85); opacity: 0; } 70% { transform: scale(1.04); } 100% { transform: scale(1); opacity: 1; } }
    @keyframes bumpUp { 0% { transform: translateY(30px) scale(0.5); opacity: 0; } 60% { transform: translateY(-10px) scale(1.1); } 100% { transform: translateY(0) scale(1); opacity: 1; } }
    @keyframes shake { 0%, 100% { transform: translateX(0); } 20% { transform: translateX(-8px); } 40% { transform: translateX(8px); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
  </style>
</head>
<body>
  <div class="star-bg" id="starBg"></div>
  <div class="confetti-container" id="confettiContainer"></div>

  <div class="content">
    <div id="testBanner"></div>

    <div class="game-header">
      <div class="game-title">🔊 La voix des lettres</div>
      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar" style="width:0%"></div>
      </div>
      <div class="progress-text" id="progressText">Question 1 / 10</div>
    </div>

    <div class="question-card" id="questionCard">
      <div class="listen-icon">👂</div>
      <div class="listen-label">Quelle lettre entends-tu ?</div>
      <button class="speak-btn" onclick="speakCurrentLetter()">🔊 Réécouter</button>
    </div>

    <div class="choices-wrap" id="choicesWrap"></div>

    <div class="feedback-zone" id="feedbackZone"></div>
    <button class="btn-next" id="btnNext" onclick="nextQuestion()">Suivant →</button>

    <div class="result-screen" id="resultScreen">
      <div class="result-title" id="resultTitle"></div>
      <div class="stars-earned" id="starsEarned"></div>
      <div class="score-detail" id="scoreDetail"></div>
      <div class="submit-msg" id="submitMsg"></div>
      <button class="btn-retour" onclick="goBack()">🎮 Retour aux jeux</button>
    </div>
  </div>

  <script>
    const bg = document.getElementById('starBg');
    for (let i = 0; i < 28; i++) {
      const s = document.createElement('span');
      s.textContent = ['✦','✧','·','⋆','★','☆'][Math.floor(Math.random()*6)];
      s.style.left = Math.random()*100 + '%';
      s.style.top  = Math.random()*100 + '%';
      s.style.animationDuration = (3 + Math.random()*5) + 's';
      s.style.animationDelay    = (Math.random()*5) + 's';
      bg.appendChild(s);
    }
    if (isTest) document.getElementById('testBanner').innerHTML = '<div class="test-banner">🧪 VERSION TEST</div>';

    const LANG      = 'fr-FR';
    const GAME_NAME = 'La Voix des Lettres FR';
    const LETTERS   = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ'.split('');
    const TOTAL_Q   = 10;

    let questions     = [];
    let currentQ      = 0;
    let score         = 0;
    let answered      = false;
    let currentLetter = '';

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function speak(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utt = new SpeechSynthesisUtterance(text);
      utt.lang = LANG; utt.rate = 0.78; utt.pitch = 1.1;
      window.speechSynthesis.speak(utt);
    }

    function speakCurrentLetter() { speak(currentLetter); }

    function playSound(correct) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        if (correct) {
          [523,659,784,1047].forEach((freq, i) => {
            const osc = ctx.createOscillator(), gain = ctx.createGain();
            osc.connect(gain); gain.connect(ctx.destination);
            osc.frequency.value = freq; osc.type = 'sine';
            gain.gain.setValueAtTime(0.25, ctx.currentTime + i*0.1);
            gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + i*0.1 + 0.25);
            osc.start(ctx.currentTime + i*0.1); osc.stop(ctx.currentTime + i*0.1 + 0.25);
          });
        } else {
          const osc = ctx.createOscillator(), gain = ctx.createGain();
          osc.connect(gain); gain.connect(ctx.destination);
          osc.frequency.value = 200; osc.type = 'sawtooth';
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.45);
          osc.start(ctx.currentTime); osc.stop(ctx.currentTime + 0.45);
        }
      } catch(e) {}
    }

    function launchConfetti() {
      const container = document.getElementById('confettiContainer');
      const colors = ['#fde68a','#f472b6','#c084fc','#818cf8','#34d399','#fff'];
      for (let i = 0; i < 45; i++) {
        const piece = document.createElement('div');
        piece.className = 'confetti-piece';
        piece.style.left = Math.random()*100 + '%';
        piece.style.background = colors[Math.floor(Math.random()*colors.length)];
        piece.style.animationDuration = (1.5 + Math.random()*2) + 's';
        piece.style.animationDelay    = (Math.random()*0.5) + 's';
        const size = 8 + Math.random()*10;
        piece.style.width = size+'px'; piece.style.height = size+'px';
        container.appendChild(piece);
        setTimeout(() => piece.remove(), 3800);
      }
    }

    function generateQuestions() {
      return shuffle(LETTERS).slice(0, TOTAL_Q).map(letter => {
        const pool = shuffle(LETTERS.filter(l => l !== letter));
        return { letter, choices: shuffle([letter, pool[0], pool[1]]) };
      });
    }

    function startGame() {
      questions = generateQuestions();
      currentQ = 0; score = 0;
      showQuestion();
    }

    function showQuestion() {
      answered = false;
      document.getElementById('btnNext').style.display      = 'none';
      document.getElementById('feedbackZone').innerHTML     = '';
      document.getElementById('resultScreen').style.display = 'none';
      document.getElementById('questionCard').style.display = '';
      document.getElementById('choicesWrap').style.display  = 'flex';

      const q = questions[currentQ];
      currentLetter = q.letter;

      const wrap = document.getElementById('choicesWrap');
      wrap.innerHTML = '';
      q.choices.forEach(letter => {
        const btn = document.createElement('div');
        btn.className = 'letter-btn';
        btn.textContent = letter;
        btn.onclick = () => checkAnswer(btn, letter === q.letter, q.letter);
        wrap.appendChild(btn);
      });

      document.getElementById('progressBar').style.width  = (currentQ / TOTAL_Q * 100) + '%';
      document.getElementById('progressText').textContent = 'Question ' + (currentQ + 1) + ' / ' + TOTAL_Q;

      setTimeout(() => speak(q.letter), 600);
    }

    function checkAnswer(clickedBtn, isCorrect, correctLetter) {
      if (answered) return;
      answered = true;

      document.querySelectorAll('.letter-btn').forEach(b => {
        b.onclick = null; b.style.cursor = 'default';
      });

      if (isCorrect) {
        clickedBtn.classList.add('correct');
        score++;
        playSound(true);
        launchConfetti();
        document.getElementById('feedbackZone').innerHTML =
          '<div class="feedback-msg correct">⭐ Bravo ! C\'est bien la lettre ' + correctLetter + ' !</div>';
        speak('Bravo ! C\'est bien la lettre ' + correctLetter + ' !');
      } else {
        clickedBtn.style.animation = 'none';
        clickedBtn.style.borderColor = '#f87171';
        clickedBtn.style.background = 'rgba(248,113,113,0.25)';
        void clickedBtn.offsetWidth;
        clickedBtn.style.animation = 'shake 0.45s ease';
        document.querySelectorAll('.letter-btn').forEach(b => {
          if (b.textContent === correctLetter) b.classList.add('correct');
        });
        playSound(false);
        document.getElementById('feedbackZone').innerHTML =
          '<div class="feedback-msg wrong">💪 C\'était la lettre ' + correctLetter + ' ! Réécoute bien.</div>';
        speak('C\'était la lettre ' + correctLetter);
      }

      const btnNext = document.getElementById('btnNext');
      btnNext.style.display   = 'block';
      btnNext.style.animation = 'none';
      void btnNext.offsetWidth;
      btnNext.style.animation = '';
    }

    function nextQuestion() {
      document.getElementById('btnNext').style.display = 'none';
      currentQ++;
      if (currentQ < TOTAL_Q) showQuestion();
      else showResult();
    }

    function getStars(s) {
      if (s >= 8) return 2;
      if (s >= 5) return 1;
      return 0;
    }

    function showResult() {
      document.getElementById('questionCard').style.display = 'none';
      document.getElementById('choicesWrap').style.display  = 'none';
      document.getElementById('feedbackZone').innerHTML     = '';
      document.getElementById('btnNext').style.display      = 'none';
      document.getElementById('progressBar').style.width    = '100%';

      const earned = getStars(score);
      document.getElementById('resultScreen').style.display = 'block';

      let title;
      if (earned >= 2) title = 'Parfait ! 🎉';
      else if (earned === 1) title = 'Bien joué !';
      else if (score >= 3) title = 'Pas mal !';
      else title = 'Continue !';

      document.getElementById('resultTitle').textContent = '🔊 ' + title;
      document.getElementById('starsEarned').textContent = earned > 0 ? '⭐'.repeat(earned) : '😊';
      document.getElementById('scoreDetail').textContent = score + ' / ' + TOTAL_Q + ' bonnes réponses';

      if (earned > 0) {
        launchConfetti();
        speak(earned >= 2 ? 'Parfait ! Tu as gagné deux étoiles !' : 'Bien joué ! Tu as gagné une étoile !');
      } else {
        speak('Continue à t\'entraîner, tu vas y arriver !');
      }
      submitStars(earned);
    }

    async function submitStars(earned) {
      if (earned === 0) {
        document.getElementById('submitMsg').textContent = 'Rejoue pour gagner des étoiles !';
        return;
      }
      try {
        document.getElementById('submitMsg').textContent = '⏳ Envoi en cours...';
        const snap = await db.ref(DB_PATH + '/pendingGameStars').get();
        const val  = snap.val();
        const arr  = val ? (Array.isArray(val) ? val : Object.values(val)).filter(Boolean) : [];
        arr.push({
          id: Date.now().toString(),
          game: GAME_NAME,
          stars: earned,
          playedAt: new Date().toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })
        });
        await db.ref(DB_PATH + '/pendingGameStars').set(arr);
        document.getElementById('submitMsg').textContent =
          '✅ ' + earned + (earned > 1 ? ' étoiles' : ' étoile') + ' en attente de validation !';
      } catch(e) {
        document.getElementById('submitMsg').textContent = '❌ Erreur d\'envoi. Dis-le à Papa !';
      }
    }

    function goBack() {
      window.location.href = 'jeux.html' + (isTest ? '?test' : '');
    }

    startGame();
  </script>
</body>
</html>
